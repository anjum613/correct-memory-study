SPECIALIZATION_NOTE: >-
  Some items have generic validity antecedents. Their specialization is the
  source-memory, applicability-shift, treatment-comparison, or joint-security
  content documented in generic-validity-comparison.yaml; generic antecedents
  are not claimed as novel.

REQUIREMENTS_INCONSISTENTLY_ESTABLISHED:
  - CRITERION: C2_RESOURCE_BALANCED_COMPARISON
    OBSERVATION: >-
      Two of five applicable papers establish the relevant delivery-resource
      comparison and three do not. Equal-length controls appear in BASM and the
      experience-safety study, but only the latter covers the resources relevant
      to its stated semantic-content claim under the frozen criterion.
  - CRITERION: C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION
    OBSERVATION: >-
      Among five applicable designs, three establish pre-outcome treatment
      selection, one does not, and one remains undetermined. Outcome-defined
      case collection is legitimate for the harmful-skills diagnostic claim
      but would not identify a prevalence or prospectively locked transfer
      effect.
  - CRITERION: D3_UNIT_AND_REPLICATION_VALIDITY
    OBSERVATION: >-
      Four of six papers use distinct benchmark cases as defensible units
      without pseudoreplication; two stochastic or evolving-agent studies do
      not establish independent execution or longitudinal treatment.
  - CRITERION: A1_TARGET_TASK_INCOMPLETENESS
    OBSERVATION: >-
      None of the three claims for which a genuinely outstanding target is
      applicable supplies a systematic initial-state or no-op demonstration.
      The other three claims do not require this proposition.
  - CRITERIA:
      - B4_EXPLICIT_APPLICABILITY_PREDICATE
      - B6_NO_SECOND_MAJOR_MISMATCH
    OBSERVATION: >-
      Explicit applicability is established in two of three applicable claims,
      while no applicable paper establishes that the intended transfer
      difference is unconfounded by a second major mismatch.

DIFFERENT_BUT_LEGITIMATE_ESTIMANDS:
  BASM_WHEN_NOT_TO_IMITATE: >-
    Boundary-aware memory effects on tool preference and benchmark-level
    utility or attack-success marginals.
  AGENT_SKILLS_CAN_BE_HARMFUL: >-
    Retrospective discovery and taxonomy of outcome-selected functional and
    efficiency regressions, not prevalence.
  SLBENCH: >-
    Artifact-grounded compliance with logical relations in skills, not
    task-complete security.
  SWE_SKILLS_BENCH: >-
    The total marginal effect of making a selected skill package available on
    functional success and token use.
  EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY: >-
    Unsafe compliance after benign or mixed experience accumulation and the
    resulting refusal-versus-utility trade-off.
  SECUREVIBEBENCH: >-
    Descriptive joint functional and security performance of coding agents,
    without a memory or skill intervention.
ESTIMAND_CONCLUSION: >-
  Existing evaluations instantiate different subsets of the evidence required
  for different causal claims. A criterion marked NOT_APPLICABLE is not a
  methodological criticism; it records that the paper estimates something
  else.

PRIORITY_DISTINCTIONS:
  RELEVANCE_VERSUS_APPLICABILITY:
    OBSERVATION: >-
      Procedural relevance is established in all five applicable memory/skill
      studies. Applicability is a separate proposition: it applies to only
      three claims and is established in two. BASM makes the distinction most
      explicitly; the experience-safety study names broad context classes but
      not a procedure-level safe-transfer predicate.
    FRAMEWORK_VALUE: >-
      Separate B3, B4, and B5 prevent topical similarity from silently standing
      in for a verified transfer condition.
  SOURCE_CORRECTNESS_VERSUS_FOCAL_SOURCE_SAFETY:
    OBSERVATION: >-
      BASM establishes source functional success where B1 applies, while focal
      source safety is not part of its own claim. The experience-safety paper's
      benign-source characterization makes B2 relevant, but a common focal
      witness is not applied at source. No paper establishes both propositions
      for the stronger estimand.
    FRAMEWORK_VALUE: >-
      B1 and B2 prevent successful source trajectories or benign task labels
      from serving as unexamined proxies for focal source safety.
  MEMORY_CONTENT_VERSUS_CONTEXT_OR_RESOURCE_BURDEN:
    OBSERVATION: >-
      Four papers have an appropriate control for their stated content or total
      treatment claim, but only two establish the relevant resource comparison.
      BASM and the experience-safety study use equal-length controls; BASM does
      not report the full runtime burden of its augmented pipeline.
    FRAMEWORK_VALUE: >-
      C2 and C3 separate the total effect of loading a skill from a semantic
      content effect and require resource differences to be visible.
  DELIVERY_VERSUS_UPTAKE:
    OBSERVATION: >-
      All five memory/skill designs establish delivery fidelity and, where a
      mechanism claim makes uptake applicable, provide some behavioral or
      trace-level engagement evidence. Evidence ranges from benchmark-wide
      probes to a targeted case study.
    FRAMEWORK_VALUE: >-
      C1 and D1 keep intervention delivery distinct from the claimed behavioral
      pathway and expose the scope of engagement evidence.
  GENUINE_TARGET_INCOMPLETENESS:
    OBSERVATION: >-
      A1 is not established in any of the three designs where task
      incompleteness is relevant. SecureVibeBench supplies strong downstream
      functional/security states but does not systematically show that every
      untouched parent state fails the reconstructed request.
    FRAMEWORK_VALUE: >-
      A1 blocks task credit from an already satisfied initial state or a no-op.
  JOINT_FUNCTIONAL_AND_SECURITY_CONTROLS:
    OBSERVATION: >-
      SecureVibeBench establishes task-completing vulnerable and secure states,
      feature retention, an executable focal witness, and joint outcome
      categories. The other papers estimate nonsecurity or marginal outcomes
      for which these criteria are mostly not applicable.
    FRAMEWORK_VALUE: >-
      A2-A5 and D2 distinguish task failure, task-complete insecurity, and
      task-complete security rather than allowing one endpoint to proxy for the
      other.
  OUTCOME_AWARE_SKILL_OR_SOURCE_SELECTION:
    OBSERVATION: >-
      Three of five applicable studies establish pre-outcome skill choice; one
      targeted mitigation study does not and one is undetermined. The
      harmful-skills paper predefines the candidate pair space but intentionally
      selects outcome-defined cases for diagnosis.
    FRAMEWORK_VALUE: >-
      C4 makes the needed locking rule depend on the claim: outcome-selected
      cases can support taxonomy work but require a new prospective lock for a
      target-level causal estimate.

PRECISION_BEYOND_GENERIC_BENCHMARK_VALIDITY:
  - >-
    It separates source procedure correctness, source focal safety, procedural
    relevance, and safe applicability instead of treating all as task validity.
  - >-
    It represents applicability as a named directional source-to-target
    predicate shift and separately checks for another major incompatibility.
  - >-
    It requires both insecure and secure task-completing states and feature
    retention around one focal security witness.
  - >-
    It separates memory delivery, resource burden, semantic-content controls,
    behavioral uptake, and outcome-blind source locking.
  - >-
    It defines the outcome as task-complete insecurity, avoiding a change of
    estimand caused by separate marginals or post-treatment conditioning.
GENERIC_OVERLAP_ACKNOWLEDGEMENT: >-
  Target nontriviality, outcome validity, source correctness, treatment
  reproducibility, and unit/replication validity have substantive generic
  antecedents in ABC and are not claimed as wholly new.

STRONGER_ESTIMAND_REUSE:
  PAPERS_ESTABLISHING_ALL_18_REQUIREMENTS: 0
  TOTAL_PAPERS: 6
  INTERPRETATION: >-
    No audited setup as published simultaneously establishes the complete
    evidence chain for the specific source-correct, source-safe,
    security-precondition-shift causal claim. This is an expected consequence
    of different estimands, not a finding that the papers are invalid.

NOVELTY_STRESS_TEST:
  RESULT: FRAMEWORK_PARTIALLY_DISTINCTIVE
  RATIONALE: >-
    The audit does not support claiming that every component is novel. BASM
    already distinguishes relevance from applicability and uses semantic
    controls; the experience-safety study controls prompt length and measures a
    safety effect of memory; SecureVibeBench supplies unusually strong joint
    functional/security outcomes. The final framework remains distinctive in
    combining these with demonstrated focal source safety, a named directional
    predicate shift, exclusion of a second major mismatch, target no-op
    validation, dual task-completing security controls, feature retention,
    outcome-blind source locking, and a joint task-complete-insecurity estimand.
    Because important ingredients are already present separately, the honest
    conclusion is partial rather than complete distinctiveness.

SCIENTIFIC_DECISION: EXTERNAL_VALIDATION_SUPPORTS_METHODOLOGY_PAPER
SCIENTIFIC_DECISION_RATIONALE: >-
  The frozen framework makes interpretable distinctions across all six close
  works and identifies a combination not simultaneously instantiated by any of
  them, while the partial-distinctiveness result narrows the novelty claim to
  the integrated security-sensitive transfer contract rather than its generic
  components.
CLAIM_BOUNDARY: >-
  The supported conclusion is that existing evaluations instantiate different
  subsets of the evidence required for different causal claims. The audit does
  not support the statement that existing memory benchmarks are invalid.
