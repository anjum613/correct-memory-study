STATED_PRIMARY_CLAIM: Reconstructed vulnerability-introducing scenarios provide realistic
  repository-level secure-coding tasks with joint functional, dynamic focal-vulnerability,
  and static new-risk evaluation; across evaluated agents and models, even the best configuration
  produces only 23.8% solutions classified correct and secure.
STATED_UNIT_OF_ANALYSIS: One agent-model execution on one of 105 repository task instances;
  outcome rates aggregate the four mutually exclusive patch categories.
MEMORY_OR_SKILL_TREATMENT:
CONTROL_CONDITIONS: Historical parent-of-vulnerability-introducing, vulnerability-introducing,
  and vulnerability-fixing repository states validate scenario and PoV; generated patches
  are compared with the human gold patch's test behavior and pre-patch SAST findings.
TARGET_TYPE: Security-neutral natural-language requirements over the repository state immediately
  before a real human vulnerability-introducing commit in 41 C/C++ projects.
FUNCTIONAL_ENDPOINT: Differential test behavior of the agent patch versus the gold human patch
  across repository tests that passed in the pre-patched version.
SECURITY_ENDPOINT_IF_ANY: A per-instance proof-of-vulnerability for the historical focal vulnerability
  plus Semgrep 1.137.0 scanning for newly introduced risks; static-only findings are labeled
  suspicious rather than vulnerable.
REVIEWER_A_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: A benchmark asking agents to implement a historical requirement
      needs evidence that the parent repository does not already satisfy that requirement
      and that a no-op cannot be classified correct.
    EVIDENCE_LOCATION: ACL 2026 paper Sections 3.1-3.2 and Appendix B, Functionality Oracle
      Acquisition.
    EVIDENCE_SUMMARY: The task starts at the parent of the vulnerability-introducing commit
      and functional tests compare agent behavior with the gold patch, but the reported oracle
      check only ensures at least one selected test already passed in the pre-patched version;
      no systematic no-op rejection or fail-to-pass requirement is reported.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Joint secure-coding evaluation requires a state that implements
      the requested behavior yet contains the focal vulnerability.
    EVIDENCE_LOCATION: ACL 2026 paper Sections 3.1-3.2 and Figures 2-3.
    EVIDENCE_SUMMARY: The historical vulnerability-introducing commit supplies the gold requirement
      implementation, its behavior defines the functional reference, and a verified PoV demonstrates
      the focal vulnerability in that commit.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The conclusion that agents can sometimes generate correct and
      secure patches requires observed states meeting both endpoints.
    EVIDENCE_LOCATION: ACL 2026 paper Section 3.1, Figure 4, and Tables 3-4.
    EVIDENCE_SUMMARY: C-SEC is defined only for a patch matching gold functional behavior,
      not triggering the focal PoV, and introducing no SAST finding; such outcomes are observed
      across evaluated configurations, including the reported 23.8% maximum.
  A4_FEATURE_RETENTION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A secure classification must retain the requested behavior rather
      than obtain safety by omitting the change.
    EVIDENCE_LOCATION: ACL 2026 paper Section 3.1, Functionality definition and four outcome
      categories.
    EVIDENCE_SUMMARY: "Security labels are applied jointly with a differential functional
      check: C-SEC patches must match the gold patch's test behavior, while functionally mismatching
      patches enter the incorrect category."
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The benchmark's correct-but-vulnerable distinction requires an
      executable witness specific to the historical vulnerability.
    EVIDENCE_LOCATION: ACL 2026 paper Sections 3.1-3.2, Figures 2-3, and Appendix B SAST Configuration.
    EVIDENCE_SUMMARY: ARVO or OSS-Fuzz PoVs are executed to verify secure VFC, vulnerable
      VIC, and secure PVIC states before inclusion and then classify agent patches for the
      focal vulnerability. Semgrep findings are separately and cautiously labeled suspicious
      because of false alarms.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: SecureVibeBench contains no procedural memory or skill transferred
      from a source execution.
    EVIDENCE_LOCATION: Not applicable; ACL 2026 paper Sections 3.1-3.2.
    EVIDENCE_SUMMARY: The intervention is agent coding from a requirement and repository,
      not source-procedure reuse.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
