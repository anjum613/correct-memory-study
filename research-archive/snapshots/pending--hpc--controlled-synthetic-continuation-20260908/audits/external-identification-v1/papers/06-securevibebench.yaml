  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The central claim is explicitly about code that is both correct
      and secure, so functional and security states must be jointly identified.
    EVIDENCE_LOCATION: ACL 2026 paper Section 3.1, Figure 4, and Tables 3-4.
    EVIDENCE_SUMMARY: 'Every patch is assigned to one mutually exclusive category: incorrect,
      correct-but-vulnerable, correct-but-suspicious, or correct-and-secure. Security claims
