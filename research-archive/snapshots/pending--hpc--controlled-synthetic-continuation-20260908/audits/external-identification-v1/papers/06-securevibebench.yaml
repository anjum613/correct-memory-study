SUPPORTED_INTERPRETATION: On 105 reconstructed C/C++ scenarios, generated patches are jointly
  classified by differential functionality, a dynamic focal vulnerability witness, and static
  new-risk findings. The benchmark contains task-completing vulnerable and secure states and
  keeps security interpretable alongside functionality.
INTERPRETATIONS_NOT_ESTABLISHED:
  - That every untouched parent repository fails the reconstructed functional request.
  - That static suspicious findings are confirmed vulnerabilities; the paper explicitly avoids
    that interpretation.
  - Stability across repeated stochastic agent executions.
  - Any causal effect of procedural memory or of a source-to-target applicability-condition
    shift.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - A systematic untouched-repository no-op check.
  - A source procedural memory demonstrated functionally correct and safe under the same focal
    witness.
  - Evidence of shared procedure, a named predicate true at source and false at target, and
