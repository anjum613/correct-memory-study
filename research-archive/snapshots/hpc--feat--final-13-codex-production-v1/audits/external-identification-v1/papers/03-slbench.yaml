    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The unsafe-rate claim requires relation-specific evidence that
      distinguishes violation, compliance, and insufficient evidence.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1-3.2; Appendix G and Table 6
    EVIDENCE_SUMMARY: Graders use durable artifacts, repository state, and command traces,
      require affirmative unsafe evidence, retain an inconclusive category, and are stress-tested
      with a precedence-agnostic dual grader.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The claim concerns whether agents resolve clauses from a source
      skill; it does not claim that a source implementation of the procedure was demonstrated
      to work.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: A focal-safe source execution is not part of the logical-relation
      following estimand.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Each case must genuinely exercise the skill relation whose following
      is being measured.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.2-3.3 and Appendix E
    EVIDENCE_SUMMARY: Only source-grounded, high-impact, locally testable relations proceed;
      the builder derives the request, seeded repository, and deterministic contract from
      the selected clauses, followed by execution and audit.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Conditions and precedence among clauses are the direct object
      of the paper's benchmark.
    EVIDENCE_LOCATION: arXiv v1, Section 3.1 and Table 1
    EVIDENCE_SUMMARY: The formal clause tuple includes a governing condition, and the eight
      relation types explicitly encode gates, limits, fallback triggers, exceptions, and priority
      rules.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: SLBench tests following a relation instantiated from the same
      skill; it does not estimate transfer from a demonstrated source context to a target
      where one predicate changes.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not claim a uniquely identified source-target
      precondition shift.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Reliable relation-following measurement requires delivery of
      the original skill and stable case materials.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.2 and 4.2
    EVIDENCE_SUMMARY: Every agent is run on each case with the original skill file, user prompt,
      local environment, and deterministic grader, and the relation-to-contract schema is
      documented.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Resource differences are relevant to attributing the targeted
      mitigation improvement specifically to operationalized relations.
    EVIDENCE_LOCATION: arXiv v1, Section 4.3 and Appendix H
    EVIDENCE_SUMMARY: The SLGuard comparison fixes skill, fixture, model interface, and grader
      but adds a checklist prompt. Appendix H gives aggregate pipeline token estimates and
      median execution times, not matched condition-specific context, action, tool, and runtime
      accounting for the 11 mitigation pairs.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The claim that relation-aware scaffolding, specifically, causes
      the mitigation requires separation from generic checklist, caution, or added-context
      effects.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.4 and 4.3
    EVIDENCE_SUMMARY: Standard and SLGuard prompts are compared, but there is no length-matched
      generic checklist or unrelated-caution placebo for the mitigation study.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Outcome-blind case and skill selection matters to a causal reading
      of the SLGuard reduction.
    EVIDENCE_LOCATION: arXiv v1, Section 4.3
    EVIDENCE_SUMMARY: SLGuard is applied to 11 high-quality cases specifically because they
      were graded as violations in the original-skill condition; the mitigation analysis is
      therefore explicitly outcome-targeted.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The paper claims agents miss or operationalize relations, so
      final text alone is insufficient evidence of skill engagement.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1-3.2 and 4.4; Appendices F-G
    EVIDENCE_SUMMARY: Classification uses command traces, mutations, and artifacts; relation-level
      human audit and clarified-skill reruns further connect skill wording to behavioral changes.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The paper interprets many violations as completing the salient
      task while missing a governing relation, which requires joint task and safety evidence.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1 and 4.2; Appendix D worked example
    EVIDENCE_SUMMARY: The worked postcondition example verifies that the primary action was
      completed before the unsafe omission, but the headline safe, unsafe, and inconclusive
      categories do not separately score main-task completion for all 86 cases.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Descriptive rates and the mitigation effect should distinguish
      case breadth from stochastic execution replication.
    EVIDENCE_LOCATION: arXiv v1, Sections 4.2-4.3, Limitations, and Appendix H, Table 7
    EVIDENCE_SUMMARY: The 532 sessions equal one execution for each of 86 cases and six configurations
      plus 16 ablation reruns. The 11-case mitigation uses one guarded realization per selected
      case, and no independent seed repetition is reported.
