      repeated grading or duplicate seeds as independent. One realization limits stochastic
      stability claims but does not violate this criterion as frozen.
SUPPORTED_INTERPRETATION: For the curated source-grounded cases, the evaluated agents often
  produce artifact-level violations of explicit skill relations. Deterministic graders, inconclusive
  outcomes, safe-control cases, and targeted SLGuard comparisons support the paper's relation-following
  claim.
INTERPRETATIONS_NOT_ESTABLISHED:
  - A source procedure independently demonstrated correct and focal-safe.
  - A source-to-target security-precondition shift isolated from other mismatches.
  - A task-complete-insecurity effect with same-request secure and insecure functional controls.
  - A checklist semantic effect separated from generic extra context, or outcome-blind choice
    of the targeted mitigation subset.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - A genuinely incomplete target and joint functional/security controls with feature retention.
