  ACCESS_STATUS: NOT_REPORTED
STATED_PRIMARY_CLAIM: 'Logical-relation following is a distinct reliability challenge for
  skill-guided agents: an 86-case executable benchmark reveals substantial unsafe relation-violation
  rates across agents and backbones, and making latent relations explicit through SLGuard
  reduces violations on targeted original-violation cases.'
STATED_UNIT_OF_ANALYSIS: An agent-backbone execution on one curated logical-relation case;
  benchmark rates aggregate case runs, while mitigation and human analyses use targeted case
  subsets.
MEMORY_OR_SKILL_TREATMENT: The original public SKILL.md and a realistic task fixture; for
  mitigation, the same skill plus an automatically generated relation checklist.
CONTROL_CONDITIONS: Thirty-nine safe-control cases where the same relation can be exercised
  safely, 47 violation-eliciting cases, standard versus SLGuard runs on 11 original violations,
  and original versus manually clarified wording on a 12-case audit subset.
TARGET_TYPE: Controlled local repositories or folders that operationalize one of eight source-grounded
  logical relation types from public skills.
FUNCTIONAL_ENDPOINT: Relation-specific safe evidence, unsafe evidence, or insufficient evidence
  from final artifacts and execution traces; no independent benchmark-wide full-task-success
  endpoint is reported.
SECURITY_ENDPOINT_IF_ANY: Deterministic relation-specific violation signals covering operational
  harms such as secret exposure, forbidden mutations, approval bypass, incomplete cleanup,
  or unsafe fallback behavior.
REVIEWER_A_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: SLBench estimates whether an agent resolves a skill relation
      safely, not whether an absent software feature is implemented; a no-op fail-to-pass
      contract is not required for that stated relation-following claim.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: Cases are scoped around observable relation resolution rather than a
      pre-intervention feature-addition estimand.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: An unsafe relation can be established by a prohibited action
      or artifact even when full task completion is not the paper's estimand.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.2 and Appendix G.
    EVIDENCE_SUMMARY: The paper evaluates relation violations, not task-complete insecurity
      for one requested implementation.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper's safe relation outcome is not defined as a matched
      secure completion of a common software feature.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: Safe controls exercise logical relations, but the stated claim does
      not require a secure task-completing implementation control.
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: SLBench does not study a secure repair to a feature-bearing target
      program.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: Relation compliance, rather than retention after a security repair,
      is the endpoint.
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The unsafe-rate claim requires grounded, discriminating witnesses
      for each target relation.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.2-3.3, Section 4.5, and Appendix G.
    EVIDENCE_SUMMARY: Deterministic graders inspect durable artifacts, commands, and final
      state, require affirmative unsafe evidence, distinguish inconclusive runs, use fixture-tested
      safe/unsafe variants, and expose the consequence of their unsafe-first precedence rule.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Public skill clauses serve as normative specifications; the paper
      does not claim that each source procedure was demonstrated to work in a separate source
      execution.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: The benchmark compiles skill text into tests rather than transferring
      a source-success trajectory.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper evaluates compliance with source skill relations but
      does not claim a procedure proven focal-safe in an original source state.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: No same-witness source safety execution is part of the stated estimand.
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A test of relation following must instantiate the operation and
      clauses actually present in the selected skill.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1-3.3 and Appendices B-D.
    EVIDENCE_SUMMARY: Cases retain source clause text, a selected primary workflow, the governed
      action and condition, and traceability metadata; tasks and graders are generated specifically
      around that relation.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Conditions, gates, exceptions, and priority relations are the
      object of the paper's claim.
    EVIDENCE_LOCATION: arXiv v1 Section 3.1, Table 1, and Appendices B-D.
    EVIDENCE_SUMMARY: The schema explicitly names each clause's governing condition and action
      and formalizes preconditions, postconditions, constraints, fallbacks, exceptions, overrides,
      conflicts, and conjunctions.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: SLBench instantiates a skill relation in a target fixture but
      does not claim that the same procedure moved from a verified source state where a predicate
      held to a target state where it failed.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: The source text defines a relation; no paired source-target predicate
      transition is estimated.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: There is no source-target transfer contrast for which a unique
      focal mismatch must be isolated.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.3.
    EVIDENCE_SUMMARY: The claim concerns execution of grounded skill relations within constructed
      target cases.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The relation-following claim requires the original skill and
      its targeted clauses to be delivered in a traceable form.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.2-3.4 and Appendices B-D.
    EVIDENCE_SUMMARY: The pipeline materializes the original SKILL.md, preserves source clause
      text and relation metadata, and holds the skill, prompt, environment, and grader fixed
      when adding the SLGuard checklist.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The mitigation's content interpretation requires accounting for
      the extra checklist's context and execution burden.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.4 and 4.3; Appendix H.
    EVIDENCE_SUMMARY: SLGuard holds the original skill, prompt, environment, interface, and
      grader fixed, and the paper reports broad pipeline token estimates, but it does not
      token-match the checklist or report per-condition action, token, and runtime differences
      for the mitigation contrast.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The claim that relation-aware content causes mitigation benefit
      calls for a control separating that content from generic added instruction/checklist
      effects.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.4 and 4.3-4.4.
    EVIDENCE_SUMMARY: Standard versus relation-checklist and original versus clarified wording
      comparisons are reported, but no equal-length neutral or generic-checklist placebo is
      included.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The targeted mitigation claim requires cases to be selected without
      conditioning on their evaluated unguarded outcome.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.3, 4.3, and 4.4.
    EVIDENCE_SUMMARY: The main construction pipeline is described, but SLGuard is applied
      to 11 cases selected because they were original-skill violations and the clarification
      study uses 12 curated high-quality violation cases.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Claims about relation-following failures and text salience require
      behavioral engagement evidence rather than skill delivery alone.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1-3.2, 4.4-4.5, and Appendix G.
    EVIDENCE_SUMMARY: Graders inspect execution traces and artifacts for governed actions;
      human review and paired clarification runs show agents often execute a salient workflow
      component while missing its gate, constraint, or completion relation.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper's outcome is logical-relation compliance itself and
      it does not estimate task-complete insecurity or condition security on a separate post-treatment
      task-success endpoint.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.2 and Section 4.
    EVIDENCE_SUMMARY: Safe, unsafe, and inconclusive labels are defined from relation evidence,
      not from security among only successful tasks.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Benchmark rates and targeted paired analyses need explicit case-level
      units without treating repeated deterministic grading as replication.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.3, 4.1-4.5, and Appendices E-H.
    EVIDENCE_SUMMARY: The paper reports runs by distinct case and backbone, describes the
      86-case composition and targeted subset sizes, and treats deterministic grading as measurement
      rather than as independent repeated evidence.
