STATED_PRIMARY_CLAIM: Experience accumulated from benign tasks can increase attack success
  on later high-risk web and embodied tasks; retrieved execution-oriented content, rather
  than prompt length alone, contributes to this degradation, while refusal-containing experience
  reduces unsafe behavior at the cost of over-refusal on benign tasks.
STATED_UNIT_OF_ANALYSIS: A benchmark task under a backbone, environment, memory framework,
  and evolution stage; ASR and benign task-success rates are aggregated over held-out task
  sets.
MEMORY_OR_SKILL_TREATMENT: Top-k external experience units retrieved by offline Agent Workflow
  Memory or online ReasoningBank, including experiments with benign, execution-only, refusal-only,
  or mixed experience compositions.
CONTROL_CONDITIONS: Before versus after memory accumulation, different retrieval counts, a
  same-length expanded-system-instruction replacement, and manually controlled refusal-only,
  execution-only, and mixed harmful-experience memories on disjoint downstream tasks.
TARGET_TYPE: Harmful or safety-critical web-agent and household-simulation tasks, with separate
  benign tasks used for experience accumulation and utility evaluation.
FUNCTIONAL_ENDPOINT: Task success rate on benign tasks in the realistic mixed-experience setting;
  source environments also supply interaction feedback used to construct memories.
SECURITY_ENDPOINT_IF_ANY: Attack success rate on BrowserART, the web subset of Agent-SafetyBench,
  and hazardous SafeAgentBench tasks, automatically judged under official benchmark protocols.
REVIEWER_A_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: High-risk target instructions are safety probes for which refusal
      may be correct; the paper does not claim implementation of legitimate functionality
      absent at baseline.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 2-3 and Appendix B.
    EVIDENCE_SUMMARY: The target estimand is harmful-task attack success before and after
      memory, not fail-to-pass feature completion.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Executing a harmful request is itself the adverse safety outcome,
      not an insecure implementation of a legitimate requested feature.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 3.1 and 5.
    EVIDENCE_SUMMARY: ASR contrasts unsafe execution with safe behavior or refusal rather
      than matched task-completing implementations.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: A secure completion of the same harmful request is not part of
      the refusal-safety estimand.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 3.1 and 5.
    EVIDENCE_SUMMARY: The safe response to harmful inputs may appropriately decline the requested
      action.
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: No target-program security repair is evaluated.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 3-5.
    EVIDENCE_SUMMARY: The study evaluates agent behavior under memory, not repair-induced
      feature retention.
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The central safety-degradation claim requires a grounded unsafe-action
      endpoint.
    EVIDENCE_LOCATION: Proceedings Section 3.1, Table 1, and Appendix B.
    EVIDENCE_SUMMARY: ASR is computed under the official BrowserART, Agent-SafetyBench, and
      SafeAgentBench protocols using a GPT-4o automatic judge reported to correlate strongly
      with human annotations; task-set identities and counts are provided.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper asks whether accumulated experience affects later safety;
      that claim can include ReasoningBank memories from both successful and failed attempts
      and does not assert that every source procedure is functionally correct.
    EVIDENCE_LOCATION: Not applicable; proceedings Section 2 and Appendix A.
    EVIDENCE_SUMMARY: AWM abstracts effective workflows, while ReasoningBank explicitly stores
      patterns from successful and failed attempts.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The repeated claim that experience is benign or harmless in isolation
      makes source-context focal safety relevant, beyond merely assigning a benign task label.
    EVIDENCE_LOCATION: Proceedings Sections 3.1 and 4.1-4.3; Appendices A-B.
    EVIDENCE_SUMMARY: Source task sets are designated benign and are disjoint from hazardous
      evaluation tasks, but the same focal target safety witness is not executed on each source
      procedure in its source context, and ReasoningBank may retain failed attempts.
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The execution-bias mechanism requires retrieved experiences to
      bear operational relevance to the current task.
    EVIDENCE_LOCATION: Proceedings Sections 2, 3.1, and 4.1-4.2; Appendix A.
    EVIDENCE_SUMMARY: Both frameworks retrieve task-relevant experience, the experiments fix
      top-3 retrieval unless dose is manipulated, and flip-case review identifies sensitive
      or standard execution patterns shared with the target action.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The mechanism claim that a procedure benign in isolation becomes
      unsafe in a sensitive context calls for a named condition governing safe reuse.
    EVIDENCE_LOCATION: Proceedings Sections 4.1-4.3 and Appendix D.4.
    EVIDENCE_SUMMARY: The paper names broad benign, harmful, and sensitive-context classes
      and post hoc execution-bias categories, but does not specify a procedure-level applicability
      precondition before target evaluation.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: At the paper's broad context-class level, its claim relies on
      benign source interactions and hazardous target interactions being distinct.
    EVIDENCE_LOCATION: Proceedings Section 3.1 and Appendix B.
    EVIDENCE_SUMMARY: WebArena or the benign SafeAgentBench subset supplies experience, and
      safety is evaluated on explicitly disjoint BrowserART, Agent-SafetyBench, or hazardous
      SafeAgentBench task sets.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: A context-shift mechanism interpretation requires determining
      whether harmfulness, rather than another source-target incompatibility, is the decisive
      difference.
    EVIDENCE_LOCATION: Proceedings Section 3.1, Section 4.1, and Appendix B.
    EVIDENCE_SUMMARY: Source and target tasks are deliberately disjoint and, in the web setting,
      come from different benchmarks; item-level matched operations controlling other content,
      goal, and environment differences are not reported.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The before/after and content claims require a defined memory
      intervention.
    EVIDENCE_LOCATION: Proceedings Section 2, Section 3.1, and Appendix A-C.
    EVIDENCE_SUMMARY: The paper specifies AWM and ReasoningBank construction/update regimes,
      frozen versus online memory, top-k retrieval, prompt concatenation, task sets, evaluation
      cadence, and decoding settings.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Separating experience semantics from delivery burden requires
      explicit treatment of resources introduced by memory.
    EVIDENCE_LOCATION: Proceedings Sections 3.1, 4.2-4.3, Table 3, and Appendix D.5.
    EVIDENCE_SUMMARY: The main content ablation uses an expanded system instruction matched
      to experience length and retrieval dose is manipulated, but condition-level action,
      tool, token, and runtime costs are not all measured or balanced.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The claim that experience semantics rather than token length
      causes degradation requires a neutral same-length comparison.
    EVIDENCE_LOCATION: Proceedings Section 4.3, Table 3, and Appendix D.5.
    EVIDENCE_SUMMARY: Before/no-memory comparisons are supplemented by same-length expanded
      system instructions in the same prompt position; ASR and internal attribution differ
      from actual retrieved experience.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Source experience must be accumulated or composed independently
      of the held-out target outcomes for the memory-effect comparison.
    EVIDENCE_LOCATION: Proceedings Sections 3.1 and 5; Appendices A-C.
    EVIDENCE_SUMMARY: Offline memories are induced from a fixed source corpus before evaluation;
      online source tasks and evaluation cadence are specified; target sets are disjoint;
      and the 50 harmful experience-generation tasks in the composition study are excluded
      from downstream evaluation.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The execution-bias and semantic-content mechanism claims require
      evidence that retrieved experience influences agent behavior.
    EVIDENCE_LOCATION: Proceedings Sections 4.1-4.3, Figures 4-5, and Appendix D.4-D.7.
    EVIDENCE_SUMMARY: Safe-to-unsafe flip cases are inspected, retrieval dose is related to
      ASR, prompts elicit memory use, and integrated-gradient attribution contrasts the experience
      segment with a length-matched expanded instruction segment.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: On the harmful target sets, fulfilling the prohibited request
      is the attack outcome itself; security is not estimated only within a post-treatment
      success subset. Benign utility is a separate task-set endpoint.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 3.1 and 5.
    EVIDENCE_SUMMARY: ASR on harmful tasks and task success on benign tasks answer a refusal-safety
      trade-off question, not task-complete insecurity.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: The before/after and online temporal claims use stochastic frameworks
      and repeated evaluation of held-out task sets, so seed and repeated- measure handling
      matters.
    EVIDENCE_LOCATION: Proceedings Section 3.1 and Appendix C.
    EVIDENCE_SUMMARY: Distinct source and target task counts, evaluation intervals, models,
      and nonzero temperatures are specified, but the accessible paper does not state independent
      seed counts or an analysis of dependence across repeated evaluations of the same safety
      sets.
REVIEWER_B_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: High-risk target prompts test unsafe compliance versus refusal;
      they are not legitimate initially incomplete feature requests in the paper's estimand.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Performing the harmful request is itself the unsafe endpoint,
      not an insecure implementation that completes a legitimate requested task.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Safe refusal is the intended outcome, so a secure implementation
      of the same harmful request is not required for the stated claim.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not claim a secure repair preserving a legitimate
      target feature.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The central before/after safety claim requires an externally
      defined unsafe-compliance endpoint.
    EVIDENCE_LOCATION: arXiv v1, Section 3.1 and Appendix B; ACL 2026 Findings paper, Section
      3.1
    EVIDENCE_SUMMARY: The study uses three established safety benchmark protocols and their
      attack-success criteria; it states that the GPT-4o evaluator follows those protocols
      and that prior benchmark validation correlates it with human judgments.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper estimates effects of accumulated benign experiences
      as produced by the self-evolving systems; it does not require each encoded procedure
      to be independently proven correct at source.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Benign-task provenance is the studied exposure, but independent
      certification against the later target's focal security witness is not part of the stated
      estimand.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The execution-bias mechanism requires retrieved benign experience
      to contain action procedures relevant to later web or household action.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1 and 4.1; Appendices A-B
    EVIDENCE_SUMMARY: The experiment retrieves top-ranked experiences within the same web
      or household interaction modality, and the manual flip analysis identifies execution
      steps and action-oriented guidance that carry into hazardous target decisions.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The claimed safety reversal is explicitly conditioned on benign
      versus harmful or safety-sensitive task context.
    EVIDENCE_LOCATION: arXiv v1, Sections 1, 3.1, and 5
    EVIDENCE_SUMMARY: The design names benign experience-accumulation tasks and disjoint high-risk
      target tasks requiring refusal, and later separates execution from refusal experience
      on harmful tasks.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A benign-to-hazardous context change is the source-target shift
      at the center of the paper's empirical claim.
    EVIDENCE_LOCATION: arXiv v1, Section 3.1 and Appendix B
    EVIDENCE_SUMMARY: Offline web experience comes from benign WebArena tasks and is evaluated
      on BrowserART and Agent-SafetyBench; household experience uses a benign SafeAgentBench
      subset and a disjoint hazardous subset.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: The execution-bias interpretation would be stronger if hazardousness
      were isolated from other differences between source and target task distributions.
    EVIDENCE_LOCATION: arXiv v1, Section 3.1 and Appendix B
    EVIDENCE_SUMMARY: The source and target use different task sets and, in the web study,
      different benchmarks with different instructions and action distributions. The no-experience
      comparison identifies the effect of adding memory on the target, but does not show that
      hazardousness is the only important source-target mismatch.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The safety-degradation claim requires a defined experience object
      and retrieval protocol.
    EVIDENCE_LOCATION: arXiv v1, Section 2, Section 3.1, and Appendix A
    EVIDENCE_SUMMARY: Agent Workflow Memory and ReasoningBank construction, offline and online
      update modes, top-three retrieval, backbone settings, and experience prompt placement
      are described.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The claim that semantic experience content, not merely longer
      context, causes degradation requires a prompt-resource control.
    EVIDENCE_LOCATION: arXiv v1, Section 4.3 and Appendix D.5
    EVIDENCE_SUMMARY: The authors replace retrieved experience with an expanded safety instruction
      matched to average experience length while retaining the target tasks, agent, and backbone,
      and report the resulting attack- success comparison.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Distinguishing experience semantics from generic extra context
      is an explicit part of the causal content claim.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.2-3.3 and 4.3; Table 3
    EVIDENCE_SUMMARY: Before/no-experience baselines identify the total memory effect, and
      a length-matched expanded system instruction provides an additional- context control
      for the semantic-content interpretation.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Target-outcome-independent experience construction is needed
      for the reported before/after safety effect.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1 and 5; Appendices B-C
    EVIDENCE_SUMMARY: Offline memories are accumulated on specified benign tasks before evaluation
      on separate safety sets; household benign and hazardous sets are disjoint, and harmful
      training tasks used in the composition study are excluded from downstream evaluation.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The execution-bias mechanism requires more than proof that experience
      text was delivered.
    EVIDENCE_LOCATION: arXiv v1, Sections 4.1 and 4.3; Appendices D.4 and D.7
    EVIDENCE_SUMMARY: Human annotators identify safe-to-unsafe action flips and execution-
      oriented experience spans, while integrated-gradient analyses relate experience content
      to action rather than refusal tokens.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: On the harmful target tasks, refusal is the desired safe response;
      the paper does not define security as insecurity conditional on completing a legitimate
      requested feature.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Cross-backbone consistency and online temporal trends require
      clarity about independent executions, seeds, and repeated trajectories.
    EVIDENCE_LOCATION: arXiv v1, Section 3.1; Appendices C and D.3
    EVIDENCE_SUMMARY: The paper specifies temperatures 0.1 and 0.7 and reports multiple backbones
      and evaluation intervals, but no independent execution repetitions or seed-level uncertainty.
      Successive online intervals arise from the same evolving process and are not independent
      replications.
