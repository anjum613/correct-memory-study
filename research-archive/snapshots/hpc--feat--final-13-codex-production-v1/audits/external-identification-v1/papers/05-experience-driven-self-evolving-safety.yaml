    EVIDENCE_SUMMARY: Safe-to-unsafe flip cases are inspected, retrieval dose is related to
      ASR, prompts elicit memory use, and integrated-gradient attribution contrasts the experience
      segment with a length-matched expanded instruction segment.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: On the harmful target sets, fulfilling the prohibited request
      is the attack outcome itself; security is not estimated only within a post-treatment
      success subset. Benign utility is a separate task-set endpoint.
    EVIDENCE_LOCATION: Not applicable; proceedings Sections 3.1 and 5.
    EVIDENCE_SUMMARY: ASR on harmful tasks and task success on benign tasks answer a refusal-safety
      trade-off question, not task-complete insecurity.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Cross-backbone consistency and online temporal trends require
      clarity about independent executions, seeds, and repeated trajectories.
    EVIDENCE_LOCATION: ACL 2026 Findings proceedings version, Section 3.1 and Appendices C
      and D.3; https://aclanthology.org/2026.findings-acl.2091/.
    EVIDENCE_SUMMARY: The paper specifies nonzero sampling temperatures and repeated online
      evaluation intervals but does not disclose independent execution seeds or model dependence
      across successive measurements of the same evolving process. The accessible record therefore
      does not establish that stochastic executions and longitudinal observations are represented
      by defensible independent units. This is absence of support, not proof that an undisclosed
      analysis was defective.
SUPPORTED_INTERPRETATION: Across the reported frameworks, backbones, and safety benchmarks,
  retrieved experience increases unsafe compliance relative to the pre-evolution or no-experience
  state. Length-matched controls, dose patterns, behavioral cases, and attribution analyses
  support an execution-oriented content mechanism; refusal experience exposes a safety-utility
  trade-off.
INTERPRETATIONS_NOT_ESTABLISHED:
  - That each source procedure is functionally correct and focal-safe under the target witness.
  - A prospectively named procedure-level applicability predicate or a pair isolated to that
    predicate.
  - A change in task-complete insecurity for a legitimate requested feature with matched secure
    and insecure controls.
  - Seed-level robustness of stochastic and longitudinal comparisons.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - One concrete source procedure shown correct and focal-safe under the same witness.
  - A predeclared procedure-level predicate shown true at source and false at a closely matched
    target, with other major mismatches excluded.
  - A genuinely incomplete legitimate target with task-completing insecure and secure controls
    and feature retention.
  - A joint task-completion/security endpoint, outcome-blind source assignment, focal uptake
    evidence, and independent repetitions.
