  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    TITLE: "When Not to Imitate: Boundary-Aware Skill Memory for Reliable Tool-Use LLM Agents"
    AUTHORS:
      - Zihan Lin
      - Zhenyu Chen
      - Jiawen Wei
      - Xiaohan Wang
      - Jie Cao
      - Jiajun Chai
      - Wei Lin
      - Guojun Yin
      - Ran He
    VERSION: "arXiv:2608.22339v1, submitted 2026-08-23"
    VENUE_OR_STATUS: "Accepted by Findings of EMNLP 2026; official arXiv v1 inspected"
    SOURCE_URLS:
      - TYPE: OFFICIAL_ARXIV_ABSTRACT
        URL: "https://arxiv.org/abs/2608.22339"
        VERSION_OR_DATE: "v1, 2026-08-23"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ARXIV_HTML
        URL: "https://arxiv.org/html/2608.22339v1"
        VERSION_OR_DATE: "v1"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: null
      COMMIT_OR_VERSION: null
      COMMIT_RESOLUTION_SOURCE: "No official repository URL is stated in the accessible arXiv v1 paper."
      ACCESS_STATUS: NOT_REPORTED
    STATED_PRIMARY_CLAIM: >-
      Success-distilled procedural memories can increase wrong-tool confidence
      when a superficially similar task needs a different tool, while BASM's
      explicit applicability, risk, avoidance, and recovery fields improve
      task performance and reduce wrong-tool or attack outcomes relative to
      memory-free and procedural-skill baselines.
    STATED_UNIT_OF_ANALYSIS: >-
      Benchmark instance under a model-scale and memory condition, aggregated
      within BFCL, AppWorld, and AgentDojo evaluations.
    MEMORY_OR_SKILL_TREATMENT: >-
      Retrieved seven-field BASM records built from successful and failed
      contexts, compared with procedure-only and applicability-only skill
      memories under a fixed retrieval and prompt substrate.
    CONTROL_CONDITIONS: >-
      Memory-free Base, Proc Skill, App Skill, fixed-token equal-length neutral
      and procedure controls for probes, and field-removal ablations.
    TARGET_TYPE: >-
      Tool-use benchmark tasks, including inapplicable-function cases,
      repository/app workflows, and prompt-injection scenarios.
    FUNCTIONAL_ENDPOINT: >-
      BFCL accuracy, AppWorld task success rate and average steps, and
      AgentDojo utility.
    SECURITY_ENDPOINT_IF_ANY: >-
      AgentDojo attack success rate; wrong-tool margin and realized wrong-tool
      calls are additional reliability diagnostics.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper estimates benchmark-level memory effects and wrong-tool
          behavior, not whether a software feature absent at baseline was
          implemented; genuine pre-intervention feature absence is not needed
          for that stated claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Section 5.1 define the benchmark endpoints."
        EVIDENCE_SUMMARY: "The evaluated endpoints are benchmark accuracy, task success, utility, steps, and attack success rather than a fail-to-pass feature-addition intervention."
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not estimate task-complete insecurity for a single
          requested implementation; its security result is an AgentDojo ASR
          comparison and therefore does not require this control.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Section 5.1 and Table 3."
        EVIDENCE_SUMMARY: "AgentDojo utility and attack success are reported as benchmark metrics, not as a matched insecure task-completing implementation control."
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A matched secure task-completing implementation is not required for
          the paper's stated comparative benchmark claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Section 5.1 and Table 3."
        EVIDENCE_SUMMARY: "The study compares memory conditions on aggregate benchmark metrics rather than matched secure implementation states."
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The study does not claim that a security repair to a target program
          retains a requested feature.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Section 5."
        EVIDENCE_SUMMARY: "No target-program secure-repair estimand is asserted."
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          An independently grounded safety endpoint is required for the claim
          that BASM reduces attack success.
        EVIDENCE_LOCATION: "arXiv v1 Sections 5.1-5.3, Table 3, and Artifact Use Statement."
        EVIDENCE_SUMMARY: >-
          The study uses AgentDojo v1.2.2's official attack-success evaluation
          alongside utility and reports the framework version and official
          evaluation-script policy.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claim explicitly concerns procedures distilled from past
          successes, so the source status of those procedural memories matters.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.2, especially Skill Extraction."
        EVIDENCE_SUMMARY: >-
          Procedure fields are extracted from successful task contexts, while
          failed contexts are used to add boundary and recovery information;
          deterministic validation is described before storage.
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not claim that its successful source trajectories were
          demonstrated safe under the same focal AgentDojo security property;
          its own reliability comparison does not require that stronger claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 4.2 and 5.1."
        EVIDENCE_SUMMARY: "Source success is used for procedure extraction, but source-context focal security is not part of the stated estimand."
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The wrong-tool and boundary claims require retrieved memories to be
          procedurally relevant rather than arbitrary extra text.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1, 4.2, and 5.1."
        EVIDENCE_SUMMARY: >-
          Retrieval uses task similarity, and the diagnostic partitions
          relevant tasks into applicable, semantically similar but wrong-tool,
          and repair states around the retrieved procedure.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Explicit conditions governing whether a retrieved procedure should
          be followed are the central BASM intervention.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.2, seven-field BASM schema."
        EVIDENCE_SUMMARY: >-
          Each BASM record names applicability conditions, risk cues, avoidance
          rules, and recovery notes, and a boundary checker applies them before
          tool execution.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The paper's imitation-trap claim depends on a learned procedure being
          applicable in its successful context but inapplicable in a similar
          target state.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.2 and Appendix A diagnostic-bucket definitions."
        EVIDENCE_SUMMARY: >-
          The study separates applicable tasks from semantically similar
          wrong-tool tasks that require rejecting the retrieved procedure and
          reports the corresponding wrong-tool margins.
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          Interpreting the diagnostic as an applicability-boundary effect
          requires comparable source and target cases beyond the focal tool
          condition.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.2 and Appendix A."
        EVIDENCE_SUMMARY: >-
          The buckets enforce semantic similarity and distinguish tool
          applicability, but accessible aggregate descriptions do not expose
          item-level source-target matching sufficient to rule out another
          comparably important task or state mismatch.
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The comparative BASM claim requires a defined, reproducible memory
          treatment.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.2 and Figure 3."
        EVIDENCE_SUMMARY: >-
          The seven record fields, extraction inputs, validation, retrieval,
          token-budget assembly, and boundary-checking delivery path are
          specified.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource differences are relevant because BASM adds fields and a
          checking step while the paper attributes differences to memory
          content.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.2 and 5.1; Appendix A equal-length controls and behavior analyses."
        EVIDENCE_SUMMARY: >-
          The paper fixes prompt token budgets, uses equal-length probe
          controls, keeps the backbone and retrieval substrate fixed, and
          reports AppWorld steps, but it does not establish balanced or measured
          runtime costs across the principal memory conditions.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The content-specific boundary claim needs comparisons beyond merely
          adding any text or any skill.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.3-3.4 and 5.1-5.3; Tables 3-4; Appendix A."
        EVIDENCE_SUMMARY: >-
          Base, procedure-only, applicability-only, BASM, field knockouts, and
          equal-token neutral/procedural controls separate generic memory
          loading from boundary-field content.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          Target-outcome-independent memory and diagnostic selection are needed
          for the comparative causal interpretation.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.2 and 5.1."
        EVIDENCE_SUMMARY: >-
          The paper describes extraction, validation, retrieval, fixed
          benchmarks, and evaluation order, but does not provide a prospective
          freeze or enough artifact history to determine whether source skills
          and diagnostic cases were unchanged after target outcomes were seen.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          BASM's mechanism claim requires evidence that boundary fields alter
          model processing and realized tool behavior, not delivery alone.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.3-3.4 and Appendix A attention and paired-behavior analyses."
        EVIDENCE_SUMMARY: >-
          Attention/probe analyses, boundary-field knockouts, realized tool
          calls, and paired outcomes connect delivered fields to behavioral
          engagement.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Because the paper reports both AgentDojo utility and attack success,
          a task-security joint analysis is relevant to interpreting their
          trade-off.
        EVIDENCE_LOCATION: "arXiv v1 Table 3 and Sections 5.1-5.3."
        EVIDENCE_SUMMARY: >-
          Utility and ASR are reported side by side, but accessible results do
          not provide joint cells that distinguish task failure from
          task-complete insecurity for the same runs.
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Aggregate benchmark comparisons require defensible task units and
          must not count deterministic repeats as independent evidence.
        EVIDENCE_LOCATION: "arXiv v1 Section 5.1, Tables 3-4, and Appendix A."
        EVIDENCE_SUMMARY: >-
          Results are aggregated over distinct benchmark instances and model
          scales under near-deterministic decoding; no duplicate-seed count is
          presented as extra independent evidence.
    SUPPORTED_INTERPRETATION: >-
      Within the reported tool-use benchmarks and models, explicitly
      boundary-annotated memories outperform the paper's memory controls on
      several functional, wrong-tool, and attack metrics, with behavioral and
      probe evidence consistent with boundary engagement.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The study does not establish that source procedures were safe under the
      same focal security witness, that AgentDojo improvements are reductions
      in task-complete insecurity, that all resource costs are balanced, or
      that every source-target pair differs only on one predeclared security
      applicability condition.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      Reuse for the stronger estimand would need a target with verified
      pre-intervention incompleteness; matched insecure and secure
      task-completing controls with feature retention; the same focal security
      witness executed in both source and target; item-level proof that a named
      predicate is true in the source and false in the target without a second
      major mismatch; outcome-blind source selection; complete resource
      accounting; and joint task-completion-by-security outcomes.
  - PAPER_ID: AGENT_SKILLS_CAN_BE_HARMFUL
    TITLE: "Agent Skills Can Be Harmful: An Empirical Study of Skill-Induced Failures in LLM Agents"
    AUTHORS:
      - Gen Dong
      - Yanjie Gao
      - Liqun Li
      - Tianyin Xu
      - Yu Hua
      - Fan Yang
    VERSION: "arXiv:2608.11888v1, submitted 2026-08-12"
    VENUE_OR_STATUS: "arXiv preprint v1"
    SOURCE_URLS:
      - TYPE: OFFICIAL_ARXIV_ABSTRACT
        URL: "https://arxiv.org/abs/2608.11888"
        VERSION_OR_DATE: "v1, 2026-08-12"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ARXIV_HTML
        URL: "https://arxiv.org/html/2608.11888v1"
        VERSION_OR_DATE: "v1"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: null
      COMMIT_OR_VERSION: null
      COMMIT_RESOLUTION_SOURCE: "No official study repository URL is stated in the accessible arXiv v1 paper."
      ACCESS_STATUS: NOT_REPORTED
    STATED_PRIMARY_CLAIM: >-
      A differential comparison of a skill-guided run against a no-skill or
      semantically matched reference run can attribute functional failures and
      efficiency regressions to loaded skills; analysis of 307 retained cases
      identifies recurring root causes, including omissions, over-prescription,
      and excessive verification or implementation procedures.
    STATED_UNIT_OF_ANALYSIS: >-
      A paired task-by-skill configuration meeting the paper's functional or
      efficiency differential-case definition; taxonomy counts are over 307
      retained cases.
    MEMORY_OR_SKILL_TREATMENT: >-
      Public skill documents selected by metadata similarity and loaded into
      OpenCode for SkillsBench and SWE-Skills-Bench tasks.
    CONTROL_CONDITIONS: >-
      A run on the same task with no skill or with another semantically matched
      skill; task, verifier, agent, model, repository, and environment are held
      fixed within a pair.
    TARGET_TYPE: >-
      Deterministically graded cross-domain and repository-level agent tasks
      drawn from SkillsBench and SWE-Skills-Bench.
    FUNCTIONAL_ENDPOINT: >-
      Verifier outcome for functional cases; total tokens and wall-clock time
      with a material-regression threshold for efficiency cases.
    SECURITY_ENDPOINT_IF_ANY: null
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Attributing a functional failure to a skill presupposes a genuine
          task whose initial state or no-op does not already satisfy the
          verifier.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-A, III-D, and VIII Threats to Validity."
        EVIDENCE_SUMMARY: >-
          The framework requires a reference run to pass and manually removes
          verifier false positives, but the paper does not report a systematic
          pre-intervention/no-op check for all retained functional cases.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The study's endpoints are functional failure and efficiency, not a
          focal security property of a task-completing implementation.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A and III-D."
        EVIDENCE_SUMMARY: "No task-complete insecurity estimand or security control is part of the stated analysis."
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A secure task-completing state is not required for the paper's
          functional and cost attribution claims.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A and III-D."
        EVIDENCE_SUMMARY: "The paper does not evaluate a focal security endpoint."
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not evaluate a secure repair whose functionality must
          be retained.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A and III-D."
        EVIDENCE_SUMMARY: "Its task-success comparisons are not security-repair comparisons."
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No focal security claim is made.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Section III-D."
        EVIDENCE_SUMMARY: "The outcome definitions cover verifier success, token use, and execution time."
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper evaluates loaded public skills directly and does not claim
          transfer from a procedure demonstrated correct in a separate source
          execution context.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-B and III-C."
        EVIDENCE_SUMMARY: "Skills are selected as documents from public ecosystems, not as validated source executions."
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Source-context focal safety is outside the paper's non-security
          attribution estimand.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Section III."
        EVIDENCE_SUMMARY: "No source or target security witness is defined."
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The finding that seemingly relevant skills cause failures requires
          evidence that the compared skills are procedurally related to their
          tasks.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-B, III-C, IV, and V."
        EVIDENCE_SUMMARY: >-
          Skills are selected using name-and-description similarity with a
          stated threshold and top-k rule; retained cases are then examined
          through paired trajectories and root-cause review rather than being
          classified as harmful solely from metadata.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not estimate safe transfer across a named condition;
          it taxonomizes failures under the evaluated skill-task pairings.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Sections III-V."
        EVIDENCE_SUMMARY: "No paper-level claim requires a predeclared safe-transfer predicate."
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          There is no claimed source-versus-target predicate transition.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A to III-C."
        EVIDENCE_SUMMARY: "The design compares skill configurations on the same target task."
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The study does not identify a source-target condition shift whose
          isolation would require ruling out a second mismatch.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A to III-C."
        EVIDENCE_SUMMARY: "Its principal comparison is within-task across loaded-skill conditions."
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Attribution to a loaded skill requires knowing which skill was
          delivered and whether it was loaded.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-B and III-C."
        EVIDENCE_SUMMARY: >-
          The pipeline fixes the OpenCode version and model, supplies up to six
          named skill configurations, and records the loaded skill and complete
          trajectory for each run.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource accounting is central to the efficiency-regression claim
          and relevant to functional attribution.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-A to III-D and V."
        EVIDENCE_SUMMARY: >-
          Within a pair the task, verifier, agent, model, repository, and
          environment are fixed; the study records skill loading, trajectories,
          tokens, and wall-clock time and explicitly defines a material
          efficiency threshold.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A successful, cheaper, or otherwise comparable reference is required
          for the paper's differential attribution.
        EVIDENCE_LOCATION: "arXiv v1 Section III-A and Figure 2."
        EVIDENCE_SUMMARY: >-
          Each retained differential case compares the target skill run to a
          same-task no-skill or semantically matched-skill reference that passes
          or is materially cheaper, while all non-skill factors are fixed.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The evaluated skills must be selected independently of their run
          outcomes even though the paper intentionally analyzes outcome-defined
          failures afterward.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-B to III-D."
        EVIDENCE_SUMMARY: >-
          Candidate skill configurations are fixed from benchmark-provided
          variants or from a documented metadata-similarity rule before
          execution; outcome criteria subsequently determine which completed
          pairs enter the failure corpus, rather than altering the delivered
          skill.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Root-cause attribution to a skill requires behavioral evidence beyond
          mere delivery.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-C, IV, V, and VI."
        EVIDENCE_SUMMARY: >-
          Loaded-skill records and complete paired trajectories are inspected
          for differential actions, omissions, tool use, and verification
          behavior; SkillTriage likewise extracts evidence from the pair.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not interpret a security endpoint conditional on task
          success.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections III-A and III-D."
        EVIDENCE_SUMMARY: "Functional verdict and efficiency are the only evaluated outcome families."
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Differential attribution with a stochastic hosted model requires a
          defensible account of run-to-run variation at the paired-task unit.
        EVIDENCE_LOCATION: "arXiv v1 Sections III-C, III-D, VI-B, and VIII Threats to Validity."
        EVIDENCE_SUMMARY: >-
          Base task configurations appear to be executed once; manual refinement
          removes cases judged consistent with ordinary variance, but no
          replicated task-run design estimates that variance. The three repeats
          and majority vote apply to SkillTriage reports, not to the underlying
          agent outcomes.
    SUPPORTED_INTERPRETATION: >-
      For the retained paired cases, the study provides trace-backed evidence
      that particular loaded skills are associated with functional failures or
      material cost regressions relative to a same-task reference, and its
      taxonomy describes recurring differential mechanisms in that selected
      corpus.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The study does not establish a population prevalence of harmful skills,
      a focal security effect, source-context correctness or safety, systematic
      no-op invalidity for every task, or robustness of each attributed base
      failure to repeated stochastic executions.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      The stronger estimand would require prospectively chosen source-target
      procedure pairs; demonstrated source correctness and focal source safety;
      a named applicability predicate verified true in the source and false in
      the target with no second major mismatch; verified target incompleteness;
      insecure and secure task-completing controls; a focal executable security
      witness; feature retention; resource-matched memory controls; repeated
      target runs where stochasticity matters; and joint functional-security
      outcomes.
  - PAPER_ID: SLBENCH
    TITLE: "SLBench: Evaluating How LLM Agents Follow Logical Relations in Skills"
    AUTHORS:
      - Xuan Chen
      - Chengpeng Wang
      - Lu Yan
      - Xiangyu Zhang
    VERSION: "arXiv:2607.09016v1, submitted 2026-07-10"
    VENUE_OR_STATUS: "arXiv preprint v1"
    SOURCE_URLS:
      - TYPE: OFFICIAL_ARXIV_ABSTRACT
        URL: "https://arxiv.org/abs/2607.09016"
        VERSION_OR_DATE: "v1, 2026-07-10"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ARXIV_HTML
        URL: "https://arxiv.org/html/2607.09016v1"
        VERSION_OR_DATE: "v1"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: null
      COMMIT_OR_VERSION: null
      COMMIT_RESOLUTION_SOURCE: "No official author repository URL is stated in the accessible arXiv v1 paper."
      ACCESS_STATUS: NOT_REPORTED
    STATED_PRIMARY_CLAIM: >-
      Logical-relation following is a distinct reliability challenge for
      skill-guided agents: an 86-case executable benchmark reveals substantial
      unsafe relation-violation rates across agents and backbones, and making
      latent relations explicit through SLGuard reduces violations on targeted
      original-violation cases.
    STATED_UNIT_OF_ANALYSIS: >-
      An agent-backbone execution on one curated logical-relation case;
      benchmark rates aggregate case runs, while mitigation and human analyses
      use targeted case subsets.
    MEMORY_OR_SKILL_TREATMENT: >-
      The original public SKILL.md and a realistic task fixture; for mitigation,
      the same skill plus an automatically generated relation checklist.
    CONTROL_CONDITIONS: >-
      Thirty-nine safe-control cases where the same relation can be exercised
      safely, 47 violation-eliciting cases, standard versus SLGuard runs on 11
      original violations, and original versus manually clarified wording on a
      12-case audit subset.
    TARGET_TYPE: >-
      Controlled local repositories or folders that operationalize one of
      eight source-grounded logical relation types from public skills.
    FUNCTIONAL_ENDPOINT: >-
      Relation-specific safe evidence, unsafe evidence, or insufficient
      evidence from final artifacts and execution traces; no independent
      benchmark-wide full-task-success endpoint is reported.
    SECURITY_ENDPOINT_IF_ANY: >-
      Deterministic relation-specific violation signals covering operational
      harms such as secret exposure, forbidden mutations, approval bypass,
      incomplete cleanup, or unsafe fallback behavior.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          SLBench estimates whether an agent resolves a skill relation safely,
          not whether an absent software feature is implemented; a no-op
          fail-to-pass contract is not required for that stated relation-following
          claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "Cases are scoped around observable relation resolution rather than a pre-intervention feature-addition estimand."
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          An unsafe relation can be established by a prohibited action or
          artifact even when full task completion is not the paper's estimand.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.2 and Appendix G."
        EVIDENCE_SUMMARY: "The paper evaluates relation violations, not task-complete insecurity for one requested implementation."
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper's safe relation outcome is not defined as a matched secure
          completion of a common software feature.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "Safe controls exercise logical relations, but the stated claim does not require a secure task-completing implementation control."
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          SLBench does not study a secure repair to a feature-bearing target
          program.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "Relation compliance, rather than retention after a security repair, is the endpoint."
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The unsafe-rate claim requires grounded, discriminating witnesses for
          each target relation.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.2-3.3, Section 4.5, and Appendix G."
        EVIDENCE_SUMMARY: >-
          Deterministic graders inspect durable artifacts, commands, and final
          state, require affirmative unsafe evidence, distinguish inconclusive
          runs, use fixture-tested safe/unsafe variants, and expose the
          consequence of their unsafe-first precedence rule.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Public skill clauses serve as normative specifications; the paper
          does not claim that each source procedure was demonstrated to work in
          a separate source execution.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "The benchmark compiles skill text into tests rather than transferring a source-success trajectory."
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper evaluates compliance with source skill relations but does
          not claim a procedure proven focal-safe in an original source state.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "No same-witness source safety execution is part of the stated estimand."
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A test of relation following must instantiate the operation and
          clauses actually present in the selected skill.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.3 and Appendices B-D."
        EVIDENCE_SUMMARY: >-
          Cases retain source clause text, a selected primary workflow, the
          governed action and condition, and traceability metadata; tasks and
          graders are generated specifically around that relation.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Conditions, gates, exceptions, and priority relations are the object
          of the paper's claim.
        EVIDENCE_LOCATION: "arXiv v1 Section 3.1, Table 1, and Appendices B-D."
        EVIDENCE_SUMMARY: >-
          The schema explicitly names each clause's governing condition and
          action and formalizes preconditions, postconditions, constraints,
          fallbacks, exceptions, overrides, conflicts, and conjunctions.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          SLBench instantiates a skill relation in a target fixture but does not
          claim that the same procedure moved from a verified source state
          where a predicate held to a target state where it failed.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "The source text defines a relation; no paired source-target predicate transition is estimated."
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          There is no source-target transfer contrast for which a unique focal
          mismatch must be isolated.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.3."
        EVIDENCE_SUMMARY: "The claim concerns execution of grounded skill relations within constructed target cases."
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The relation-following claim requires the original skill and its
          targeted clauses to be delivered in a traceable form.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.2-3.4 and Appendices B-D."
        EVIDENCE_SUMMARY: >-
          The pipeline materializes the original SKILL.md, preserves source
          clause text and relation metadata, and holds the skill, prompt,
          environment, and grader fixed when adding the SLGuard checklist.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The mitigation's content interpretation requires accounting for the
          extra checklist's context and execution burden.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.4 and 4.3; Appendix H."
        EVIDENCE_SUMMARY: >-
          SLGuard holds the original skill, prompt, environment, interface, and
          grader fixed, and the paper reports broad pipeline token estimates,
          but it does not token-match the checklist or report per-condition
          action, token, and runtime differences for the mitigation contrast.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claim that relation-aware content causes mitigation benefit calls
          for a control separating that content from generic added
          instruction/checklist effects.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.4 and 4.3-4.4."
        EVIDENCE_SUMMARY: >-
          Standard versus relation-checklist and original versus clarified
          wording comparisons are reported, but no equal-length neutral or
          generic-checklist placebo is included.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The targeted mitigation claim requires cases to be selected without
          conditioning on their evaluated unguarded outcome.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.3, 4.3, and 4.4."
        EVIDENCE_SUMMARY: >-
          The main construction pipeline is described, but SLGuard is applied
          to 11 cases selected because they were original-skill violations and
          the clarification study uses 12 curated high-quality violation cases.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Claims about relation-following failures and text salience require
          behavioral engagement evidence rather than skill delivery alone.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.2, 4.4-4.5, and Appendix G."
        EVIDENCE_SUMMARY: >-
          Graders inspect execution traces and artifacts for governed actions;
          human review and paired clarification runs show agents often execute
          a salient workflow component while missing its gate, constraint, or
          completion relation.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper's outcome is logical-relation compliance itself and it does
          not estimate task-complete insecurity or condition security on a
          separate post-treatment task-success endpoint.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.2 and Section 4."
        EVIDENCE_SUMMARY: "Safe, unsafe, and inconclusive labels are defined from relation evidence, not from security among only successful tasks."
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Benchmark rates and targeted paired analyses need explicit case-level
          units without treating repeated deterministic grading as replication.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.3, 4.1-4.5, and Appendices E-H."
        EVIDENCE_SUMMARY: >-
          The paper reports runs by distinct case and backbone, describes the
          86-case composition and targeted subset sizes, and treats deterministic
          grading as measurement rather than as independent repeated evidence.
    SUPPORTED_INTERPRETATION: >-
      On this deliberately curated executable challenge set, skill-guided agents
      frequently produce observable violations of source-grounded logical
      relations, and adding an explicit relation checklist changes outcomes on
      a small subset chosen from original violations.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The paper does not establish population prevalence across public skills,
      a source-correct and source-safe transfer effect, a task-complete
      insecurity estimand, outcome-blind mitigation effectiveness on the full
      benchmark, or a relation-content effect separated from generic added
      checklist context.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      Reuse would require an executed source procedure that passes both
      functionality and the same focal security witness; a matched target with
      genuine initial incompleteness; proof that one named security-relevant
      predicate holds in source and fails in target without another major
      mismatch; insecure and secure task-completing target controls with feature
      retention; an outcome-blind treatment sample; token/action/tool/runtime
      matching including a neutral checklist control; direct uptake evidence;
      and joint task-security results.
  - PAPER_ID: SWE_SKILLS_BENCH
    TITLE: "SWE-Skills-Bench: Do Agent Skills Actually Help in Real-World Software Engineering?"
    AUTHORS:
      - Tingxu Han
      - Yi Zhang
      - Wei Song
      - Chunrong Fang
      - Zhenyu Chen
      - Youcheng Sun
      - Lijie Hu
    VERSION: "arXiv:2603.15401v1, submitted 2026-03-16"
    VENUE_OR_STATUS: "Preprint with preliminary results; work in progress"
    SOURCE_URLS:
      - TYPE: OFFICIAL_ARXIV_ABSTRACT
        URL: "https://arxiv.org/abs/2603.15401"
        VERSION_OR_DATE: "v1, 2026-03-16"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ARXIV_HTML
        URL: "https://arxiv.org/html/2603.15401v1"
        VERSION_OR_DATE: "v1"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_AUTHOR_REPOSITORY_LINK_AS_PRINTED
        URL: "https://github.com/GeniusHTX/SWE-Skills-Bench"
        VERSION_OR_DATE: "Access attempted 2026-09-03"
        ACCESS_STATUS: HTTP_404
    OFFICIAL_REPOSITORY:
      URL: "https://github.com/GeniusHTX/SWE-Skills-Bench"
      COMMIT_OR_VERSION: null
      COMMIT_RESOLUTION_SOURCE: >-
        The arXiv v1 paper names this repository, but both the public GitHub URL
        and GitHub repository API returned HTTP 404 on 2026-09-03, so no commit
        was inferred.
      ACCESS_STATUS: HTTP_404_ON_2026-09-03
    STATED_PRIMARY_CLAIM: >-
      Controlled with-skill versus without-skill evaluation on approximately
      565 requirement-driven software-engineering tasks shows limited average
      marginal utility, sometimes large token overhead, benefits concentrated
      in specialized skills, and a small number of negative deltas attributed
      to project-context incompatibility.
    STATED_UNIT_OF_ANALYSIS: >-
      A generated task instance associated with one skill and fixed repository,
      evaluated once in each skill condition and aggregated by skill.
    MEMORY_OR_SKILL_TREATMENT: >-
      A selected public SKILL.md copied into the project so Claude Code can
      discover it automatically; the paired condition omits the file.
    CONTROL_CONDITIONS: >-
      Same task, fixed-commit repository, container, agent, model, requirements,
      and deterministic verifier with versus without SKILL.md.
    TARGET_TYPE: >-
      Requirement-authored software-engineering tasks over authentic GitHub
      repositories pinned at fixed commits across six SWE categories.
    FUNCTIONAL_ENDPOINT: >-
      Binary pass under deterministic pytest checks mapped from every stated
      acceptance criterion; pass-rate delta and token cost are aggregated by
      skill.
    SECURITY_ENDPOINT_IF_ANY: null
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A marginal task-success claim requires that generated requirements
          demand functionality not already satisfied in the pinned repository.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.2-3.4 and Figures 4, 6-8."
        EVIDENCE_SUMMARY: >-
          Requirements and execution-based tests are generated for each fixed
          repository, but the paper does not report executing the verifier on
          the untouched repository or otherwise requiring a no-op to be
          rejected before agent evaluation.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper evaluates functional utility and token cost, not a focal
          security property of task-completing implementations.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 4.1-4.2."
        EVIDENCE_SUMMARY: "No security endpoint or insecure control appears in the stated estimand."
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A secure task-completing implementation is not required for the
          non-security utility claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 4.1-4.2."
        EVIDENCE_SUMMARY: "The verifier assesses requirements, not focal security."
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No security repair or feature-retention contrast is studied.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3-4."
        EVIDENCE_SUMMARY: "Task pass rate is the functional endpoint without a secure-repair intervention."
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper makes no focal security-effect claim.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Section 4.2."
        EVIDENCE_SUMMARY: "Reported endpoints are requirement pass and token cost."
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Public skill documents are evaluated directly; no separate source
          execution is asserted to demonstrate their correctness.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.1-3.2."
        EVIDENCE_SUMMARY: "The source artifact is a selected skill file, not a source-success trajectory."
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Source focal safety is outside the paper's functional-utility
          estimand.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Sections 3-4."
        EVIDENCE_SUMMARY: "No common source/target security witness is defined."
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The domain-fit claim requires tasks to exercise the procedure encoded
          by their paired skill.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.2 and Figures 3-4."
        EVIDENCE_SUMMARY: >-
          Skills pass category, semantic, and feasibility filters; each is
          paired with a technology-aligned project, and requirements are
          authored specifically to the repository and the skill-triggering
          conditions.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper asks about marginal skill utility and project compatibility,
          not safe transfer governed by a named security precondition.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Abstract and Sections 3-5."
        EVIDENCE_SUMMARY: "No security-relevant safe-transfer predicate is part of the stated claim."
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paired design changes skill delivery on one target; it does not
          compare a predicate true in a source context with one false in target.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3.4 and 4.1."
        EVIDENCE_SUMMARY: "With-skill and no-skill runs share the same target task."
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No source-target security-condition shift is claimed.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Sections 3-4."
        EVIDENCE_SUMMARY: "The comparison is a within-task skill-delivery contrast."
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The marginal utility comparison requires a reproducible difference
          in skill delivery.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.2, 3.4, and 4.1."
        EVIDENCE_SUMMARY: >-
          Pre-existing skills are removed; the intended SKILL.md is copied into
          the designated location only in the treatment condition, while the
          task prompt never names it and the same agent discovers it
          automatically.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Skill utility and overhead interpretations require explicit treatment
          of delivery-induced resource differences.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.2 and Table 2."
        EVIDENCE_SUMMARY: >-
          Docker CPU limits and the agent/model are held fixed and input/output
          token costs are reported by condition, but action counts, tool-use
          burden, and wall-clock runtime are not reported or balanced.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Although no-skill is adequate for a total configuration effect, the
          paper also attributes gains and harms to specialized procedure content
          and version mismatch, which requires separating content from generic
          added-context effects.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.3 and Table 2."
        EVIDENCE_SUMMARY: >-
          The only principal control omits SKILL.md; no length-matched neutral
          skill or generic-context placebo is reported for the content-specific
          mechanism interpretations.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Skills and tasks used for the paired evaluation must be fixed without
          using their target outcomes.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.1-3.3 and Figure 3."
        EVIDENCE_SUMMARY: >-
          The paper gives a sequential pre-evaluation curation, project-matching,
          requirement-authoring, and verifier-generation pipeline and reports
          results for all 49 selected skills; no target outcome is an input to
          those selection rules.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Claims that skills reshape reasoning paths or cause version-specific
          interference require evidence that the agent actually engaged with
          the delivered file.
        EVIDENCE_LOCATION: "arXiv v1 Sections 4.1-4.3 and Table 2."
        EVIDENCE_SUMMARY: >-
          The paper states that Claude Code discovers skills autonomously and
          infers engagement from paired outcomes and token use, but does not
          report a direct uptake indicator or systematic trace-level engagement
          measure.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          There is no security endpoint to interpret jointly with task success.
        EVIDENCE_LOCATION: "Not applicable; arXiv v1 Section 4.2."
        EVIDENCE_SUMMARY: "The endpoint is functional requirement satisfaction and token cost."
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Skill-level deltas must use task instances, rather than repeated
          deterministic checks, as the empirical units.
        EVIDENCE_LOCATION: "arXiv v1 Sections 3.4 and 4.2; Equations 1-2 and Table 2."
        EVIDENCE_SUMMARY: >-
          The task tuple and binary paired verdicts are explicit, pass rates are
          averages over the distinct tasks associated with each skill, and
          deterministic verifier execution is not counted as independent
          replication.
    SUPPORTED_INTERPRETATION: >-
      In the reported preliminary paired benchmark, adding the selected skill
      file changes average pass rate little, can substantially change token
      use, and has heterogeneous task-level effects across skill-project
      pairings.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The paper does not establish that every generated task rejects a no-op, a
      security effect, source-context correctness or safety, direct skill uptake
      across runs, or that content-specific gains and interference are distinct
      from generic additional-context effects. The official repository artifact
      could not be checked at the printed URL on the access date.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      Reuse would require accessible frozen artifacts and hashes; an initial
      no-op test; a verified source execution that is correct and focal-safe;
      a named security applicability predicate and matched source-target states
      differing on it alone; insecure and secure task-completing controls with
      feature retention; an executable focal security witness; a
      context/resource-matched control; uptake measurement; and joint
      functionality-security outcomes.
  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
