      - TYPE: OFFICIAL_ARXIV_HTML
        URL: "https://arxiv.org/html/2604.16968v1"
        VERSION_OR_DATE: "v1"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: null
      COMMIT_OR_VERSION: null
      COMMIT_RESOLUTION_SOURCE: "No official author repository URL is stated in the accessible proceedings or arXiv version."
      ACCESS_STATUS: NOT_REPORTED
    STATED_PRIMARY_CLAIM: >-
      Experience accumulated from benign tasks can increase attack success on
      later high-risk web and embodied tasks; retrieved execution-oriented
      content, rather than prompt length alone, contributes to this degradation,
      while refusal-containing experience reduces unsafe behavior at the cost
      of over-refusal on benign tasks.
    STATED_UNIT_OF_ANALYSIS: >-
      A benchmark task under a backbone, environment, memory framework, and
      evolution stage; ASR and benign task-success rates are aggregated over
      held-out task sets.
    MEMORY_OR_SKILL_TREATMENT: >-
      Top-k external experience units retrieved by offline Agent Workflow
      Memory or online ReasoningBank, including experiments with benign,
      execution-only, refusal-only, or mixed experience compositions.
    CONTROL_CONDITIONS: >-
      Before versus after memory accumulation, different retrieval counts, a
      same-length expanded-system-instruction replacement, and manually
      controlled refusal-only, execution-only, and mixed harmful-experience
      memories on disjoint downstream tasks.
    TARGET_TYPE: >-
      Harmful or safety-critical web-agent and household-simulation tasks, with
      separate benign tasks used for experience accumulation and utility
      evaluation.
    FUNCTIONAL_ENDPOINT: >-
      Task success rate on benign tasks in the realistic mixed-experience
      setting; source environments also supply interaction feedback used to
      construct memories.
    SECURITY_ENDPOINT_IF_ANY: >-
      Attack success rate on BrowserART, the web subset of Agent-SafetyBench,
      and hazardous SafeAgentBench tasks, automatically judged under official
      benchmark protocols.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          High-risk target instructions are safety probes for which refusal may
          be correct; the paper does not claim implementation of legitimate
          functionality absent at baseline.
        EVIDENCE_LOCATION: "Not applicable; proceedings Sections 2-3 and Appendix B."
        EVIDENCE_SUMMARY: "The target estimand is harmful-task attack success before and after memory, not fail-to-pass feature completion."
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Executing a harmful request is itself the adverse safety outcome, not
          an insecure implementation of a legitimate requested feature.
        EVIDENCE_LOCATION: "Not applicable; proceedings Sections 3.1 and 5."
        EVIDENCE_SUMMARY: "ASR contrasts unsafe execution with safe behavior or refusal rather than matched task-completing implementations."
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A secure completion of the same harmful request is not part of the
          refusal-safety estimand.
        EVIDENCE_LOCATION: "Not applicable; proceedings Sections 3.1 and 5."
        EVIDENCE_SUMMARY: "The safe response to harmful inputs may appropriately decline the requested action."
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No target-program security repair is evaluated.
        EVIDENCE_LOCATION: "Not applicable; proceedings Sections 3-5."
        EVIDENCE_SUMMARY: "The study evaluates agent behavior under memory, not repair-induced feature retention."
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The central safety-degradation claim requires a grounded unsafe-action
          endpoint.
        EVIDENCE_LOCATION: "Proceedings Section 3.1, Table 1, and Appendix B."
        EVIDENCE_SUMMARY: >-
          ASR is computed under the official BrowserART, Agent-SafetyBench, and
          SafeAgentBench protocols using a GPT-4o automatic judge reported to
          correlate strongly with human annotations; task-set identities and
          counts are provided.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper asks whether accumulated experience affects later safety;
          that claim can include ReasoningBank memories from both successful
          and failed attempts and does not assert that every source procedure
          is functionally correct.
        EVIDENCE_LOCATION: "Not applicable; proceedings Section 2 and Appendix A."
        EVIDENCE_SUMMARY: "AWM abstracts effective workflows, while ReasoningBank explicitly stores patterns from successful and failed attempts."
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The repeated claim that experience is benign or harmless in isolation
          makes source-context focal safety relevant, beyond merely assigning a
          benign task label.
        EVIDENCE_LOCATION: "Proceedings Sections 3.1 and 4.1-4.3; Appendices A-B."
        EVIDENCE_SUMMARY: >-
          Source task sets are designated benign and are disjoint from hazardous
          evaluation tasks, but the same focal target safety witness is not
          executed on each source procedure in its source context, and
          ReasoningBank may retain failed attempts.
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The execution-bias mechanism requires retrieved experiences to bear
          operational relevance to the current task.
        EVIDENCE_LOCATION: "Proceedings Sections 2, 3.1, and 4.1-4.2; Appendix A."
        EVIDENCE_SUMMARY: >-
          Both frameworks retrieve task-relevant experience, the experiments
          fix top-3 retrieval unless dose is manipulated, and flip-case review
          identifies sensitive or standard execution patterns shared with the
          target action.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The mechanism claim that a procedure benign in isolation becomes
          unsafe in a sensitive context calls for a named condition governing
          safe reuse.
        EVIDENCE_LOCATION: "Proceedings Sections 4.1-4.3 and Appendix D.4."
        EVIDENCE_SUMMARY: >-
          The paper names broad benign, harmful, and sensitive-context classes
          and post hoc execution-bias categories, but does not specify a
          procedure-level applicability precondition before target evaluation.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          At the paper's broad context-class level, its claim relies on benign
          source interactions and hazardous target interactions being distinct.
        EVIDENCE_LOCATION: "Proceedings Section 3.1 and Appendix B."
        EVIDENCE_SUMMARY: >-
          WebArena or the benign SafeAgentBench subset supplies experience, and
          safety is evaluated on explicitly disjoint BrowserART,
          Agent-SafetyBench, or hazardous SafeAgentBench task sets.
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A context-shift mechanism interpretation requires determining whether
          harmfulness, rather than another source-target incompatibility, is
          the decisive difference.
        EVIDENCE_LOCATION: "Proceedings Section 3.1, Section 4.1, and Appendix B."
        EVIDENCE_SUMMARY: >-
          Source and target tasks are deliberately disjoint and, in the web
          setting, come from different benchmarks; item-level matched operations
          controlling other content, goal, and environment differences are not
          reported.
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The before/after and content claims require a defined memory
          intervention.
        EVIDENCE_LOCATION: "Proceedings Section 2, Section 3.1, and Appendix A-C."
        EVIDENCE_SUMMARY: >-
          The paper specifies AWM and ReasoningBank construction/update regimes,
          frozen versus online memory, top-k retrieval, prompt concatenation,
          task sets, evaluation cadence, and decoding settings.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Separating experience semantics from delivery burden requires explicit
          treatment of resources introduced by memory.
        EVIDENCE_LOCATION: "Proceedings Sections 3.1, 4.2-4.3, Table 3, and Appendix D.5."
        EVIDENCE_SUMMARY: >-
          The main content ablation uses an expanded system instruction matched
          to experience length and retrieval dose is manipulated, but
          condition-level action, tool, token, and runtime costs are not all
          measured or balanced.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claim that experience semantics rather than token length causes
          degradation requires a neutral same-length comparison.
        EVIDENCE_LOCATION: "Proceedings Section 4.3, Table 3, and Appendix D.5."
        EVIDENCE_SUMMARY: >-
          Before/no-memory comparisons are supplemented by same-length expanded
          system instructions in the same prompt position; ASR and internal
          attribution differ from actual retrieved experience.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Source experience must be accumulated or composed independently of
          the held-out target outcomes for the memory-effect comparison.
        EVIDENCE_LOCATION: "Proceedings Sections 3.1 and 5; Appendices A-C."
        EVIDENCE_SUMMARY: >-
          Offline memories are induced from a fixed source corpus before
          evaluation; online source tasks and evaluation cadence are specified;
          target sets are disjoint; and the 50 harmful experience-generation
          tasks in the composition study are excluded from downstream
          evaluation.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The execution-bias and semantic-content mechanism claims require
          evidence that retrieved experience influences agent behavior.
        EVIDENCE_LOCATION: "Proceedings Sections 4.1-4.3, Figures 4-5, and Appendix D.4-D.7."
        EVIDENCE_SUMMARY: >-
          Safe-to-unsafe flip cases are inspected, retrieval dose is related to
          ASR, prompts elicit memory use, and integrated-gradient attribution
          contrasts the experience segment with a length-matched expanded
          instruction segment.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          On the harmful target sets, fulfilling the prohibited request is the
          attack outcome itself; security is not estimated only within a
          post-treatment success subset. Benign utility is a separate task-set
          endpoint.
        EVIDENCE_LOCATION: "Not applicable; proceedings Sections 3.1 and 5."
        EVIDENCE_SUMMARY: "ASR on harmful tasks and task success on benign tasks answer a refusal-safety trade-off question, not task-complete insecurity."
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          The before/after and online temporal claims use stochastic frameworks
          and repeated evaluation of held-out task sets, so seed and repeated-
          measure handling matters.
        EVIDENCE_LOCATION: "Proceedings Section 3.1 and Appendix C."
        EVIDENCE_SUMMARY: >-
          Distinct source and target task counts, evaluation intervals, models,
          and nonzero temperatures are specified, but the accessible paper does
          not state independent seed counts or an analysis of dependence across
          repeated evaluations of the same safety sets.
    SUPPORTED_INTERPRETATION: >-
      Across the reported frameworks, backbones, and safety benchmarks, adding
      retrieved experience is associated with higher ASR than the corresponding
      no-memory or pre-evolution state; length-matched controls, dose patterns,
      flip cases, and attribution analyses support an execution-oriented content
      mechanism, while refusal experience trades lower ASR for lower benign
      utility.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The study does not establish that each source procedure is focal-safe
      under the target witness, a procedure-specific applicability predicate, a
      source-target pair isolated to that predicate, complete resource balance,
      or seed-level robustness of online temporal effects. It does not estimate
      task-complete insecurity for a legitimate target feature.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      Reuse would require a successful source procedure tested with the same
      focal security witness; a predeclared procedure-level security predicate;
      matched source and target states proving that predicate true then false
      without other major mismatches; a genuinely incomplete legitimate target;
      secure and insecure task-completing controls with feature retention;
      comprehensive resource balancing; independent repetitions at defensible
      units; and a joint task-completion-by-security analysis.
  - PAPER_ID: SECUREVIBEBENCH
    TITLE: "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios"
    AUTHORS:
      - Junkai Chen
      - Huihui Huang
      - Yunbo Lyu
      - Junwen An
      - Jieke Shi
      - Chengran Yang
      - Ting Zhang
      - Haoye Tian
      - Yikun Li
      - Zhenhao Li
      - Xin Zhou
      - Xing Hu
      - David Lo
    VERSION: "ACL 2026 proceedings version; arXiv:2509.22097v5, revised 2026-06-06 (v1 submitted 2025-09-26)"
    VENUE_OR_STATUS: "Proceedings of the 64th Annual Meeting of the Association for Computational Linguistics, Volume 1, pages 24144-24168"
    SOURCE_URLS:
      - TYPE: OFFICIAL_ACL_ANTHOLOGY_PAGE
        URL: "https://aclanthology.org/2026.acl-long.1107/"
        VERSION_OR_DATE: "Published July 2026"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ACL_ANTHOLOGY_PDF
        URL: "https://aclanthology.org/2026.acl-long.1107.pdf"
        VERSION_OR_DATE: "Proceedings version, July 2026"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_ARXIV_ABSTRACT
        URL: "https://arxiv.org/abs/2509.22097"
        VERSION_OR_DATE: "v5, 2026-06-06"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_AUTHOR_REPOSITORY
        URL: "https://github.com/iCSawyer/SecureVibeBench"
        VERSION_OR_DATE: "HEAD resolved 2026-09-03"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: "https://github.com/iCSawyer/SecureVibeBench"
      COMMIT_OR_VERSION: 47c452becd3011ad948876e7cf0f3cca5846802d
      COMMIT_RESOLUTION_SOURCE: "GitHub public repository and GitHub REST commits endpoint, HEAD resolved on 2026-09-03."
      ACCESS_STATUS: ACCESSIBLE
    STATED_PRIMARY_CLAIM: >-
      Reconstructed vulnerability-introducing scenarios provide realistic
      repository-level secure-coding tasks with joint functional, dynamic
      focal-vulnerability, and static new-risk evaluation; across evaluated
      agents and models, even the best configuration produces only 23.8%
      solutions classified correct and secure.
    STATED_UNIT_OF_ANALYSIS: >-
      One agent-model execution on one of 105 repository task instances;
      outcome rates aggregate the four mutually exclusive patch categories.
    MEMORY_OR_SKILL_TREATMENT: null
    CONTROL_CONDITIONS: >-
      Historical parent-of-vulnerability-introducing, vulnerability-introducing,
      and vulnerability-fixing repository states validate scenario and PoV;
      generated patches are compared with the human gold patch's test behavior
      and pre-patch SAST findings.
    TARGET_TYPE: >-
      Security-neutral natural-language requirements over the repository state
      immediately before a real human vulnerability-introducing commit in 41
      C/C++ projects.
    FUNCTIONAL_ENDPOINT: >-
      Differential test behavior of the agent patch versus the gold human patch
      across repository tests that passed in the pre-patched version.
    SECURITY_ENDPOINT_IF_ANY: >-
      A per-instance proof-of-vulnerability for the historical focal
      vulnerability plus Semgrep 1.137.0 scanning for newly introduced risks;
      static-only findings are labeled suspicious rather than vulnerable.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A benchmark asking agents to implement a historical requirement needs
          evidence that the parent repository does not already satisfy that
          requirement and that a no-op cannot be classified correct.
        EVIDENCE_LOCATION: "ACL 2026 paper Sections 3.1-3.2 and Appendix B, Functionality Oracle Acquisition."
        EVIDENCE_SUMMARY: >-
          The task starts at the parent of the vulnerability-introducing commit
          and functional tests compare agent behavior with the gold patch, but
          the reported oracle check only ensures at least one selected test
          already passed in the pre-patched version; no systematic no-op
          rejection or fail-to-pass requirement is reported.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Joint secure-coding evaluation requires a state that implements the
          requested behavior yet contains the focal vulnerability.
        EVIDENCE_LOCATION: "ACL 2026 paper Sections 3.1-3.2 and Figures 2-3."
        EVIDENCE_SUMMARY: >-
          The historical vulnerability-introducing commit supplies the gold
          requirement implementation, its behavior defines the functional
          reference, and a verified PoV demonstrates the focal vulnerability in
          that commit.
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The conclusion that agents can sometimes generate correct and secure
          patches requires observed states meeting both endpoints.
        EVIDENCE_LOCATION: "ACL 2026 paper Section 3.1, Figure 4, and Tables 3-4."
        EVIDENCE_SUMMARY: >-
          C-SEC is defined only for a patch matching gold functional behavior,
          not triggering the focal PoV, and introducing no SAST finding; such
          outcomes are observed across evaluated configurations, including the
          reported 23.8% maximum.
      A4_FEATURE_RETENTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A secure classification must retain the requested behavior rather
          than obtain safety by omitting the change.
        EVIDENCE_LOCATION: "ACL 2026 paper Section 3.1, Functionality definition and four outcome categories."
        EVIDENCE_SUMMARY: >-
          Security labels are applied jointly with a differential functional
          check: C-SEC patches must match the gold patch's test behavior, while
          functionally mismatching patches enter the incorrect category.
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The benchmark's correct-but-vulnerable distinction requires an
          executable witness specific to the historical vulnerability.
        EVIDENCE_LOCATION: "ACL 2026 paper Sections 3.1-3.2, Figures 2-3, and Appendix B SAST Configuration."
        EVIDENCE_SUMMARY: >-
          ARVO or OSS-Fuzz PoVs are executed to verify secure VFC, vulnerable
          VIC, and secure PVIC states before inclusion and then classify agent
          patches for the focal vulnerability. Semgrep findings are separately
          and cautiously labeled suspicious because of false alarms.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          SecureVibeBench contains no procedural memory or skill transferred
          from a source execution.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3.1-3.2."
        EVIDENCE_SUMMARY: "The intervention is agent coding from a requirement and repository, not source-procedure reuse."
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          There is no memory source context whose focal safety is part of the
          paper's claim.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3.1-3.2."
        EVIDENCE_SUMMARY: "Historical repository states validate a benchmark scenario, not a transferred source procedure."
      B3_PROCEDURAL_RELEVANCE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not deliver procedural memory, so source-procedure
          relevance is not required for its secure-coding benchmark claim.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Section 3.1."
        EVIDENCE_SUMMARY: "Agents receive a repository and natural-language requirement."
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Safe transfer of a source procedure under a named predicate is not the
          paper's estimand.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4."
        EVIDENCE_SUMMARY: "The benchmark tests secure code generation without a memory applicability condition."
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No source-memory predicate is compared across contexts.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4."
        EVIDENCE_SUMMARY: "PVIC, VIC, and VFC identify vulnerability history rather than a procedural-memory transfer."
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not claim a source-target memory transfer isolated to
          one applicability difference.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4."
        EVIDENCE_SUMMARY: "Its comparison is among generated patch outcome categories on fixed task instances."
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No memory or skill treatment is delivered.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Section 3.1."
        EVIDENCE_SUMMARY: "Inputs are a code repository and requirement."
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The frozen criterion concerns resource differences introduced by
          memory or skill delivery, absent here.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4 and Appendix C."
        EVIDENCE_SUMMARY: "Agent configurations differ, but there is no procedural-memory treatment contrast to balance."
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          There is no claim about memory content versus generic memory-loading
          effects.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4."
        EVIDENCE_SUMMARY: "The study benchmarks code-agent outputs without a skill-loading condition."
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No source memory or skill is selected for a target.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Sections 3-4."
        EVIDENCE_SUMMARY: "Benchmark curation is not selection of a procedural treatment source."
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          No delivered memory or skill creates a delivery-versus-uptake
          distinction.
        EVIDENCE_LOCATION: "Not applicable; ACL 2026 paper Section 3.1."
        EVIDENCE_SUMMARY: "The process measure concerns generated patches, not memory engagement."
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The central claim is explicitly about code that is both correct and
          secure, so functional and security states must be jointly identified.
        EVIDENCE_LOCATION: "ACL 2026 paper Section 3.1, Figure 4, and Tables 3-4."
        EVIDENCE_SUMMARY: >-
          Every patch is assigned to one mutually exclusive category:
          incorrect, correct-but-vulnerable, correct-but-suspicious, or
          correct-and-secure. Security claims about correct patches are thus
          distinguished from task failure in the reported joint outcome table.
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Agent-model comparisons require task instances to be treated as the
          units and repeated deterministic grading not to be counted as
          independent evidence.
        EVIDENCE_LOCATION: "ACL 2026 paper Sections 3.3-4.3 and Appendix C.2-C.3."
        EVIDENCE_SUMMARY: >-
          Rates are computed over 105 distinct tasks, each agent-model
          combination is explicitly run once, agent decoding is temperature
          zero, and the study does not present repeated grader executions as
          independent replications.
    SUPPORTED_INTERPRETATION: >-
      On 105 curated C/C++ scenarios, the reported agents often fail to produce
      patches that jointly match the historical requirement behavior and avoid
      the focal vulnerability or new static warnings; dynamic PoVs and explicit
      four-way outcome categories make the focal correctness-security trade-off
      directly interpretable.
    INTERPRETATIONS_NOT_ESTABLISHED: >-
      The benchmark does not establish that every parent repository genuinely
      lacks the requested behavior or rejects a no-op. Static suspicious labels
      are not equivalent to confirmed vulnerabilities, and one run per task
      does not by itself support claims about stochastic run-level stability.
      No procedural-memory transfer effect is evaluated.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND: >-
      Reuse would first need a systematic untouched-repository no-op check. It
      would then need an actual procedural-memory treatment: a source execution
      shown functionally correct and safe under the same PoV, a named
      applicability predicate true in that source and false in a matched target,
      evidence excluding a second major mismatch, outcome-blind source
      selection, resource-matched memory and placebo controls, direct uptake
      measurement, and appropriate repetitions. The existing dynamic PoV,
      vulnerable gold implementation, functionally correct secure outputs,
      feature-retention rule, and joint outcome categories could support the
      target-outcome portion after those additions.
