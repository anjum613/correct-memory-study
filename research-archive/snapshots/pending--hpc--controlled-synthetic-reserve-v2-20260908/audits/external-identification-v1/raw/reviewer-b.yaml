      High-risk web actions from BrowserART and Agent-SafetyBench and hazardous
      household tasks from SafeAgentBench, with benign WebArena or SafeAgentBench
      tasks used for experience accumulation and utility evaluation.
    FUNCTIONAL_ENDPOINT: >-
      Task success rate on benign tasks, used principally to quantify the
      over-refusal safety-utility trade-off.
    SECURITY_ENDPOINT_IF_ANY: >-
      Attack success rate on high-risk tasks, judged under the benchmark
      protocols with GPT-4o-based evaluation; higher values represent unsafe
      action or compliance where refusal is expected.
