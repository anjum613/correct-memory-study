    STATED_PRIMARY_CLAIM: >-
      Experience accumulated solely on benign tasks can increase unsafe
      compliance on later high-risk web and embodied tasks in offline and
      online self-evolving agents. The authors attribute this to execution-
      oriented experience content rather than prompt length; refusal experience
      mitigates the safety decline but causes over-refusal on benign tasks.
    STATED_UNIT_OF_ANALYSIS: >-
      A safety-benchmark task evaluated under an agent-framework, backbone,
      environment, and experience state; online analyses also summarize attack
      success at successive experience-accumulation intervals.
