        VERSION_OR_DATE: "accessed 2026-09-03"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: https://github.com/GeniusHTX/SWE-Skills-Bench
      COMMIT_OR_VERSION: 4ac6441a446063066f103bb71faee3b0e89dbc22
      COMMIT_RESOLUTION_SOURCE: >-
        The official repository is linked from arXiv v1. Its official
        commits/master page listed 4ac6441a446063066f103bb71faee3b0e89dbc22
        as the latest commit on 2026-03-17; direct repository and commit fetches
        returned 404 on the access date, so artifact inspection was partial.
      ACCESS_STATUS: PARTIALLY_ACCESSIBLE
    STATED_PRIMARY_CLAIM: >-
      On approximately 565 requirement-authored, fixed-repository task
      instances, paired skill injection has limited average marginal utility
      for Claude Code with Haiku 4.5, incurs heterogeneous token cost, helps a
      small specialized subset, and sometimes harms performance through
      contextual incompatibility.
    STATED_UNIT_OF_ANALYSIS: >-
      A generated task instance nested within one of 49 skills; binary verifier
      outcomes and token costs are aggregated to skill-level rates and then to
      an overall task-weighted average.
    MEMORY_OR_SKILL_TREATMENT: >-
      A public SKILL.md physically injected into the task environment for
      autonomous discovery; the comparison condition omits it after removing
      pre-existing repository skills.
    CONTROL_CONDITIONS:
      - Same fixed-commit repository task with the designated SKILL.md
      - Same task without any injected skill
    TARGET_TYPE: >-
      Requirement-authored software-engineering work in authentic GitHub
      projects pinned at fixed commits and run in CPU-only Docker containers.
    FUNCTIONAL_ENDPOINT: >-
      Deterministic pytest checks mapped from authored acceptance criteria;
      primary summaries are skill-level verifier satisfaction rates and their
      with-minus-without-skill difference. Token cost and a cost-efficiency
      ratio are secondary endpoints.
    SECURITY_ENDPOINT_IF_ANY: "None as a general focal endpoint, despite some tasks belonging to a security-and-testing domain."
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Genuine initial incompleteness is relevant to interpreting zero or
          positive marginal utility on generated repository tasks.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.2-3.3 and 4.3; Table 2"
        EVIDENCE_SUMMARY: >-
          Requirements and deterministic tests are generated for pinned
          repositories, but the paper does not report executing a no-op or the
          untouched repository against each new verifier. Twenty-four skills
          have perfect agent outcomes in both conditions, which does not itself
          establish that the initial state was incomplete.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper does not state a task-complete-insecurity estimand."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No same-request secure control is required for its general functional-utility claim."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The study does not evaluate security repairs or feature-preserving mitigation."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The benchmark's stated primary endpoint is functional requirement satisfaction, not focal security."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The total effect of injecting selected public skills does not require
          that each skill first be validated in an original source execution.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "There is no focal source-context security property in the paper's stated claim."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Task-skill fit is required for the paper's claims about marginal
          utility and context compatibility.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1-3.2"
        EVIDENCE_SUMMARY: >-
          Skills are semantically and feasibility filtered, projects are
          matched to each skill's technology stack, and each requirement is
          authored to be repository-specific and skill-triggering.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The primary estimand is total marginal skill-injection utility, not
          transfer across one explicit security-relevant predicate.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No prespecified source-target applicability shift defines the primary paired comparison."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The main comparison varies skill presence on the same target task and
          does not claim to isolate one source-target predicate difference.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Marginal injection utility requires the intended skill to be present
          only in its designated condition.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.2 and 4.1"
        EVIDENCE_SUMMARY: >-
          Pre-existing skill directories are removed, the designated skill is
          copied only for the use-skill condition, and the no-skill condition
          omits it in the same containerized task setup.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource accounting is relevant to the paper's marginal utility and
          cost-efficiency interpretation.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.1-4.2 and Table 2"
        EVIDENCE_SUMMARY: >-
          The paper fixes CPU containers and per-task limits and reports input
          plus output tokens, but does not report or balance condition-specific
          context occupancy, action/tool counts, or runtime. Its cost-efficiency
          metric therefore covers token cost only.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A no-skill comparison is appropriate for the stated total marginal
          effect of making a skill available; the paper does not claim a pure
          semantic-content effect net of all added context.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.4 and 4.1-4.2"
        EVIDENCE_SUMMARY: >-
          Each task is evaluated with the skill physically present and absent,
          with the repository, requirement, environment, agent, and verifier
          otherwise fixed.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Prespecifying skill-task assignments is needed for the reported
          marginal-utility distribution.
        EVIDENCE_LOCATION: "arXiv v1, Figure 3 and Sections 3.1-3.4"
        EVIDENCE_SUMMARY: >-
          Skill curation, project matching, requirement authoring, verifier
          generation, and skill placement precede the paired evaluation; the
          paper does not describe changing skill assignments after outcomes.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Direct engagement evidence is needed for the paper's concrete
          context-interference mechanism example.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.3, Figure 5"
        EVIDENCE_SUMMARY: >-
          For linkerd-patterns, the paper traces copied API versions, protocol
          choices, fabricated fields, and an extra resource to specific regions
          of the injected templates, while contrasting the no-skill reasoning.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The study reports functional utility and token cost, not a security-conditioned task estimand."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Paired marginal effects from an LLM agent require clarity about
          repeated executions and the dependence of generated tasks within a
          skill and repository.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.1-4.2, Table 2, and Section 5"
        EVIDENCE_SUMMARY: >-
          Each task contributes one binary result per condition and results are
          aggregated over roughly ten generated instances per skill, but no
          seed, rerun, uncertainty, or within-skill dependence treatment is
          reported; only one agent and backbone are evaluated.
    SUPPORTED_INTERPRETATION: >-
      For the reported generated task suite and single Claude Code/Haiku 4.5
      setup, making the selected skill available changes few functional
      outcomes on average and can substantially change token consumption. The
      detailed Linkerd example supports at least one concrete context-
      interference mechanism.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - >-
        That every generated task was initially unsatisfied by the untouched
        repository.
      - >-
        A content-only effect separated from context, action, tool, and runtime
        burdens, or a repeated-run effect robust to agent stochasticity.
      - "A focal security effect or a source-safe precondition-shift effect."
      - "Generalization beyond the single agent/backbone and authored task distribution."
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        Per-task no-op validation that the requested target feature is absent
        before intervention.
      - >-
        A particular source procedure demonstrated functionally correct and
        focal-safe, with an explicit security-relevant applicability predicate
        and a matched target where only that predicate fails.
      - >-
        Same-request task-completing insecure and secure controls, retained
        functionality under the secure state, and an executable focal security
        witness.
      - >-
        Resource-balanced content controls, focal uptake evidence across tasks,
        joint task/security scoring, outcome-blind source assignment, and
        independent execution replications.

  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
