PAPERS:
  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    TITLE: "When Not to Imitate: Boundary-Aware Skill Memory for Reliable Tool-Use LLM Agents"
    AUTHORS:
      - Zihan Lin
      - Zhenyu Chen
      - Jiawen Wei
      - Xiaohan Wang
      - Jie Cao
      - Jiajun Chai
      - Wei Lin
      - Guojun Yin
      - Ran He
    VERSION: "arXiv:2608.22339v1, 2026-08-23"
    VENUE_OR_STATUS: "Accepted to Findings of EMNLP 2026; accessible version is arXiv v1"
    SOURCE_URLS:
      - TYPE: ARXIV_ABSTRACT
        URL: https://arxiv.org/abs/2608.22339
        VERSION_OR_DATE: "v1, 2026-08-23"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: ARXIV_HTML
        URL: https://arxiv.org/html/2608.22339v1
        VERSION_OR_DATE: "v1, 2026-08-23"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: NOT_IDENTIFIED_IN_ACCESSIBLE_OFFICIAL_SOURCES
      COMMIT_OR_VERSION: NOT_AVAILABLE
      COMMIT_RESOLUTION_SOURCE: >-
        No project or author repository URL was supplied by the official arXiv
        record or paper version inspected.
      ACCESS_STATUS: NOT_IDENTIFIED
    STATED_PRIMARY_CLAIM: >-
      Success-distilled procedural memories can increase preference for a
      semantically similar but inapplicable tool, whereas BASM's explicit
      applicability, risk, avoidance, and recovery fields suppress that
      imitation effect and improve utility or safety metrics on BFCL,
      AppWorld, and AgentDojo under the evaluated configurations.
    STATED_UNIT_OF_ANALYSIS: >-
      A next-action decision point for the logit and attention probes, and a
      benchmark task instance within a model-by-memory configuration for the
      aggregate accuracy, success, utility, attack-success, and step metrics.
    MEMORY_OR_SKILL_TREATMENT: >-
      Retrieved textual skills built from logged trajectories. The main
      configurations are memory-free Base, successful-trajectory procedural
      skill, procedural skill plus applicability, and the seven-field BASM;
      BASM may also apply a boundary checker and local repair loop.
    CONTROL_CONDITIONS:
      - Memory-free Base
      - Successful-trajectory procedural skill
      - Procedural skill plus applicability only
      - Equal-length irrelevant-padding and procedure-padding controls
      - Same-prompt boundary, random-span, and procedure-span attention knockouts
    TARGET_TYPE: >-
      Multi-turn function calling, stateful API task completion, and tool-agent
      prompt-injection evaluation.
    FUNCTIONAL_ENDPOINT: >-
      BFCL accuracy, AppWorld task success and average steps, and AgentDojo
      utility.
    SECURITY_ENDPOINT_IF_ANY: >-
      AgentDojo attack success rate; wrong-tool logit margin is an additional
      reliability and mechanism endpoint rather than a complete security
      outcome.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Genuine outstanding goals are needed for the paper's benchmark-level
          task-success and accuracy claims.
        EVIDENCE_LOCATION: "arXiv v1, Section 5.1 (Benchmarks), especially BFCL and AppWorld descriptions"
        EVIDENCE_SUMMARY: >-
          BFCL requires an evaluated response and AppWorld evaluates completion
          of an interactive task, but the accessible paper does not report an
          explicit initial-state or no-op validation showing that every task
          supporting the aggregate claim begins incomplete and cannot already
          satisfy its endpoint without intervention.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper's safety claim is an aggregate AgentDojo attack-success
          claim, not an estimate of task-complete insecurity for one requested
          target feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A same-request secure implementation control is not required for the
          stated aggregate utility and attack-success comparison.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not claim to repair a concrete target implementation
          while preserving a specified feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A grounded security endpoint is required for the claimed AgentDojo
          safety improvement.
        EVIDENCE_LOCATION: "arXiv v1, Section 5.1 and Table 3"
        EVIDENCE_SUMMARY: >-
          The study uses AgentDojo v1.2.2's official attack-success-rate
          endpoint and reports it separately from utility for every evaluated
          memory configuration.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The imitation-trap claim specifically concerns procedural content
          distilled from successful source experience.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.2, Equations 6-7; Section 5.1 (Models and baselines)"
        EVIDENCE_SUMMARY: >-
          Goal, procedure, and tool fields are supplied by a successful logged
          context, and the procedural-memory baseline is explicitly distilled
          from successful past trajectories.
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper's own claim requires successful source experience but does
          not assert that a source implementation was independently certified
          against the target's focal security property.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The central failure mode requires a retrieved procedure to be
          genuinely similar to the current operation while its tool choice is
          inapplicable.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1-3.3 and 4.2 (Retrieval and prompt formatting)"
        EVIDENCE_SUMMARY: >-
          The probe defines an inapplicable bucket using semantically similar
          but incorrect tools, and retrieval combines semantic, tool, and
          goal/procedure overlap.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Explicit conditions governing when a skill should or should not be
          used are the paper's focal intervention.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.1, Equations 4-5"
        EVIDENCE_SUMMARY: >-
          BASM has named applicability conditions, risk cues, avoidance rules,
          and recovery notes, and the paper states the decision roles of each
          field.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The paper's boundary-transfer account depends on applicability
          holding for a retrieved success pattern but failing at the current
          decision.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1-3.2 and 5.1 (BFCL miss_func and miss_param subsets)"
        EVIDENCE_SUMMARY: >-
          The probe contrasts applicable and inapplicable decision-state
          buckets, and the BFCL missing-function and missing-parameter subsets
          require rejection of otherwise similar tool calls.
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          Excluding other source-target incompatibilities matters to the claim
          that applicability boundaries, rather than another transfer
          difference, explain the imitation effect.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1, 4.2, and 5.1"
        EVIDENCE_SUMMARY: >-
          The paper defines safe and risky state buckets and relevance-aware
          retrieval, but the accessible version does not provide pair-level
          source-target construction details sufficient to exclude a second
          comparably important incompatibility for all probe or benchmark
          retrievals.
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The method claim requires a defined, reproducible distinction among
          procedural, applicability-only, and boundary-aware memories.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.1-4.2, Equations 4-12"
        EVIDENCE_SUMMARY: >-
          The seven fields, extraction inputs, deterministic schema validation,
          retrieval score, token-budget formatter, boundary checker, and repair
          loop are operationally specified.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource and prompt differences must be addressed for the claimed
          boundary-semantics and efficiency effects.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.3-3.4 and 5.1; Appendix A.2 and A.4"
        EVIDENCE_SUMMARY: >-
          Configurations share the retrieval substrate, backbone, tools, and
          evaluation pipeline; formatting uses a fixed token budget, steps are
          reported, equal-length padding controls address added context, and
          same-prompt knockouts hold prompt tokens fixed.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Separating boundary semantics from generic memory and added-context
          effects is part of the stated mechanism claim.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.3-3.4 and 5.1; Tables 3-4; Appendix A.4"
        EVIDENCE_SUMMARY: >-
          Memory-free, procedural-only, applicability-only, full-BASM,
          equal-length padding, component ablation, and attention-knockout
          comparisons isolate several plausible alternatives.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          Outcome-blind construction matters when attributing benchmark and
          probe changes to the selected source memories.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.2 and 5.1"
        EVIDENCE_SUMMARY: >-
          Offline extraction and deterministic retrieval are described, but
          the accessible paper does not state when all source logs, library
          entries, thresholds, and probe examples were fixed relative to
          inspection of evaluated target outcomes.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The paper makes a mechanism claim about the agent reading and using
          boundary fields, not merely receiving them.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.3-3.4; Appendix A.1-A.4"
        EVIDENCE_SUMMARY: >-
          Decision-token attention, wrong-tool logits, state-dependent
          attention ratios, realized choices, and same-prompt span knockouts
          provide behavioral and intervention evidence of engagement.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper states separate benchmark-level utility and attack-success
          claims and does not define its estimand as task-complete insecurity
          on a single requested feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: UNDETERMINED
        APPLICABILITY_RATIONALE: >-
          The strength of benchmark and mechanism comparisons depends on how
          task instances and repeated stochastic executions are treated.
        EVIDENCE_LOCATION: "arXiv v1, Section 5.1 and Appendix A.1-A.4"
        EVIDENCE_SUMMARY: >-
          The paper reports 800 BFCL instances, 168 AppWorld tasks, four model
          scales, and temperature 0.001, but it does not disclose an execution
          repetition or seed protocol or enough dependence information to
          determine replication validity.
    SUPPORTED_INTERPRETATION: >-
      Under the reported tool-agent configurations, explicit boundary content
      changes wrong-tool preferences and several benchmark outcomes beyond the
      tested procedural-only and equal-length controls. This supports a
      boundary-aware memory effect for these benchmarks, not the full stronger
      source-safe, task-complete-insecurity estimand.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - >-
        That every source procedure is independently focal-safe in its source
        context.
      - >-
        That the AgentDojo safety result is a change in task-complete
        insecurity for the same requested functionality.
      - >-
        That source selection was outcome-blind or that repeated-execution
        uncertainty has been characterized.
      - >-
        That applicability is the sole important source-target mismatch across
        all retrieved examples.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        An executable source-context demonstration that the transferred
        procedure is both functionally correct and safe against the same focal
        security witness.
      - >-
        A target whose requested functionality is initially absent, together
        with same-request task-completing insecure and secure controls and a
        feature-retention check.
      - >-
        A joint endpoint identifying task-complete insecurity rather than
        separate aggregate utility and attack-success marginals.
      - >-
        Pair-level evidence that the named predicate is the relevant shift and
        no second major mismatch explains transfer, plus outcome-blind source
        selection and repeated-run uncertainty.

  - PAPER_ID: AGENT_SKILLS_CAN_BE_HARMFUL
    TITLE: "Agent Skills Can Be Harmful: An Empirical Study of Skill-Induced Failures in LLM Agents"
    AUTHORS:
      - Gen Dong
      - Yanjie Gao
      - Liqun Li
      - Tianyin Xu
      - Yu Hua
      - Fan Yang
    VERSION: "arXiv:2608.11888v1, 2026-08-12"
    VENUE_OR_STATUS: "arXiv preprint"
    SOURCE_URLS:
      - TYPE: ARXIV_ABSTRACT
        URL: https://arxiv.org/abs/2608.11888
        VERSION_OR_DATE: "v1, 2026-08-12"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: ARXIV_HTML
        URL: https://arxiv.org/html/2608.11888v1
        VERSION_OR_DATE: "v1, 2026-08-12"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: NOT_IDENTIFIED_IN_ACCESSIBLE_OFFICIAL_SOURCES
      COMMIT_OR_VERSION: NOT_AVAILABLE
      COMMIT_RESOLUTION_SOURCE: >-
        No study-artifact or author repository URL was supplied by the official
        arXiv record or paper version inspected.
      ACCESS_STATUS: NOT_IDENTIFIED
    STATED_PRIMARY_CLAIM: >-
      Controlled target/reference execution pairs can identify and explain
      loaded-skill functional failures and large efficiency regressions. On
      SkillsBench and SWE-Skills-Bench the authors curate 307 such cases,
      develop root-cause taxonomies, and evaluate an automated triage tool.
    STATED_UNIT_OF_ANALYSIS: >-
      An ordered task-and-skill target/reference execution pair; the final
      analysis unit is one retained contrastive failure or efficiency-regression
      case, with an agent trajectory and verifier/cost evidence.
    MEMORY_OR_SKILL_TREATMENT: >-
      A curated or metadata-matched public SKILL.md package made available
      through OpenCode's normal skill-loading interface; the agent may load it
      when it judges the package relevant.
    CONTROL_CONDITIONS:
      - Same task with no skill
      - Same task with a different semantically matched skill
      - Target/reference pairs with task, verifier, model, agent, repository or container, and data fixed
    TARGET_TYPE: >-
      Verifier-graded cross-domain SkillsBench tasks and repository-based
      SWE-Skills-Bench software-engineering tasks.
    FUNCTIONAL_ENDPOINT: >-
      Deterministic task-verifier outcome; efficiency regressions additionally
      require both token use and execution time to increase, with at least one
      exceeding the primary two-times threshold.
    SECURITY_ENDPOINT_IF_ANY: "None; the paper studies functional and efficiency regressions, not a focal security outcome."
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper's case-defining claim is a contrastive regression between
          completed executions, not that a pre-intervention repository lacked
          a requested feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No security endpoint or task-complete-insecurity estimand is stated."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No focal secure-versus-insecure same-task comparison is claimed."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper does not evaluate a secure repair of a focal feature."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The stated endpoints are functional verification and execution cost, not security."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The study asks whether loaded skills induce failures; its claim does
          not require each public skill's procedure to have worked in an
          original source context.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "There is no focal source-context security property in the paper's claim."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The finding that harmful skills are often topically relevant requires
          credible task-skill procedural relatedness.
        EVIDENCE_LOCATION: "arXiv v1, Sections III-C and IV; Table III"
        EVIDENCE_SUMMARY: >-
          Public alternatives are retrieved by skill-name and description
          similarity, retained only above cosine similarity 0.7, and exposed
          through normal optional loading; the taxonomy then separates
          applicability, environment, implementation, and artifact mechanisms.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The main estimand is occurrence and attribution of skill-induced
          regressions, not transfer across one prespecified safe-applicability
          predicate.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No single prespecified source-to-target predicate shift defines the paper's estimand."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The controlled comparison varies skill setup on the same task; it
          does not claim that one source-target predicate difference uniquely
          identifies a transfer effect.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: "Attribution to a loaded skill requires observing the delivered skill and execution record."
        EVIDENCE_LOCATION: "arXiv v1, Sections II, III-C, and III-A"
        EVIDENCE_SUMMARY: >-
          The paper defines skill-package contents, uses the normal loading
          interface, and records the loaded skill, complete trajectory,
          verifier result, token use, and execution time for each run.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource accounting is required for the functional-attribution and
          efficiency-regression claims.
        EVIDENCE_LOCATION: "arXiv v1, Sections III-A, III-C, and III-D"
        EVIDENCE_SUMMARY: >-
          Pairs fix task, verifier, agent framework, model, repository or
          container, and data while changing skill setup; tokens and wall-clock
          execution time are recorded, and the efficiency rule requires both
          measures to worsen.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A successful or cheaper reference execution is central to separating
          a skill-associated regression from base-agent task difficulty.
        EVIDENCE_LOCATION: "arXiv v1, Section III-A and Figure 2"
        EVIDENCE_SUMMARY: >-
          Every retained contrast uses the same task with either no skill or a
          semantically matched alternative skill as a pseudo-oracle; functional
          and efficiency case rules are stated explicitly.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Outcome-blind skill/reference choice matters if retained pairs are
          interpreted as prospectively identified effects rather than a
          diagnostic case collection.
        EVIDENCE_LOCATION: "arXiv v1, Sections III-C and III-D; Tables I-II"
        EVIDENCE_SUMMARY: >-
          Candidate variants exist before execution, but the reported target
          and reference pairs are selected from up to six variants after
          observing which executions differ, then further filtered and
          deduplicated. The accessible evidence therefore does not establish
          outcome-blind selection for the final 307 cases.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Root-cause attribution requires evidence that the loaded skill
          affected execution rather than mere delivery.
        EVIDENCE_LOCATION: "arXiv v1, Sections II, III-C, IV-V, and VI-A"
        EVIDENCE_SUMMARY: >-
          The study records skill loading and full tool/edit/test trajectories,
          manually traces divergences to skill sections, and makes SkillTriage
          cite differential skill or trajectory evidence.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper has no security endpoint and makes no task-complete-insecurity claim."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Single-run target/reference differences must be distinguished from
          ordinary agent variation for a skill-induced causal attribution.
        EVIDENCE_LOCATION: "arXiv v1, Sections III-A, VI-B, and VII-B"
        EVIDENCE_SUMMARY: >-
          Deterministic verifiers stabilize scoring, but the task executions
          themselves are single target/reference realizations. The threats
          section acknowledges ordinary agent variance, while the three
          repeated calls in Section VI-B rerun only the attribution procedure,
          not the benchmark tasks.
    SUPPORTED_INTERPRETATION: >-
      The paper supplies a carefully curated diagnostic corpus of 307 observed
      contrastive skill-associated failures or large cost regressions and a
      trace-grounded taxonomy under one agent/model setup. Its design is well
      suited to case discovery and triage analysis.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - "A prevalence rate or average causal effect of harmful skills in the broader skill ecosystem."
      - "A focal security effect or source-safe applicability-precondition shift."
      - >-
        Prospective outcome-blind selection of the particular failed skill and
        successful reference in each reported cross-skill case.
      - >-
        That every single-execution contrast would persist under independent
        reruns of the stochastic agent.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        A prespecified source procedure shown to be functionally correct and
        focal-safe in its original context, with a named safe-applicability
        predicate.
      - >-
        A matched target that differs on that predicate without another major
        incompatibility and whose requested feature is demonstrably absent
        before intervention.
      - >-
        Same-request task-completing insecure and secure controls, feature
        retention, and an independently grounded focal security witness.
      - >-
        Outcome-blind source assignment, a memory-content-appropriate context
        control if a content effect is claimed, direct uptake evidence for the
        focal procedure, joint task/security scoring, and independent task-run
        replications.

  - PAPER_ID: SLBENCH
    TITLE: "SLBench: Evaluating How LLM Agents Follow Logical Relations in Skills"
    AUTHORS:
      - Xuan Chen
      - Chengpeng Wang
      - Lu Yan
      - Xiangyu Zhang
    VERSION: "arXiv:2607.09016v1, 2026-07-10"
    VENUE_OR_STATUS: "arXiv preprint"
    SOURCE_URLS:
      - TYPE: ARXIV_ABSTRACT
        URL: https://arxiv.org/abs/2607.09016
        VERSION_OR_DATE: "v1, 2026-07-10"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: ARXIV_HTML
        URL: https://arxiv.org/html/2607.09016v1
        VERSION_OR_DATE: "v1, 2026-07-10"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: NOT_IDENTIFIED_IN_ACCESSIBLE_OFFICIAL_SOURCES
      COMMIT_OR_VERSION: NOT_AVAILABLE
      COMMIT_RESOLUTION_SOURCE: >-
        No project or author repository URL for SLBench was supplied by the
        official arXiv record or paper version inspected.
      ACCESS_STATUS: NOT_IDENTIFIED
    STATED_PRIMARY_CLAIM: >-
      Logical relations among clauses in public skill files are common and are
      a distinct reliability challenge: coding-agent configurations frequently
      produce artifact-grounded violations on an 86-case curated challenge
      set, and an explicit relation checklist reduces violations on a targeted
      subset.
    STATED_UNIT_OF_ANALYSIS: >-
      A source-grounded skill relation instantiated as one executable local
      case, crossed with an agent/backbone configuration; the SLGuard analysis
      uses 11 previously violated cases as paired before/after units.
    MEMORY_OR_SKILL_TREATMENT: >-
      The original public SKILL.md is given to every target execution. In the
      mitigation condition, SLGuard additionally prompts the agent to derive
      and check a compact list of the skill's governing relations.
    CONTROL_CONDITIONS:
      - 39 benchmark control cases where a relation can be exercised safely
      - 47 benchmark violation-oriented cases
      - Standard agent prompt versus the same case augmented with SLGuard
      - Clarified-skill ablation on 12 audited violation cases
      - Unsafe-first grader precedence compared on a 16-case subset
    TARGET_TYPE: >-
      Controlled local repositories and artifacts constructed to exercise
      precondition, postcondition, constraint, conjunction, fallback,
      exception, override, and conflict relations from public skills.
    FUNCTIONAL_ENDPOINT: >-
      No general task-completion endpoint is reported separately; each run is
      classified safe, unsafe, or inconclusive from relation-specific artifact
      and trace signals.
    SECURITY_ENDPOINT_IF_ANY: >-
      Deterministic relation-specific violation signals for actions such as
      unauthorized mutation, missing cleanup, invalid fallback, privacy leak,
      or unsafe configuration, with safe-signal groups and an inconclusive
      category.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper estimates logical-relation violation rates on constructed
          executions, not the effect of implementing an initially absent
          target feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Its unsafe label does not require the salient requested task to be
          complete; task-complete insecurity is not the stated benchmark
          estimand.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The benchmark contains safe control cases, but its own claim does not
          require a same-request secure implementation control for every unsafe
          case.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not estimate a secure repair effect for one requested
          feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The unsafe-rate claim requires relation-specific evidence that
          distinguishes violation, compliance, and insufficient evidence.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1-3.2; Appendix G and Table 6"
        EVIDENCE_SUMMARY: >-
          Graders use durable artifacts, repository state, and command traces,
          require affirmative unsafe evidence, retain an inconclusive category,
          and are stress-tested with a precedence-agnostic dual grader.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The claim concerns whether agents resolve clauses from a source skill;
          it does not claim that a source implementation of the procedure was
          demonstrated to work.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          A focal-safe source execution is not part of the logical-relation
          following estimand.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Each case must genuinely exercise the skill relation whose following
          is being measured.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.2-3.3 and Appendix E"
        EVIDENCE_SUMMARY: >-
          Only source-grounded, high-impact, locally testable relations proceed;
          the builder derives the request, seeded repository, and deterministic
          contract from the selected clauses, followed by execution and audit.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Conditions and precedence among clauses are the direct object of the
          paper's benchmark.
        EVIDENCE_LOCATION: "arXiv v1, Section 3.1 and Table 1"
        EVIDENCE_SUMMARY: >-
          The formal clause tuple includes a governing condition, and the eight
          relation types explicitly encode gates, limits, fallback triggers,
          exceptions, and priority rules.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          SLBench tests following a relation instantiated from the same skill;
          it does not estimate transfer from a demonstrated source context to
          a target where one predicate changes.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The paper does not claim a uniquely identified source-target
          precondition shift.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Reliable relation-following measurement requires delivery of the
          original skill and stable case materials.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.2 and 4.2"
        EVIDENCE_SUMMARY: >-
          Every agent is run on each case with the original skill file, user
          prompt, local environment, and deterministic grader, and the
          relation-to-contract schema is documented.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Resource differences are relevant to attributing the targeted
          mitigation improvement specifically to operationalized relations.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.3 and Appendix H"
        EVIDENCE_SUMMARY: >-
          The SLGuard comparison fixes skill, fixture, model interface, and
          grader but adds a checklist prompt. Appendix H gives aggregate
          pipeline token estimates and median execution times, not matched
          condition-specific context, action, tool, and runtime accounting for
          the 11 mitigation pairs.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claim that relation-aware scaffolding, specifically, causes the
          mitigation requires separation from generic checklist, caution, or
          added-context effects.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.4 and 4.3"
        EVIDENCE_SUMMARY: >-
          Standard and SLGuard prompts are compared, but there is no
          length-matched generic checklist or unrelated-caution placebo for the
          mitigation study.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Outcome-blind case and skill selection matters to a causal reading of
          the SLGuard reduction.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.3"
        EVIDENCE_SUMMARY: >-
          SLGuard is applied to 11 high-quality cases specifically because they
          were graded as violations in the original-skill condition; the
          mitigation analysis is therefore explicitly outcome-targeted.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The paper claims agents miss or operationalize relations, so final
          text alone is insufficient evidence of skill engagement.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1-3.2 and 4.4; Appendices F-G"
        EVIDENCE_SUMMARY: >-
          Classification uses command traces, mutations, and artifacts;
          relation-level human audit and clarified-skill reruns further connect
          skill wording to behavioral changes.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The paper interprets many violations as completing the salient task
          while missing a governing relation, which requires joint task and
          safety evidence.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1 and 4.2; Appendix D worked example"
        EVIDENCE_SUMMARY: >-
          The worked postcondition example verifies that the primary action was
          completed before the unsafe omission, but the headline safe, unsafe,
          and inconclusive categories do not separately score main-task
          completion for all 86 cases.
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Descriptive rates and the mitigation effect should distinguish case
          breadth from stochastic execution replication.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.2-4.3, Limitations, and Appendix H, Table 7"
        EVIDENCE_SUMMARY: >-
          The 532 sessions equal one execution for each of 86 cases and six
          configurations plus 16 ablation reruns. The 11-case mitigation uses
          one guarded realization per selected case, and no independent seed
          repetition is reported.
    SUPPORTED_INTERPRETATION: >-
      On this deliberately curated local challenge set, evaluated coding-agent
      configurations frequently leave observable violations of source-grounded
      skill relations. Relation salience and agent behavior both matter in the
      audited subset, and the targeted SLGuard reruns show a promising change
      in observed outcomes.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - "A field prevalence rate for skill-relation violations."
      - >-
        A general SLGuard causal effect separated from added checklist context
        and estimated on outcome-blind cases with repeated executions.
      - >-
        A benchmark-wide rate of task-complete insecurity, because main-task
        completion is not a separate endpoint for every case.
      - >-
        Transfer of a procedure already demonstrated correct and focal-safe in
        its source context across one isolated applicability shift.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        Source-context execution showing that a particular procedure is
        functionally correct and safe under the same focal witness.
      - >-
        A matched target with a prespecified named predicate shift and no other
        major incompatibility, with genuine initial task incompleteness.
      - >-
        Same-request task-completing insecure and secure states plus a
        feature-retention check and a joint functionality/security endpoint.
      - >-
        Outcome-blind case selection, a resource-matched generic-checklist
        control, and repeated target executions for the relevant comparison.

  - PAPER_ID: SWE_SKILLS_BENCH
    TITLE: "SWE-Skills-Bench: Do Agent Skills Actually Help in Real-World Software Engineering?"
    AUTHORS:
      - Tingxu Han
      - Yi Zhang
      - Wei Song
      - Chunrong Fang
      - Zhenyu Chen
      - Youcheng Sun
      - Lijie Hu
    VERSION: "arXiv:2603.15401v1, 2026-03-16"
    VENUE_OR_STATUS: "arXiv preprint; marked preliminary results and work in progress"
    SOURCE_URLS:
      - TYPE: ARXIV_ABSTRACT
        URL: https://arxiv.org/abs/2603.15401
        VERSION_OR_DATE: "v1, 2026-03-16"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: ARXIV_HTML
        URL: https://arxiv.org/html/2603.15401v1
        VERSION_OR_DATE: "v1, 2026-03-16"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: AUTHOR_REPOSITORY
        URL: https://github.com/GeniusHTX/SWE-Skills-Bench
