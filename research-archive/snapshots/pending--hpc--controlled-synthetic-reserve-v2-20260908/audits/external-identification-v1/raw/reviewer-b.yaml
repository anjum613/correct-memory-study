        EVIDENCE_SUMMARY: ""
      A4_FEATURE_RETENTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper does not claim a secure repair preserving a legitimate target feature."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The central before/after safety claim requires an externally defined
