      - Xin Zhou
      - Xing Hu
      - David Lo
    VERSION: "ACL 2026 proceedings version, July 2026; arXiv:2509.22097v5, 2026-06-06"
    VENUE_OR_STATUS: "Proceedings of ACL 2026, Volume 1: Long Papers, pages 24144-24168"
    SOURCE_URLS:
      - TYPE: OFFICIAL_PROCEEDINGS
        URL: https://aclanthology.org/2026.acl-long.1107/
        VERSION_OR_DATE: "ACL 2026, July 2026"
        ACCESS_STATUS: ACCESSIBLE
