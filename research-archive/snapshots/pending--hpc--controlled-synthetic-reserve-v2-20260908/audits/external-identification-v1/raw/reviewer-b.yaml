        VERSION_OR_DATE: "v5, 2026-06-06"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: ARXIV_HTML
        URL: https://arxiv.org/html/2509.22097v5
        VERSION_OR_DATE: "v5, 2026-06-06"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: AUTHOR_REPOSITORY
        URL: https://github.com/iCSawyer/SecureVibeBench
        VERSION_OR_DATE: "main head 47c452becd3011ad948876e7cf0f3cca5846802d, 2026-06-28"
        ACCESS_STATUS: ACCESSIBLE
      - TYPE: OFFICIAL_DATASET
        URL: https://huggingface.co/datasets/iCSawyer/SecureVibeBench
        VERSION_OR_DATE: "accessed 2026-09-03"
        ACCESS_STATUS: ACCESSIBLE
    OFFICIAL_REPOSITORY:
      URL: https://github.com/iCSawyer/SecureVibeBench
      COMMIT_OR_VERSION: 47c452becd3011ad948876e7cf0f3cca5846802d
      COMMIT_RESOLUTION_SOURCE: >-
        Official GitHub main-branch history; the head commit page identifies
        full SHA 47c452becd3011ad948876e7cf0f3cca5846802d,
        dated 2026-06-28.
      ACCESS_STATUS: ACCESSIBLE
    STATED_PRIMARY_CLAIM: >-
      SecureVibeBench reconstructs 105 realistic C/C++ repository-level coding
      tasks at human vulnerability-introduction points and jointly evaluates
      agent patches for functionality, the historical vulnerability, and new
      static-analysis findings; the best evaluated configuration produces only
      23.8 percent correct-and-secure patches.
    STATED_UNIT_OF_ANALYSIS: >-
      One generated patch for a benchmark task under an agent/backbone
      configuration; each task-configuration combination is executed once and
      classified into one of four joint functionality/security categories.
    MEMORY_OR_SKILL_TREATMENT: >-
      None. The study compares code-agent and backbone configurations on a
      benchmark and does not deliver a source procedural memory or skill.
    CONTROL_CONDITIONS:
      - Parent of the vulnerability-introducing commit as the task base state
      - Human vulnerability-introducing commit as the gold functional behavior and known vulnerable state
      - Later vulnerability-fixing commit used during dynamic introduction validation
      - Multiple agent and backbone configurations, not a memory-treatment control
    TARGET_TYPE: >-
      Multi-file C/C++ repository tasks reconstructed from 41 OSS-Fuzz and ARVO
      projects at the parent of a dynamically verified vulnerability-
      introducing commit.
    FUNCTIONAL_ENDPOINT: >-
      Differential execution of project tests comparing the generated patch's
      behavior with the vulnerability-introducing gold patch.
    SECURITY_ENDPOINT_IF_ANY: >-
      An ARVO proof-of-vulnerability for the historical vulnerability plus
      Semgrep 1.137.0 findings for potential newly introduced issues; patches
      are classified incorrect, correct-but-vulnerable,
      correct-but-suspicious, or correct-and-secure.
    RATINGS:
      A1_TARGET_TASK_INCOMPLETENESS:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Genuine absence of the requested change is relevant to interpreting
          the benchmark as implementation rather than acceptance of an
          already-satisfied state.
        EVIDENCE_LOCATION: "arXiv v5, Sections 3.1-3.2 and Appendix B (Functionality Oracle Acquisition)"
        EVIDENCE_SUMMARY: >-
          Tasks start at the parent of the vulnerability-introducing commit and
          requirements are derived from the introducing change, but no no-op
          evaluation is reported. Appendix B checks only that at least one
          selected project test succeeds in the pre-patched repository, not
          that the untouched state differs from the gold behavior or cannot
          satisfy the reconstructed requirement.
      A2_INSECURE_TASK_COMPLETING_CONTROL:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The benchmark's defining question requires an implementation of the
          requested change that is functionally accepted yet contains the focal
          vulnerability.
        EVIDENCE_LOCATION: "arXiv v5, Sections 3.1-3.2, especially the VIC/PVIC construction and Equations implicit in the four outcome categories"
        EVIDENCE_SUMMARY: >-
          The human vulnerability-introducing commit supplies the requirement's
          gold functional behavior, while dynamic filtering retains it only
          when the PoV identifies it as vulnerable and its parent and later fix
          are secure.
      A3_SECURE_TASK_COMPLETING_CONTROL:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A secure implementation satisfying the same reconstructed request is
          needed to establish that every task permits the benchmark's desired
          joint state.
        EVIDENCE_LOCATION: "arXiv v5, Section 3.2 (Cascading Static and Dynamic Analysis and Evaluation Oracle Acquisition)"
        EVIDENCE_SUMMARY: >-
          The later vulnerability-fixing commit is shown secure against the
          PoV, but the paper does not report running each reconstructed
          requirement's differential functional endpoint on that fix as a
          same-request secure positive control.
      A4_FEATURE_RETENTION:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The secure positive state must retain the functionality introduced by
          the historical change for a secure-coding interpretation.
        EVIDENCE_LOCATION: "arXiv v5, Sections 3.1-3.2"
        EVIDENCE_SUMMARY: >-
          Dynamic validation establishes that the vulnerability-fixing commit
          is secure, but accessible evidence does not jointly verify that it
          preserves the exact reconstructed requirement under the benchmark's
          functional oracle for all 105 tasks.
      A5_FOCAL_SECURITY_WITNESS:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A grounded witness is essential to classify the historical
          vulnerability in generated patches.
        EVIDENCE_LOCATION: "arXiv v5, Sections 3.1-3.2; Appendix B; Section 5 discussion of SAST false alarms"
        EVIDENCE_SUMMARY: >-
          ARVO PoV programs execute a binary test for each historical
          vulnerability and are validated across the fixing, introducing, and
          parent commits. Semgrep findings are kept in a distinct suspicious
          category, and the paper separately audits and discloses their high
          false-alarm rate rather than treating them as confirmed focal
          vulnerabilities.
      B1_SOURCE_FUNCTIONAL_CORRECTNESS:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No source procedural memory or skill is evaluated."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper has no memory-source context whose safety is part of its claim."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "There is no source procedure transferred as a treatment."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The benchmark does not study safe reuse of a procedure across an applicability predicate."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No memory source-to-target predicate shift is claimed."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "There is no claimed source-memory transfer contrast to deconfound."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No memory or skill treatment is delivered."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          The primary claim compares agent configurations rather than isolating
          memory-content effects; memory-delivery resource balance is therefore
          outside its estimand.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "There is no additional-context or skill-loading treatment to control."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "No source memory or skill is selected for target executions."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: "The paper makes no mechanism claim about uptake of a memory or skill."
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Joint interpretation is central to the paper's claim that agents
          struggle to produce patches that are both correct and secure.
        EVIDENCE_LOCATION: "arXiv v5, Section 3.1 and Figure 4; Sections 4.1-4.3"
        EVIDENCE_SUMMARY: >-
          Every patch first receives a functional classification and then,
          among functionally correct patches, distinct vulnerable, suspicious,
          or secure labels; the four exhaustive categories are reported over
          all generated patches rather than dropping incorrect outputs.
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The configuration rates should use distinct benchmark tasks as units
          and avoid presenting deterministic reruns as independent evidence.
        EVIDENCE_LOCATION: "arXiv v5, Section 3.3; Appendix C.2-C.3"
        EVIDENCE_SUMMARY: >-
          The paper states that every agent/model combination is run once on
          each of 105 distinct tasks, uses temperature 0.0 for the main agents,
          and reports task proportions; it does not inflate evidence with
          duplicate deterministic reruns.
    SUPPORTED_INTERPRETATION: >-
      SecureVibeBench provides a joint functional and security classification
      for agent patches on 105 reconstructed historical vulnerability-
      introduction scenarios. Its dynamically verified human introducing
      commit is a strong task-completing vulnerable reference, and the reported
      configuration rates are descriptive of these benchmark tasks.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - >-
        That every untouched parent repository fails the reconstructed request
        or differs from the gold behavior under the functional oracle.
      - >-
        That the later secure fix is a same-request, function-retaining secure
        positive control for every benchmark task.
      - >-
        That Semgrep's suspicious category is equivalent to confirmed new
        vulnerability, which the paper itself does not claim.
      - >-
        Any causal effect of procedural memory or of a source-to-target
        applicability-condition shift.
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        Per-task no-op validation plus functional testing of a secure
        same-request implementation to establish target incompleteness, secure
        task completion, and feature retention.
      - >-
        A defined procedural memory drawn from a source where the procedure is
        demonstrated both correct and safe under the benchmark's focal PoV.
      - >-
        Evidence that the source and target share the operation, a named
        applicability condition holds at source and fails at target, and no
        second major mismatch is present.
      - >-
        Faithful and outcome-blind memory assignment, resource-matched and
        content-appropriate controls, direct uptake evidence, and independent
        execution replications for the memory comparison.
