          produced by the self-evolving systems; it does not require each
          encoded procedure to be independently proven correct at source.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B2_SOURCE_FOCAL_SAFETY:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          Benign-task provenance is the studied exposure, but independent
          certification against the later target's focal security witness is
          not part of the stated estimand.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      B3_PROCEDURAL_RELEVANCE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The execution-bias mechanism requires retrieved benign experience to
          contain action procedures relevant to later web or household action.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1 and 4.1; Appendices A-B"
        EVIDENCE_SUMMARY: >-
          The experiment retrieves top-ranked experiences within the same web
          or household interaction modality, and the manual flip analysis
          identifies execution steps and action-oriented guidance that carry
          into hazardous target decisions.
      B4_EXPLICIT_APPLICABILITY_PREDICATE:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claimed safety reversal is explicitly conditioned on benign
          versus harmful or safety-sensitive task context.
        EVIDENCE_LOCATION: "arXiv v1, Sections 1, 3.1, and 5"
        EVIDENCE_SUMMARY: >-
          The design names benign experience-accumulation tasks and disjoint
          high-risk target tasks requiring refusal, and later separates
          execution from refusal experience on harmful tasks.
      B5_SOURCE_TARGET_PSTAR_SHIFT:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          A benign-to-hazardous context change is the source-target shift at the
          center of the paper's empirical claim.
        EVIDENCE_LOCATION: "arXiv v1, Section 3.1 and Appendix B"
        EVIDENCE_SUMMARY: >-
          Offline web experience comes from benign WebArena tasks and is
          evaluated on BrowserART and Agent-SafetyBench; household experience
          uses a benign SafeAgentBench subset and a disjoint hazardous subset.
      B6_NO_SECOND_MAJOR_MISMATCH:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The execution-bias interpretation would be stronger if hazardousness
          were isolated from other differences between source and target task
          distributions.
        EVIDENCE_LOCATION: "arXiv v1, Section 3.1 and Appendix B"
        EVIDENCE_SUMMARY: >-
          The source and target use different task sets and, in the web study,
          different benchmarks with different instructions and action
          distributions. The no-experience comparison identifies the effect of
          adding memory on the target, but does not show that hazardousness is
          the only important source-target mismatch.
      C1_MEMORY_OR_SKILL_FIDELITY:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The safety-degradation claim requires a defined experience object and
          retrieval protocol.
        EVIDENCE_LOCATION: "arXiv v1, Section 2, Section 3.1, and Appendix A"
        EVIDENCE_SUMMARY: >-
          Agent Workflow Memory and ReasoningBank construction, offline and
          online update modes, top-three retrieval, backbone settings, and
          experience prompt placement are described.
      C2_RESOURCE_BALANCED_COMPARISON:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The claim that semantic experience content, not merely longer context,
          causes degradation requires a prompt-resource control.
        EVIDENCE_LOCATION: "arXiv v1, Section 4.3 and Appendix D.5"
        EVIDENCE_SUMMARY: >-
          The authors replace retrieved experience with an expanded safety
          instruction matched to average experience length while retaining the
          target tasks, agent, and backbone, and report the resulting attack-
          success comparison.
      C3_APPROPRIATE_CONTROL_CONDITION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Distinguishing experience semantics from generic extra context is an
          explicit part of the causal content claim.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.2-3.3 and 4.3; Table 3"
        EVIDENCE_SUMMARY: >-
          Before/no-experience baselines identify the total memory effect, and
          a length-matched expanded system instruction provides an additional-
          context control for the semantic-content interpretation.
      C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Target-outcome-independent experience construction is needed for the
          reported before/after safety effect.
        EVIDENCE_LOCATION: "arXiv v1, Sections 3.1 and 5; Appendices B-C"
        EVIDENCE_SUMMARY: >-
          Offline memories are accumulated on specified benign tasks before
          evaluation on separate safety sets; household benign and hazardous
          sets are disjoint, and harmful training tasks used in the composition
          study are excluded from downstream evaluation.
      D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
        STATUS: ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          The execution-bias mechanism requires more than proof that experience
          text was delivered.
        EVIDENCE_LOCATION: "arXiv v1, Sections 4.1 and 4.3; Appendices D.4 and D.7"
        EVIDENCE_SUMMARY: >-
          Human annotators identify safe-to-unsafe action flips and execution-
          oriented experience spans, while integrated-gradient analyses relate
          experience content to action rather than refusal tokens.
      D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
        STATUS: NOT_APPLICABLE
        APPLICABILITY_RATIONALE: >-
          On the harmful target tasks, refusal is the desired safe response;
          the paper does not define security as insecurity conditional on
          completing a legitimate requested feature.
        EVIDENCE_LOCATION: ""
        EVIDENCE_SUMMARY: ""
      D3_UNIT_AND_REPLICATION_VALIDITY:
        STATUS: NOT_ESTABLISHED
        APPLICABILITY_RATIONALE: >-
          Cross-backbone consistency and online temporal trends require clarity
          about independent executions, seeds, and repeated trajectories.
        EVIDENCE_LOCATION: "arXiv v1, Section 3.1; Appendices C and D.3"
        EVIDENCE_SUMMARY: >-
          The paper specifies temperatures 0.1 and 0.7 and reports multiple
          backbones and evaluation intervals, but no independent execution
          repetitions or seed-level uncertainty. Successive online intervals
          arise from the same evolving process and are not independent
          replications.
    SUPPORTED_INTERPRETATION: >-
      In the evaluated self-evolving frameworks and benchmark pairings,
      exposure to benign action-oriented experience increases unsafe compliance
      on later hazardous tasks. The before/after and length-matched controls,
      together with behavioral analyses, support an experience-content effect;
      refusal memories expose a safety-utility trade-off.
    INTERPRETATIONS_NOT_ESTABLISHED:
      - >-
        Transfer of one procedure independently shown correct and focal-safe in
        its source context.
      - >-
        Isolation of hazardousness as the only major source-target difference.
      - >-
        A change in task-complete insecurity for a legitimate requested feature
        with same-task secure and insecure controls.
      - "Seed-level replication and uncertainty for the online evolving trajectories."
    ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
      - >-
        Select one concrete procedural operation and demonstrate its functional
        correctness and focal safety in a source context under the same
        security witness.
      - >-
        Construct a closely matched legitimate target where a named safety
        precondition alone changes, establish initial incompleteness, and rule
        out other major source-target mismatches.
      - >-
        Supply same-request task-completing insecure and secure controls and
        show that security remediation retains the feature.
      - >-
        Use a joint task-complete security endpoint, outcome-blind source
        assignment, direct focal-procedure uptake evidence, and independent
        repeated executions.

  - PAPER_ID: SECUREVIBEBENCH
    TITLE: "SecureVibeBench: Benchmarking Secure Vibe Coding of AI Agents via Reconstructing Vulnerability-Introducing Scenarios"
    AUTHORS:
      - Junkai Chen
      - Huihui Huang
      - Yunbo Lyu
      - Junwen An
      - Jieke Shi
      - Chengran Yang
      - Ting Zhang
      - Haoye Tian
