CAUSAL_CLAIM: >-
  Does exposure to a relevant procedural memory that is demonstrably correct
  and focal-safe in its source context change task-complete insecurity when a
  named security-relevant applicability condition does not transfer to the
  target?

IDENTIFICATION_REQUIREMENTS:
  GROUP_A_TARGET_OUTCOME_VALIDITY:
    A1_TARGET_TASK_INCOMPLETENESS: >-
      The requested target functionality is genuinely absent before
      intervention and a no-op does not satisfy the task.
    A2_INSECURE_TASK_COMPLETING_CONTROL: >-
      There exists an implementation/state that genuinely completes the
      requested task while failing the focal security requirement.
    A3_SECURE_TASK_COMPLETING_CONTROL: >-
      There exists an implementation/state that genuinely completes the same
      requested task while passing focal security.
    A4_FEATURE_RETENTION: >-
      The secure repair preserves the requested functionality rather than
      removing the feature or changing the task.
    A5_FOCAL_SECURITY_WITNESS: >-
      The focal security endpoint is executable or otherwise independently
      grounded and discriminates the intended unsafe/safe states.
  GROUP_B_SOURCE_TRANSFER_VALIDITY:
    B1_SOURCE_FUNCTIONAL_CORRECTNESS: >-
      The source procedure is demonstrated to work in its source context.
    B2_SOURCE_FOCAL_SAFETY: >-
      The source procedure is demonstrated to be safe with respect to the focal
      security property in its original source context.
    B3_PROCEDURAL_RELEVANCE: >-
      The source procedure and target task genuinely share the procedural
      operation whose transfer is being studied.
    B4_EXPLICIT_APPLICABILITY_PREDICATE: >-
      A named condition/precondition governing safe transfer is specified.
    B5_SOURCE_TARGET_PSTAR_SHIFT: >-
      The relevant condition is established in the source and differs/fails in
      the target.
    B6_NO_SECOND_MAJOR_MISMATCH: >-
      The intended applicability/security difference is not obviously
      confounded by another comparably important source-target incompatibility.
  GROUP_C_TREATMENT_VALIDITY:
    C1_MEMORY_OR_SKILL_FIDELITY: >-
      The treatment actually delivers the intended source memory/skill in a
      defined and reproducible form.
    C2_RESOURCE_BALANCED_COMPARISON: >-
      The relevant comparison controls, measures, or explicitly treats
      context, token, action, tool, and runtime differences introduced by
      memory/skill delivery.
    C3_APPROPRIATE_CONTROL_CONDITION: >-
      The evaluation includes a comparison capable of separating the intended
      memory/skill content effect from generic additional-context/skill-loading
      effects where such separation is part of the stated claim.
    C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION: >-
      The source/skill used for the evaluated target is not chosen or changed
      after observing the target's evaluated outcome.
  GROUP_D_PROCESS_ANALYSIS_VALIDITY:
    D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED: >-
      The study distinguishes treatment delivery from evidence that the agent
      actually used/engaged with the memory or skill when mechanism claims
      require that distinction.
    D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE: >-
      The analysis distinguishes task failure from task-complete insecurity
      rather than interpreting security conditional on a post-treatment success
      state in a way that changes the estimand.
    D3_UNIT_AND_REPLICATION_VALIDITY: >-
      Reported repetitions/seeds/tasks are interpreted using defensible
      experimental units rather than treating effectively deterministic
      duplicates as independent evidence.
CRITERIA_COUNT: 18
CRITERION_FREEZE_RULE: >-
  Criterion names and definitions must remain byte-for-byte unchanged after
  this protocol commit. Adjudication may not revise or reinterpret the frozen
  definitions to force agreement.

ALLOWED_STATUSES:
  - ESTABLISHED
  - NOT_ESTABLISHED
  - UNDETERMINED
  - NOT_APPLICABLE
STATUS_DEFINITIONS:
  ESTABLISHED: >-
    The accessible paper/artifact provides sufficient evidence for the
    criterion relative to the paper's relevant claim.
  NOT_ESTABLISHED: >-
    The criterion applies to the claim being evaluated, and accessible evidence
    does not establish it. This does not mean the opposite property is proven.
  UNDETERMINED: >-
    Available materials are insufficient to determine whether the criterion
    holds.
  NOT_APPLICABLE: >-
    The criterion is not required for the paper's actual stated estimand or
    claim. Do not penalize a paper for evidence irrelevant to a claim it never
    makes.
TERMINOLOGY_RESTRICTION: >-
  Do not use PASS or FAIL terminology for published papers.

TWO_QUESTION_RULE:
  QUESTION_1_PAPERS_OWN_CLAIM:
    QUESTION: >-
      What is the paper's actual stated estimand or main empirical claim, and
      which identification requirements are genuinely applicable to it?
    RATING_RULE: >-
      Rate relative to that claim and mark requirements not required by that
      claim NOT_APPLICABLE.
  QUESTION_2_REUSE_FOR_OUR_STRONGER_CLAIM:
    QUESTION: >-
      If the paper's benchmark/evaluation setup were reused as evidence for the
      source-correct, source-safe, security-precondition-shift causal claim,
      which additional requirements would still have to be established?
    REPORTING_RULE: >-
      Report the additional evidence separately; do not conflate insufficiency
      for the stronger estimand with invalidity for the paper's own claim.

EVIDENCE_SOURCE_PRIORITY:
  - official conference or proceedings page
  - official arXiv version
  - official OpenReview entry where applicable
  - official project page
  - official authors' GitHub repository
  - official benchmark artifact
EXCLUDED_CRITERION_EVIDENCE:
  - blogs
  - secondary summaries
  - social media
  - search-result snippets
EVIDENCE_RECORDING_RULES:
  - Record exact title, authors, version or date, venue or status, and canonical URL.
  - Record official repository URL and version, commit, or hash when available.
  - Give a page, section, table, appendix, or artifact location for every non-N/A rating.
  - Use concise evidence paraphrases and no long quotations.
  - For NOT_APPLICABLE, give a claim-relative applicability rationale.
  - If accessible original materials cannot decide an applicable criterion, use UNDETERMINED.

REVIEW_MODE: TWO_ISOLATED_AI_REVIEWERS
REVIEW_ASSISTANCE_LABEL: AI_RESEARCH_REVIEWER_ASSISTANCE_NOT_EVALUATED_MODEL_RUN
REVIEWERS:
  - REVIEWER_A
  - REVIEWER_B
REVIEWER_INDEPENDENCE_PROCEDURE:
  - Each reviewer receives this frozen protocol and the same six immutable targets.
  - Each reviewer independently locates and inspects original sources.
  - Neither reviewer may inspect or receive the other reviewer's ratings before both raw outputs are frozen.
  - Each reviewer rates all 18 criteria for all six papers.
  - Each non-N/A rating must include an evidence location and concise rationale.
  - Each N/A rating must include a claim-relative applicability rationale.
  - Raw outputs must be committed before reconciliation begins.
INDEPENDENCE_LIMITATION: >-
  The passes use isolated model contexts but share the same frozen protocol and
  may draw on the same public source corpus. They are AI-assisted research
  reviews, not human reviews and not statistically independent human judgments.

AGREEMENT_PLAN:
  EXACT_AGREEMENT_OVERALL: >-
    Number and percentage of identical status assignments across all 108
    paper-by-criterion cells.
  AGREEMENT_BY_CRITERION: >-
    For each criterion, number and percentage of identical assignments across
    the six papers.
  DISAGREEMENT_COUNT: >-
    Number of cells with different reviewer statuses.
  DISAGREEMENT_TYPES: >-
    Unordered pairs of the two original status values with cell counts.

ADJUDICATION_PLAN:
  ALLOWED_SOURCES:
    - frozen criterion definitions
    - original paper
    - supplement
    - official artifact
  REQUIRED_FIELDS:
    - ORIGINAL_A
    - ORIGINAL_B
    - FINAL_ADJUDICATED
    - EVIDENCE
    - RATIONALE
  AMBIGUITY_RULE: >-
    Use UNDETERMINED when original evidence remains ambiguous; do not force
    consensus.

