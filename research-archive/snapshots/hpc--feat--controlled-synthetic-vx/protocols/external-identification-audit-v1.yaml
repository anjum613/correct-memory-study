PROTOCOL_ID: EXTERNAL_IDENTIFICATION_AUDIT_V1
PROTOCOL_VERSION: "1.0"
PROTOCOL_STATUS: FROZEN_BEFORE_PAPER_SCORING
BASE_COMMIT: 783a4cb151631092cea8a0633f4f050db7c4a381
AUDIT_TYPE: EXTERNAL_FRAMEWORK_APPLICATION_STUDY

PURPOSE: >-
  Evaluate whether the final security-sensitive procedural-transfer
  identification framework provides useful distinctions when applied to
  existing published agent-memory/skill evaluations.

NOT_A_PREVALENCE_STUDY: true
NOT_A_BENCHMARK_RANKING: true
NOT_A_CLAIM_THAT_OTHER_PAPERS_ARE_INVALID: true
NOT_BLINDED_TO_LITERATURE_SELECTION: true
LITERATURE_SELECTION_RATIONALE: >-
  The six works were deliberately selected because prior novelty reviews had
  already identified them as close related work. This audit is an external
  framework-application study, not an unbiased random sample of the
  literature. The audit does not claim prospective blindness to works already
  known before this protocol was frozen.
TARGET_SUBSTITUTION_POLICY: >-
  The six primary slots are immutable after protocol freeze. If a paper or
  artifact is inaccessible, preserve its slot and rate unverifiable evidence
  UNDETERMINED; do not replace it.

