  - APPLICABILITY_RATIONALE
  - EVIDENCE_LOCATION
  - EVIDENCE_SUMMARY

CROSS_PAPER_ANALYSIS_PLAN:
  COUNT_FIELDS:
    - ESTABLISHED
    - NOT_ESTABLISHED
    - UNDETERMINED
    - NOT_APPLICABLE
  QUESTIONS:
    - requirements already commonly handled well
    - requirements specific to the security-sensitive transfer claim
    - requirements inconsistently established
    - requirements reflecting different but legitimate estimands
    - precision added beyond a generic benchmark-validity checklist
  PRIORITY_DISTINCTIONS:
    - relevance versus applicability
    - source correctness versus focal source safety
    - memory content versus context or resource burden
    - delivery versus uptake
    - genuine target incompleteness
    - joint functional and security controls
    - outcome-aware source or skill selection
  PREVALENCE_CAVEAT: >-
    Counts describe only these six deliberately selected papers and must not be
    interpreted as literature prevalence.

NOVELTY_STRESS_TEST:
  ALLOWED_RESULTS:
    - FRAMEWORK_DISTINCTIVE
    - FRAMEWORK_PARTIALLY_DISTINCTIVE
    - FRAMEWORK_LARGELY_REDUNDANT
  DECISION_RULE: >-
    Decide whether the complete combination of frozen requirements adds useful
    distinctions or whether leading audited evaluations already implement
    essentially the full applicable contract. Do not optimize for a particular
    result.

GENERIC_VALIDITY_COMPARISON:
  TARGET_COUNT: 1_OR_2_UNSCORED_FRAMEWORKS
  CANDIDATE_SCOPE: >-
    Original sources for general agent-benchmark validity frameworks already
    known in the project, such as ABC or rigorous agentic benchmark
    methodology.
  LABELS:
    - GENERIC_VALIDITY_PRINCIPLE
    - SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
  NON_TARGET_RULE: >-
    Do not add or score these frameworks as primary empirical audit targets and
    do not claim specialization where prior work states the same requirement
    substantively.

OUTPUT_FORMAT_RULES:
  DATA_FORMAT: YAML_ONLY
  FORBIDDEN_NEW_DOCUMENT_FORMATS:
    - Markdown
    - JSON
  COPYRIGHT_POLICY: >-
    Do not commit paper PDFs. Store citation metadata, official URLs, artifact
    versions, and hashes where available.
  TABLE_DATA:
    REQUIREMENTS_BY_PAPER: >-
      Rows are all 18 frozen criteria; columns are the six frozen papers; cells
      use exactly one allowed status.
    CLAIM_DESIGN_GAP_BY_PAPER: >-
      For each paper record its stated claim, what its design establishes, and
      what the stronger security-transfer claim additionally requires.

CLAIM_BOUNDARIES:
  FORBIDDEN_CONCLUSION: Existing memory benchmarks are invalid.
  PERMITTED_GENERAL_FORM: >-
    Existing evaluations instantiate different subsets of the evidence
    required for different causal claims.
  PERMITTED_IF_SUPPORTED: >-
    No audited evaluation simultaneously establishes all requirements needed
    for the specific source-correct, source-safe,
    security-precondition-shift estimand.
  SCOPE_QUALIFIER: >-
    Any cross-paper conclusion applies only to these six deliberately selected
    works and is not a prevalence estimate.

