      mismatch, which requires separating content from generic added-context effects.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.1-4.3 and Table 2.
    EVIDENCE_SUMMARY: The only principal control omits SKILL.md; no length-matched neutral
      skill or generic-context placebo is reported for the content-specific mechanism interpretations.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Skills and tasks used for the paired evaluation must be fixed
      without using their target outcomes.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1-3.3 and Figure 3.
    EVIDENCE_SUMMARY: The paper gives a sequential pre-evaluation curation, project-matching,
      requirement-authoring, and verifier-generation pipeline and reports results for all
      49 selected skills; no target outcome is an input to those selection rules.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Claims that skills reshape reasoning paths or cause version-specific
      interference require evidence that the agent actually engaged with the delivered file.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.1-4.3 and Table 2.
    EVIDENCE_SUMMARY: The paper states that Claude Code discovers skills autonomously and
      infers engagement from paired outcomes and token use, but does not report a direct uptake
      indicator or systematic trace-level engagement measure.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: There is no security endpoint to interpret jointly with task
      success.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Section 4.2.
    EVIDENCE_SUMMARY: The endpoint is functional requirement satisfaction and token cost.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Skill-level deltas must use task instances, rather than repeated
      deterministic checks, as the empirical units.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.4 and 4.2; Equations 1-2 and Table 2.
    EVIDENCE_SUMMARY: The task tuple and binary paired verdicts are explicit, pass rates are
      averages over the distinct tasks associated with each skill, and deterministic verifier
      execution is not counted as independent replication.
