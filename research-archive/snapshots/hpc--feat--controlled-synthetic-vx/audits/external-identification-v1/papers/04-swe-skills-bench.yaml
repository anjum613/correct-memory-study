      execution is asserted to demonstrate their correctness.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3.1-3.2.
    EVIDENCE_SUMMARY: The source artifact is a selected skill file, not a source-success trajectory.
