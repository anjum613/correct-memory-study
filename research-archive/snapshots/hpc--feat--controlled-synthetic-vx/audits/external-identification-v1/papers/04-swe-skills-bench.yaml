SUPPORTED_INTERPRETATION: For the generated task suite and single Claude Code/Haiku 4.5 configuration,
  making the selected skill available changes average functional success little and increases
  average token use. The Linkerd trace supports one concrete context-interference mechanism.
INTERPRETATIONS_NOT_ESTABLISHED:
  - That every generated task is initially unsatisfied by the untouched repository.
  - A focal security or source-safe precondition-shift effect.
  - A semantic content effect separated from all generic context and resource burdens.
  - Run-level stochastic stability or generalization beyond the single agent/backbone and
    authored task distribution.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - Per-task initial-state and no-op validation.
  - A source execution demonstrated correct and focal-safe under the same security witness.
  - A named security predicate and a matched source-target pair differing on that predicate
    without a second major mismatch.
  - Same-request insecure and secure task-completing states with feature retention and an
    executable security witness.
  - Resource-matched content controls, outcome-blind source assignment, systematic focal uptake,
    joint outcomes, and appropriate reruns.
