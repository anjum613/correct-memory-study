  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Direct engagement evidence is needed for the paper's concrete
      context-interference mechanism example.
    EVIDENCE_LOCATION: arXiv v1, Section 4.3, Figure 5
    EVIDENCE_SUMMARY: For linkerd-patterns, the paper traces copied API versions, protocol
      choices, fabricated fields, and an extra resource to specific regions of the injected
      templates, while contrasting the no-skill reasoning.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The study reports functional utility and token cost, not a security-conditioned
      task estimand.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Paired marginal effects from an LLM agent require clarity about
      repeated executions and the dependence of generated tasks within a skill and repository.
    EVIDENCE_LOCATION: arXiv v1, Sections 4.1-4.2, Table 2, and Section 5
    EVIDENCE_SUMMARY: Each task contributes one binary result per condition and results are
      aggregated over roughly ten generated instances per skill, but no seed, rerun, uncertainty,
      or within-skill dependence treatment is reported; only one agent and backbone are evaluated.
