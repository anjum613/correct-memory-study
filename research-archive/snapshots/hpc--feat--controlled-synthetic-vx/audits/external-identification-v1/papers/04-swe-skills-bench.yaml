    EVIDENCE_SUMMARY: With-skill and no-skill runs share the same target task.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: No source-target security-condition shift is claimed.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 3-4.
    EVIDENCE_SUMMARY: The comparison is a within-task skill-delivery contrast.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The marginal utility comparison requires a reproducible difference
      in skill delivery.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.2, 3.4, and 4.1.
    EVIDENCE_SUMMARY: Pre-existing skills are removed; the intended SKILL.md is copied into
      the designated location only in the treatment condition, while the task prompt never
      names it and the same agent discovers it automatically.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Skill utility and overhead interpretations require explicit treatment
