STATED_PRIMARY_CLAIM: Controlled with-skill versus without-skill evaluation on approximately
  565 requirement-driven software-engineering tasks shows limited average marginal utility,
  sometimes large token overhead, benefits concentrated in specialized skills, and a small
  number of negative deltas attributed to project-context incompatibility.
STATED_UNIT_OF_ANALYSIS: A generated task instance associated with one skill and fixed repository,
  evaluated once in each skill condition and aggregated by skill.
MEMORY_OR_SKILL_TREATMENT: A selected public SKILL.md copied into the project so Claude Code
  can discover it automatically; the paired condition omits the file.
CONTROL_CONDITIONS: Same task, fixed-commit repository, container, agent, model, requirements,
  and deterministic verifier with versus without SKILL.md.
TARGET_TYPE: Requirement-authored software-engineering tasks over authentic GitHub repositories
  pinned at fixed commits across six SWE categories.
FUNCTIONAL_ENDPOINT: Binary pass under deterministic pytest checks mapped from every stated
  acceptance criterion; pass-rate delta and token cost are aggregated by skill.
