ADJUDICATION_RULE: >-
  Only the frozen definitions and original paper, supplement, or official
  artifact were used. Claim-relative applicability was decided before
  sufficiency. A missing requirement for the stronger project estimand was not
  treated as applicable to a paper whose own estimand did not require it.
ADJUDICATOR: PRIMARY_CODEX_RESEARCH_AGENT
ADJUDICATOR_MODEL_DISCLOSURE: >-
  OpenAI Codex in the GPT-5 family. The environment does not expose an exact
  backend build, checkpoint, weights identifier, or serving snapshot, so none
  is inferred.
ADJUDICATIONS:
  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    CRITERION: A1_TARGET_TASK_INCOMPLETENESS
    ORIGINAL_A: NOT_APPLICABLE
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: NOT_ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Section 5.1 (Benchmarks) and Tables 1-3;
      https://arxiv.org/html/2608.22339v1.
    RATIONALE: >-
      The paper's functional benchmark claims use task success, accuracy, and
      utility, so a nontrivial outstanding task is relevant. The paper names
      established benchmark endpoints but does not report an initial-state or
      no-op check for the evaluated instances. This records absent evidence,
      not evidence that any task was already complete.

  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    CRITERION: C2_RESOURCE_BALANCED_COMPARISON
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: ESTABLISHED
    FINAL_ADJUDICATED: NOT_ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Sections 3.3-3.4, 4.2, and 5.1; Appendix A.4;
      https://arxiv.org/html/2608.22339v1.
    RATIONALE: >-
      Fixed prompt budgets, equal-length probe controls, common tools and
      backbones, and AppWorld action counts address important resource
      dimensions. The principal BASM comparison also adds boundary checking
      and, in stateful environments, repair behavior, while condition-level
      runtime is not reported or explicitly bounded. The full frozen resource
      criterion is therefore not established, although the paper handles
      context length unusually well.

  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    CRITERION: D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: NOT_APPLICABLE
    FINAL_ADJUDICATED: NOT_APPLICABLE
    EVIDENCE: >-
      Official arXiv v1, Abstract, Section 5, and Table 3;
      https://arxiv.org/html/2608.22339v1.
    RATIONALE: >-
      BASM reports benchmark-level utility and attack-success marginals and
      does not claim that its security estimand is task-complete insecurity for
      a single requested feature. A joint task-by-security outcome would be
      necessary for the project's stronger estimand, but it is not required to
      interpret the paper's stated marginal safety and utility comparisons.

  - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
    CRITERION: D3_UNIT_AND_REPLICATION_VALIDITY
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: UNDETERMINED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Section 5.1, Tables 1-4, and Appendix A;
      https://arxiv.org/html/2608.22339v1.
    RATIONALE: >-
      Results are aggregated over distinct benchmark instances and model-by-
      memory configurations under near-deterministic decoding. The paper does
      not count repeated deterministic verifier invocations or duplicate seeds
      as independent evidence. The criterion does not require multiple seeds
      when no repeated runs are represented as independent units.

  - PAPER_ID: AGENT_SKILLS_CAN_BE_HARMFUL
    CRITERION: A1_TARGET_TASK_INCOMPLETENESS
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: NOT_APPLICABLE
    FINAL_ADJUDICATED: NOT_APPLICABLE
    EVIDENCE: >-
      Official arXiv v1, Sections III-A and III-D;
      https://arxiv.org/html/2608.11888v1.
    RATIONALE: >-
      The paper's unit is an outcome-defined contrast between completed skill
      configurations, with a successful same-task reference used to identify a
      regression. Its claim does not require showing that the repository began
      without a requested feature: a skill can degrade an initially adequate
      state. A no-op check would be required if these cases were repurposed as
      evidence about target feature completion.

  - PAPER_ID: AGENT_SKILLS_CAN_BE_HARMFUL
    CRITERION: C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Sections III-C and III-D and Tables I-II;
      https://arxiv.org/html/2608.11888v1.
    RATIONALE: >-
      Candidate skills and the complete potential pair space are generated by
      a fixed metadata-similarity rule before execution. Outcomes then define
      inclusion in the explicitly diagnostic failure corpus; they do not cause
      the delivered skill for an already executed target to be changed. This
      establishes locking for the paper's case-discovery claim, while the
      outcome-selected corpus cannot support a prevalence claim or a
      prospectively locked stronger transfer estimand without a new design.

  - PAPER_ID: SLBENCH
    CRITERION: D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE
    ORIGINAL_A: NOT_APPLICABLE
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: NOT_APPLICABLE
    EVIDENCE: >-
      Official arXiv v1, Sections 3.1-3.2 and 4;
      https://arxiv.org/html/2607.09016v1.
    RATIONALE: >-
      SLBench estimates compliance with logical relations using safe, unsafe,
      and inconclusive artifact evidence. It does not define security
      conditional on successful implementation or claim an effect on
      task-complete insecurity. A separate joint task/security endpoint would
      be needed only to reuse the setup for the stronger project estimand.

  - PAPER_ID: SLBENCH
    CRITERION: D3_UNIT_AND_REPLICATION_VALIDITY
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Sections 3.3 and 4.1-4.5 and Appendix H;
      https://arxiv.org/html/2607.09016v1.
    RATIONALE: >-
      The reported units are distinct source-grounded executable cases crossed
      with agent/backbone configurations; deterministic grading is measurement,
      not replication. Each configuration is executed once and the paper does
      not inflate evidence by treating repeated grading or duplicate seeds as
      independent. One realization limits stochastic stability claims but does
      not violate this criterion as frozen.

  - PAPER_ID: SWE_SKILLS_BENCH
    CRITERION: C3_APPROPRIATE_CONTROL_CONDITION
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Sections 3.4 and 4.1-4.2;
      https://arxiv.org/html/2603.15401v1.
    RATIONALE: >-
      The primary estimand is the total marginal effect of making the actual
      skill package available. The paired no-skill condition holds the task,
      repository, environment, agent, and verifier fixed and is appropriate
      for that total effect. It does not isolate semantic content from generic
      extra context, so such a mechanism interpretation remains outside what
      this rating establishes and requires another control for the stronger
      estimand.

  - PAPER_ID: SWE_SKILLS_BENCH
    CRITERION: D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Section 4.3 and Figure 5;
      https://arxiv.org/html/2603.15401v1.
    RATIONALE: >-
      The paper's detailed Linkerd mechanism case traces version, protocol,
      field, and extra-resource choices to concrete injected template regions
      and contrasts them with the no-skill reasoning. That distinguishes mere
      delivery from engagement for the case supporting the mechanism claim.
      The evidence is case-specific and is not a benchmark-wide uptake rate.

  - PAPER_ID: SWE_SKILLS_BENCH
    CRITERION: D3_UNIT_AND_REPLICATION_VALIDITY
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      Official arXiv v1, Sections 3.4 and 4.2, Equations 1-5, and Table 2;
      https://arxiv.org/html/2603.15401v1.
    RATIONALE: >-
      The paper defines distinct task tuples and reports paired task outcomes
      aggregated by skill. Deterministic verifier executions are not presented
      as replicate agent evidence, and no duplicate seeds are counted as new
      units. A single execution per condition and unmodelled clustering limit
      uncertainty and generalization, but the frozen criterion concerns unit
      interpretation and pseudoreplication rather than mandating reruns.

  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
    CRITERION: B2_SOURCE_FOCAL_SAFETY
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: NOT_APPLICABLE
    FINAL_ADJUDICATED: NOT_ESTABLISHED
    EVIDENCE: >-
      ACL 2026 Findings proceedings version, Sections 3.1 and 4.1 and
      Appendices A-B; https://aclanthology.org/2026.findings-acl.2091/.
    RATIONALE: >-
      The surprising exposure claim expressly characterizes accumulated
      experience as benign, making source-context safety relevant to that
      characterization. Source task sets are designated benign and separated
      from hazardous evaluation sets, but the source procedures are not
      independently exercised against the target's focal safety witness in
      their original contexts. The stronger focal-safety proposition is not
      established by benign task labels alone.

  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
    CRITERION: B4_EXPLICIT_APPLICABILITY_PREDICATE
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: ESTABLISHED
    FINAL_ADJUDICATED: NOT_ESTABLISHED
    EVIDENCE: >-
      ACL 2026 Findings proceedings version, Sections 3.1 and 4.1-4.3 and
      Appendix D.4; https://aclanthology.org/2026.findings-acl.2091/.
    RATIONALE: >-
      The study names benign, harmful, and safety-sensitive task classes and
      identifies execution-oriented transfer after observing behavior. It does
      not specify a procedure-level condition before evaluation that governs
      when the same procedure is safe to reuse. Broad source and target class
      labels therefore do not establish the frozen applicability-predicate
      requirement.

  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
    CRITERION: C2_RESOURCE_BALANCED_COMPARISON
    ORIGINAL_A: NOT_ESTABLISHED
    ORIGINAL_B: ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      ACL 2026 Findings proceedings version, Section 4.3 and Appendix D.5;
      https://aclanthology.org/2026.findings-acl.2091/.
    RATIONALE: >-
      For the stated claim that experience semantics rather than prompt length
      drives the safety change, the authors replace experience with an
      expanded safety instruction matched to the average experience length,
      while retaining target tasks, backbone, tools, and agent setup. Retrieval
      dose is also varied. Runtime is not a constrained resource or explanatory
      variable in this safety estimand, so the relevant delivery burdens are
      explicitly treated.

  - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
    CRITERION: D3_UNIT_AND_REPLICATION_VALIDITY
    ORIGINAL_A: UNDETERMINED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: NOT_ESTABLISHED
    EVIDENCE: >-
      ACL 2026 Findings proceedings version, Section 3.1 and Appendices C and
      D.3; https://aclanthology.org/2026.findings-acl.2091/.
    RATIONALE: >-
      The paper specifies nonzero sampling temperatures and repeated online
      evaluation intervals but does not disclose independent execution seeds
      or model dependence across successive measurements of the same evolving
      process. The accessible record therefore does not establish that
      stochastic executions and longitudinal observations are represented by
      defensible independent units. This is absence of support, not proof that
      an undisclosed analysis was defective.

  - PAPER_ID: SECUREVIBEBENCH
    CRITERION: A3_SECURE_TASK_COMPLETING_CONTROL
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      ACL 2026 paper, Section 3.1, Figure 4, Tables 3-4, and Appendix E;
      https://aclanthology.org/2026.acl-long.1107/.
    RATIONALE: >-
      The benchmark's correct-and-secure category requires the same generated
      patch to match the requested functional behavior, avoid the focal
      proof-of-vulnerability, and introduce no new static finding. Such states
      are observed, and Appendix E gives a same-task correct-and-secure example.
      The criterion requires existence of a secure task-completing state; it
      does not require a canonical secure control for every one of the 105
      tasks.

  - PAPER_ID: SECUREVIBEBENCH
    CRITERION: A4_FEATURE_RETENTION
    ORIGINAL_A: ESTABLISHED
    ORIGINAL_B: NOT_ESTABLISHED
    FINAL_ADJUDICATED: ESTABLISHED
    EVIDENCE: >-
      ACL 2026 paper, Section 3.1, Figure 4, and Appendix E;
      https://aclanthology.org/2026.acl-long.1107/.
    RATIONALE: >-
      A generated patch is classified correct and secure only when it satisfies
      the differential functional endpoint as well as the security endpoints.
      Appendix E contrasts correct-but-vulnerable and correct-and-secure patches
      for the same request. Security cannot be credited merely by omitting the
      feature under this joint category, so feature retention is established
      for the observed secure states.

