ABC_SCOPE_SUMMARY: >-
  ABC separates task validity, outcome validity, and benchmark reporting. It
  calls for verified task setup and ground truth, solvability or an oracle,
  clean and reproducible environments, strong and nontrivial outcome tests,
  appropriate baselines including a do-nothing agent, transparent artifacts,
  and uncertainty-aware interpretation.
ABC_EVIDENCE_LOCATIONS:
  - >-
    Official arXiv v5, Sections 3 and 4.1: task validity, trivial shortcuts,
    environment isolation, verified ground truth, solvability, and oracle
    solvers.
  - >-
    Official arXiv v5, Section 4.2: outcome validity, test quality, fuzzing,
    deterministic end-to-end tests, state matching, and anti-gaming checks.
  - >-
    Official arXiv v5, Section 4.3: artifacts, construct validity, uncertainty,
    interpretation, and baselines.
  - >-
    Official ABC.md at repository commit
    ae1124758098876db04336e1d8c6e419a139c6e3, items I.a-I.i, II.1-II.9,
    and III.1-III.13.

CLASSIFICATION_RULE: >-
  GENERIC_VALIDITY_PRINCIPLE is used when ABC states the same underlying
  requirement substantively, even if this audit applies it to a source or
  memory object. SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION is used when the
  frozen criterion adds a source-memory, transfer-predicate, joint-security,
  or treatment-selection requirement that ABC does not state substantively.

REQUIREMENT_CLASSIFICATIONS:
  A1_TARGET_TASK_INCOMPLETENESS:
    CLASSIFICATION: GENERIC_VALIDITY_PRINCIPLE
    ABC_OVERLAP: SUBSTANTIVE
    EVIDENCE: >-
      ABC Sections 3, 4.1, and 4.3 and checklist II.7-II.9 and III.13 address
      task validity, shortcuts, solvability, and a do-nothing baseline.
    BOUNDARY: >-
      The project's exact untouched, empty, and irrelevant-edit controls are a
      concrete operationalization, not a wholly new validity principle.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC requires verified ground truth and valid outcomes but does not require
      a task-completing state that specifically fails the focal security
      property.
    BOUNDARY: >-
      The conjunction of genuine task completion and focal insecurity is the
      specialized addition.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC's solvability and oracle-solver principles overlap, but ABC does not
      require the same requested task to have a demonstrated focal-secure
      completion state.
    BOUNDARY: >-
      The same-task functional-and-security positive control is specialized.
  A4_FEATURE_RETENTION:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC's outcome validity and state matching guard against trivial or
      incomplete solutions, but it does not state a security-repair feature-
      retention contrast.
    BOUNDARY: >-
      Retention across an insecure-to-secure repair is the specialized element.
  A5_FOCAL_SECURITY_WITNESS:
    CLASSIFICATION: GENERIC_VALIDITY_PRINCIPLE
    ABC_OVERLAP: SUBSTANTIVE
    EVIDENCE: >-
      ABC Section 4.2 and checklist I.c-I.g require accurate, discriminative,
      nontrivial outcome measurement, including strong program tests and state
      matching.
    BOUNDARY: >-
      An executable security witness is the domain-specific implementation of
      generic outcome validity; it is not claimed as an entirely new principle.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    CLASSIFICATION: GENERIC_VALIDITY_PRINCIPLE
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC Section 4.1 and checklist II.6-II.8 require verified ground truth,
      solvability, and an oracle solution.
    BOUNDARY: >-
      Applying that requirement to the donor procedure's source context is a
      transfer-specific placement of a generic correctness principle.
  B2_SOURCE_FOCAL_SAFETY:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: NONE
    EVIDENCE: >-
      ABC does not require a donated procedure to be tested against the same
      focal security property in its original context.
    BOUNDARY: >-
      Source correctness cannot substitute for focal source safety.
  B3_PROCEDURAL_RELEVANCE:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC reporting item III.5 asks benchmark authors to connect measured
      outcomes to intended constructs, but it does not require source and target
      to share the transferred procedural operation.
    BOUNDARY: >-
      Operation-level source-target relevance is a procedural-transfer
      specialization of construct validity.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: NONE
    EVIDENCE: >-
      ABC does not require a named precondition governing safe reuse of a
      particular source procedure.
    BOUNDARY: >-
      This criterion separates topical relevance from safe applicability.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: NONE
    EVIDENCE: >-
      ABC does not require evidence that one named safe-transfer condition is
      true at source and false at target.
    BOUNDARY: >-
      The directional source-to-target predicate shift identifies the transfer
      contrast rather than only benchmark quality.
  B6_NO_SECOND_MAJOR_MISMATCH:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC requires sound task environments and construct validity, but it does
      not formulate matched source-target pairs or require exclusion of a
      second comparably important incompatibility.
    BOUNDARY: >-
      Pair-level isolation of the intended transfer difference is the
      specialized causal requirement.
  C1_MEMORY_OR_SKILL_FIDELITY:
    CLASSIFICATION: GENERIC_VALIDITY_PRINCIPLE
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC Section 4.1 and checklist II.1-II.5 require specified tools, clean
      states, ground-truth isolation, and reproducible evaluation setup.
    BOUNDARY: >-
      Exact memory payload and delivery-route fidelity instantiate general
      treatment reproducibility for an in-context intervention.
  C2_RESOURCE_BALANCED_COMPARISON:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC addresses tool and environment comparability and transparent
      resource-limited reporting, but it does not require context, token,
      action, tool, and runtime differences introduced by memory delivery to be
      controlled or explicitly treated.
    BOUNDARY: >-
      Memory-induced resource balance is needed to distinguish procedural
      content from delivery burden.
  C3_APPROPRIATE_CONTROL_CONDITION:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC checklist III.12-III.13 requires useful baselines, but does not state
      a placebo capable of separating memory semantics from generic extra
      context or skill-loading effects.
    BOUNDARY: >-
      The specialized control depends on the memory-content estimand.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC checklist III.3-III.4 addresses data contamination and overfitting,
      but not locking a donor procedure before observing its target outcome.
    BOUNDARY: >-
      Outcome-blind source selection prevents target-result-guided treatment
      choice; it is distinct from train-test contamination.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC connects outcomes to constructs and encourages diagnostic evidence,
      but does not distinguish delivery of a memory from behavioral engagement
      with the focal procedure for a mechanism claim.
    BOUNDARY: >-
      Delivery-versus-uptake separation is specific to the procedural-memory
      mechanism.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    CLASSIFICATION: SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION
    ABC_OVERLAP: PARTIAL
    EVIDENCE: >-
      ABC requires valid task outcomes and warns against metric gaming, but
      does not require a joint task-by-security estimand that avoids conditioning
      security on a post-treatment success state.
    BOUNDARY: >-
      The joint endpoint identifies task-complete insecurity rather than either
      marginal task success or marginal security.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    CLASSIFICATION: GENERIC_VALIDITY_PRINCIPLE
    ABC_OVERLAP: SUBSTANTIVE
    EVIDENCE: >-
      ABC Sections 4.2-4.3 and checklist I.f.3 and III.9-III.10 address
      deterministic measurement, quantitative uncertainty, and statistical
      significance.
    BOUNDARY: >-
      The project's deterministic-duplicate rule is a concrete
      pseudoreplication safeguard within this generic principle.

CLASSIFICATION_COUNTS:
  GENERIC_VALIDITY_PRINCIPLE: 5
  SECURITY_PROCEDURAL_TRANSFER_SPECIALIZATION: 13
CONCLUSION: >-
  The final contract is not a replacement for ABC. Five requirements are
  direct or source-context applications of generic task, outcome,
  reproducibility, and replication validity. Thirteen refine the specific
  intervention: what procedure moved, whether it was correct and focal-safe,
  when it applies, how source and target differ, whether memory delivery is
  isolated, and whether the outcome is task-complete insecurity. Several have
  partial generic antecedents, so specialization is claimed only for their
  added procedural-transfer or joint-security content.
