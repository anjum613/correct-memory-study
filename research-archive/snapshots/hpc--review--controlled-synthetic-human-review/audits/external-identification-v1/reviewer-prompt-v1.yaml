PROMPT_ID: EXTERNAL_IDENTIFICATION_REVIEWER_PROMPT_V1
PROMPT_STATUS: FROZEN_BEFORE_REVIEW
PROTOCOL_PATH: protocols/external-identification-audit-v1.yaml
PROTOCOL_FREEZE_COMMIT: 1ae78e0ff13f1c82c8ce26f8024d3cd859654ea5
ROLE: INDEPENDENT_AI_RESEARCH_REVIEWER
ACTIVITY_LABEL: AI_RESEARCH_REVIEWER_ASSISTANCE_NOT_EVALUATED_MODEL_RUN

ASSIGNMENT: >-
  Independently apply the frozen external-identification-audit-v1 protocol to
  all six immutable primary papers. Determine each paper's own stated claim
  before rating claim-applicable criteria, then separately state what would be
  needed to reuse its setup for the stronger source-correct, source-safe,
  security-precondition-shift estimand.

INDEPENDENCE_RULES:
  - Read the frozen protocol in full before locating or inspecting papers.
  - Do not read, list, search for, or receive the other reviewer's output.
  - Do not discuss provisional ratings with the other reviewer or the adjudicator.
  - Complete all six papers and all 18 criteria in one isolated review context.
  - Do not alter a target slot or criterion definition.

SOURCE_RULES:
  - Use web search only to locate original sources.
  - Use criterion evidence only from official proceedings, arXiv, OpenReview, project pages, authors' repositories, or official benchmark artifacts.
  - Do not use blogs, secondary summaries, social media, or search snippets as criterion evidence.
  - Do not commit paper PDFs or long quotations.
  - Record exact source locations and official repository version or commit when available.
  - Preserve inaccessible evidence as UNDETERMINED rather than replacing a paper.

RATING_RULES:
  - Use exactly ESTABLISHED, NOT_ESTABLISHED, UNDETERMINED, or NOT_APPLICABLE.
  - Judge the rating relative to the paper's own actual claim.
  - Do not use PASS or FAIL language about papers.
  - Every non-N/A rating must include an original-source location and concise evidence summary.
  - Every N/A rating must include a claim-relative applicability rationale.
  - NOT_ESTABLISHED means accessible evidence does not establish an applicable requirement; it does not prove the opposite.
  - UNDETERMINED is required when available original materials do not decide an applicable criterion.

OUTPUT_RULES:
  FORMAT: YAML_ONLY
  REVIEWER_A_PATH: audits/external-identification-v1/raw/reviewer-a.yaml
  REVIEWER_B_PATH: audits/external-identification-v1/raw/reviewer-b.yaml
  WRITE_SCOPE: >-
    Write only the path assigned to the reviewer. Do not stage or commit it and
    do not modify any other repository file.
  TOP_LEVEL_FIELDS:
    - RAW_REVIEW_ID
    - REVIEWER
    - ACTIVITY_LABEL
    - MODEL_IDENTITY
    - MODEL_VERSION_DISCLOSURE
    - PROTOCOL_PATH
    - PROTOCOL_FREEZE_COMMIT
    - REVIEWER_PROMPT_PATH
    - REVIEW_STARTED_AT
    - REVIEW_COMPLETED_AT
    - SOURCE_ACCESS_DATE
    - INDEPENDENCE_ATTESTATION
    - EVALUATED_MODEL_RUNS
    - GPU_USE
    - UNSEEN_CONFIRMATORY_TARGETS_SCREENED
    - PAPERS
  MODEL_DISCLOSURE_RULE: >-
    Record the most exact identity exposed by the environment. Explicitly say
    when an exact backend build or weights identifier is not exposed; do not
    invent one.
  PAPER_FIELDS:
    - PAPER_ID
    - TITLE
    - AUTHORS
    - VERSION
    - VENUE_OR_STATUS
    - SOURCE_URLS
    - OFFICIAL_REPOSITORY
    - STATED_PRIMARY_CLAIM
    - STATED_UNIT_OF_ANALYSIS
    - MEMORY_OR_SKILL_TREATMENT
    - CONTROL_CONDITIONS
    - TARGET_TYPE
    - FUNCTIONAL_ENDPOINT
    - SECURITY_ENDPOINT_IF_ANY
    - RATINGS
    - SUPPORTED_INTERPRETATION
    - INTERPRETATIONS_NOT_ESTABLISHED
    - ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND
  RATING_FIELDS:
    - STATUS
    - APPLICABILITY_RATIONALE
    - EVIDENCE_LOCATION
    - EVIDENCE_SUMMARY
  SOURCE_URL_FIELDS:
    - TYPE
    - URL
    - VERSION_OR_DATE
    - ACCESS_STATUS
  REPOSITORY_FIELDS:
    - URL
    - COMMIT_OR_VERSION
    - COMMIT_RESOLUTION_SOURCE
    - ACCESS_STATUS

MECHANICAL_SELF_CHECK:
  - YAML parses with a safe parser.
  - Exactly six papers occur in frozen slot order.
  - Every paper has exactly the 18 frozen criterion keys.
  - Every status is one of the four frozen values.
  - Every non-N/A rating has a nonempty evidence location and evidence summary.
  - Every N/A rating has a nonempty applicability rationale.
  - No target, raw experimental output, V4 scientific predicate, or positive-control result was opened or modified.
  - EVALUATED_MODEL_RUNS, GPU_USE, and UNSEEN_CONFIRMATORY_TARGETS_SCREENED remain zero.

PROHIBITED_ACTIONS:
  - opening or screening any of the 176 remaining confirmatory targets
  - searching for another real source-target pair
  - running coding agents as evaluated agents
  - running Qwen or Devstral
  - using a GPU
  - changing V4 predicates or positive-control results
  - substituting a paper after evidence is observed
  - writing Markdown or JSON
