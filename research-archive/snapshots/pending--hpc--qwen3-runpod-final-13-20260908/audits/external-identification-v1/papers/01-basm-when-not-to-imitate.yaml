    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Aggregate benchmark comparisons require defensible task units
      and must not count deterministic repeats as independent evidence.
    EVIDENCE_LOCATION: Official arXiv v1, Section 5.1, Tables 1-4, and Appendix A; https://arxiv.org/html/2608.22339v1.
    EVIDENCE_SUMMARY: Results are aggregated over distinct benchmark instances and model-by-
      memory configurations under near-deterministic decoding. The paper does not count repeated
      deterministic verifier invocations or duplicate seeds as independent evidence. The criterion
      does not require multiple seeds when no repeated runs are represented as independent
      units.
SUPPORTED_INTERPRETATION: Within the reported tool-use benchmarks and model settings, explicit
  boundary content changes wrong-tool preferences and several benchmark outcomes beyond procedural-only
  and equal-length controls. The evidence supports a boundary-aware memory effect for these
  configurations.
INTERPRETATIONS_NOT_ESTABLISHED:
  - That every evaluated task rejects an initial no-op.
  - That source procedures are independently safe under the same focal security witness used
    at target.
  - That AgentDojo marginals identify task-complete insecurity for one requested feature.
  - That runtime and all other delivery resources are balanced, source selection is outcome-blind,
    or applicability is the sole major source-target mismatch.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - Per-target initial-state and no-op validation.
  - Same-request insecure and secure task-completing states with feature retention and one
    focal witness.
  - Source-context execution showing the transferred procedure is both functionally correct
    and focal-safe.
  - Pair-level evidence that a named security predicate is true at source and false at target
    without a second major mismatch.
  - Outcome-blind source locking, complete resource treatment, and a joint task-complete-security
    outcome.
