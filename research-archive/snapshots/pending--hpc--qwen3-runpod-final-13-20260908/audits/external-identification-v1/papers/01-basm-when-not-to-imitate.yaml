STATED_PRIMARY_CLAIM: Success-distilled procedural memories can increase wrong-tool confidence
  when a superficially similar task needs a different tool, while BASM's explicit applicability,
  risk, avoidance, and recovery fields improve task performance and reduce wrong-tool or attack
  outcomes relative to memory-free and procedural-skill baselines.
STATED_UNIT_OF_ANALYSIS: Benchmark instance under a model-scale and memory condition, aggregated
  within BFCL, AppWorld, and AgentDojo evaluations.
MEMORY_OR_SKILL_TREATMENT: Retrieved seven-field BASM records built from successful and failed
  contexts, compared with procedure-only and applicability-only skill memories under a fixed
  retrieval and prompt substrate.
CONTROL_CONDITIONS: Memory-free Base, Proc Skill, App Skill, fixed-token equal-length neutral
  and procedure controls for probes, and field-removal ablations.
TARGET_TYPE: Tool-use benchmark tasks, including inapplicable-function cases, repository/app
  workflows, and prompt-injection scenarios.
FUNCTIONAL_ENDPOINT: BFCL accuracy, AppWorld task success rate and average steps, and AgentDojo
  utility.
SECURITY_ENDPOINT_IF_ANY: AgentDojo attack success rate; wrong-tool margin and realized wrong-tool
  calls are additional reliability diagnostics.
REVIEWER_A_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper estimates benchmark-level memory effects and wrong-tool
      behavior, not whether a software feature absent at baseline was implemented; genuine
      pre-intervention feature absence is not needed for that stated claim.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Abstract and Section 5.1 define the benchmark
      endpoints.
    EVIDENCE_SUMMARY: The evaluated endpoints are benchmark accuracy, task success, utility,
      steps, and attack success rather than a fail-to-pass feature-addition intervention.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not estimate task-complete insecurity for a single
      requested implementation; its security result is an AgentDojo ASR comparison and therefore
      does not require this control.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Section 5.1 and Table 3.
    EVIDENCE_SUMMARY: AgentDojo utility and attack success are reported as benchmark metrics,
      not as a matched insecure task-completing implementation control.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: A matched secure task-completing implementation is not required
      for the paper's stated comparative benchmark claim.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Section 5.1 and Table 3.
    EVIDENCE_SUMMARY: The study compares memory conditions on aggregate benchmark metrics
      rather than matched secure implementation states.
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The study does not claim that a security repair to a target program
      retains a requested feature.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Abstract and Section 5.
    EVIDENCE_SUMMARY: No target-program secure-repair estimand is asserted.
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: An independently grounded safety endpoint is required for the
      claim that BASM reduces attack success.
    EVIDENCE_LOCATION: arXiv v1 Sections 5.1-5.3, Table 3, and Artifact Use Statement.
    EVIDENCE_SUMMARY: The study uses AgentDojo v1.2.2's official attack-success evaluation
      alongside utility and reports the framework version and official evaluation-script policy.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The claim explicitly concerns procedures distilled from past
      successes, so the source status of those procedural memories matters.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.1-4.2, especially Skill Extraction.
    EVIDENCE_SUMMARY: Procedure fields are extracted from successful task contexts, while
      failed contexts are used to add boundary and recovery information; deterministic validation
      is described before storage.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not claim that its successful source trajectories
      were demonstrated safe under the same focal AgentDojo security property; its own reliability
      comparison does not require that stronger claim.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections 4.2 and 5.1.
    EVIDENCE_SUMMARY: Source success is used for procedure extraction, but source-context
      focal security is not part of the stated estimand.
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The wrong-tool and boundary claims require retrieved memories
      to be procedurally relevant rather than arbitrary extra text.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1, 4.2, and 5.1.
    EVIDENCE_SUMMARY: Retrieval uses task similarity, and the diagnostic partitions relevant
      tasks into applicable, semantically similar but wrong-tool, and repair states around
      the retrieved procedure.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Explicit conditions governing whether a retrieved procedure should
      be followed are the central BASM intervention.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.1-4.2, seven-field BASM schema.
    EVIDENCE_SUMMARY: Each BASM record names applicability conditions, risk cues, avoidance
      rules, and recovery notes, and a boundary checker applies them before tool execution.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The paper's imitation-trap claim depends on a learned procedure
      being applicable in its successful context but inapplicable in a similar target state.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1-3.2 and Appendix A diagnostic-bucket definitions.
    EVIDENCE_SUMMARY: The study separates applicable tasks from semantically similar wrong-tool
      tasks that require rejecting the retrieved procedure and reports the corresponding wrong-tool
      margins.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: Interpreting the diagnostic as an applicability-boundary effect
      requires comparable source and target cases beyond the focal tool condition.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.1-3.2 and Appendix A.
    EVIDENCE_SUMMARY: The buckets enforce semantic similarity and distinguish tool applicability,
      but accessible aggregate descriptions do not expose item-level source-target matching
      sufficient to rule out another comparably important task or state mismatch.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The comparative BASM claim requires a defined, reproducible memory
      treatment.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.1-4.2 and Figure 3.
    EVIDENCE_SUMMARY: The seven record fields, extraction inputs, validation, retrieval, token-budget
      assembly, and boundary-checking delivery path are specified.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Resource differences are relevant because BASM adds fields and
      a checking step while the paper attributes differences to memory content.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.2 and 5.1; Appendix A equal-length controls and
      behavior analyses.
    EVIDENCE_SUMMARY: The paper fixes prompt token budgets, uses equal-length probe controls,
      keeps the backbone and retrieval substrate fixed, and reports AppWorld steps, but it
      does not establish balanced or measured runtime costs across the principal memory conditions.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The content-specific boundary claim needs comparisons beyond
      merely adding any text or any skill.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.3-3.4 and 5.1-5.3; Tables 3-4; Appendix A.
    EVIDENCE_SUMMARY: Base, procedure-only, applicability-only, BASM, field knockouts, and
      equal-token neutral/procedural controls separate generic memory loading from boundary-field
      content.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: Target-outcome-independent memory and diagnostic selection are
      needed for the comparative causal interpretation.
    EVIDENCE_LOCATION: arXiv v1 Sections 4.2 and 5.1.
    EVIDENCE_SUMMARY: The paper describes extraction, validation, retrieval, fixed benchmarks,
      and evaluation order, but does not provide a prospective freeze or enough artifact history
      to determine whether source skills and diagnostic cases were unchanged after target
      outcomes were seen.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: BASM's mechanism claim requires evidence that boundary fields
      alter model processing and realized tool behavior, not delivery alone.
    EVIDENCE_LOCATION: arXiv v1 Sections 3.3-3.4 and Appendix A attention and paired-behavior
      analyses.
    EVIDENCE_SUMMARY: Attention/probe analyses, boundary-field knockouts, realized tool calls,
      and paired outcomes connect delivered fields to behavioral engagement.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Because the paper reports both AgentDojo utility and attack success,
      a task-security joint analysis is relevant to interpreting their trade-off.
    EVIDENCE_LOCATION: arXiv v1 Table 3 and Sections 5.1-5.3.
    EVIDENCE_SUMMARY: Utility and ASR are reported side by side, but accessible results do
      not provide joint cells that distinguish task failure from task-complete insecurity
      for the same runs.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Aggregate benchmark comparisons require defensible task units
      and must not count deterministic repeats as independent evidence.
    EVIDENCE_LOCATION: arXiv v1 Section 5.1, Tables 3-4, and Appendix A.
    EVIDENCE_SUMMARY: Results are aggregated over distinct benchmark instances and model scales
      under near-deterministic decoding; no duplicate-seed count is presented as extra independent
      evidence.
REVIEWER_B_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Genuine outstanding goals are needed for the paper's benchmark-level
      task-success and accuracy claims.
    EVIDENCE_LOCATION: arXiv v1, Section 5.1 (Benchmarks), especially BFCL and AppWorld descriptions
    EVIDENCE_SUMMARY: BFCL requires an evaluated response and AppWorld evaluates completion
      of an interactive task, but the accessible paper does not report an explicit initial-state
      or no-op validation showing that every task supporting the aggregate claim begins incomplete
      and cannot already satisfy its endpoint without intervention.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper's safety claim is an aggregate AgentDojo attack-success
      claim, not an estimate of task-complete insecurity for one requested target feature.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: A same-request secure implementation control is not required
      for the stated aggregate utility and attack-success comparison.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not claim to repair a concrete target implementation
      while preserving a specified feature.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A grounded security endpoint is required for the claimed AgentDojo
      safety improvement.
    EVIDENCE_LOCATION: arXiv v1, Section 5.1 and Table 3
    EVIDENCE_SUMMARY: The study uses AgentDojo v1.2.2's official attack-success-rate endpoint
      and reports it separately from utility for every evaluated memory configuration.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The imitation-trap claim specifically concerns procedural content
      distilled from successful source experience.
    EVIDENCE_LOCATION: arXiv v1, Section 4.2, Equations 6-7; Section 5.1 (Models and baselines)
    EVIDENCE_SUMMARY: Goal, procedure, and tool fields are supplied by a successful logged
      context, and the procedural-memory baseline is explicitly distilled from successful
      past trajectories.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper's own claim requires successful source experience but
      does not assert that a source implementation was independently certified against the
      target's focal security property.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The central failure mode requires a retrieved procedure to be
      genuinely similar to the current operation while its tool choice is inapplicable.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1-3.3 and 4.2 (Retrieval and prompt formatting)
    EVIDENCE_SUMMARY: The probe defines an inapplicable bucket using semantically similar
      but incorrect tools, and retrieval combines semantic, tool, and goal/procedure overlap.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Explicit conditions governing when a skill should or should not
      be used are the paper's focal intervention.
    EVIDENCE_LOCATION: arXiv v1, Section 4.1, Equations 4-5
    EVIDENCE_SUMMARY: BASM has named applicability conditions, risk cues, avoidance rules,
      and recovery notes, and the paper states the decision roles of each field.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The paper's boundary-transfer account depends on applicability
      holding for a retrieved success pattern but failing at the current decision.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1-3.2 and 5.1 (BFCL miss_func and miss_param subsets)
    EVIDENCE_SUMMARY: The probe contrasts applicable and inapplicable decision-state buckets,
      and the BFCL missing-function and missing-parameter subsets require rejection of otherwise
      similar tool calls.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: Excluding other source-target incompatibilities matters to the
      claim that applicability boundaries, rather than another transfer difference, explain
      the imitation effect.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.1, 4.2, and 5.1
    EVIDENCE_SUMMARY: The paper defines safe and risky state buckets and relevance-aware retrieval,
      but the accessible version does not provide pair-level source-target construction details
      sufficient to exclude a second comparably important incompatibility for all probe or
      benchmark retrievals.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The method claim requires a defined, reproducible distinction
      among procedural, applicability-only, and boundary-aware memories.
    EVIDENCE_LOCATION: arXiv v1, Sections 4.1-4.2, Equations 4-12
    EVIDENCE_SUMMARY: The seven fields, extraction inputs, deterministic schema validation,
      retrieval score, token-budget formatter, boundary checker, and repair loop are operationally
      specified.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Resource and prompt differences must be addressed for the claimed
      boundary-semantics and efficiency effects.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.3-3.4 and 5.1; Appendix A.2 and A.4
    EVIDENCE_SUMMARY: Configurations share the retrieval substrate, backbone, tools, and evaluation
      pipeline; formatting uses a fixed token budget, steps are reported, equal-length padding
      controls address added context, and same-prompt knockouts hold prompt tokens fixed.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Separating boundary semantics from generic memory and added-context
      effects is part of the stated mechanism claim.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.3-3.4 and 5.1; Tables 3-4; Appendix A.4
    EVIDENCE_SUMMARY: Memory-free, procedural-only, applicability-only, full-BASM, equal-length
      padding, component ablation, and attention-knockout comparisons isolate several plausible
      alternatives.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: Outcome-blind construction matters when attributing benchmark
      and probe changes to the selected source memories.
    EVIDENCE_LOCATION: arXiv v1, Sections 4.2 and 5.1
    EVIDENCE_SUMMARY: Offline extraction and deterministic retrieval are described, but the
      accessible paper does not state when all source logs, library entries, thresholds, and
      probe examples were fixed relative to inspection of evaluated target outcomes.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The paper makes a mechanism claim about the agent reading and
      using boundary fields, not merely receiving them.
    EVIDENCE_LOCATION: arXiv v1, Sections 3.3-3.4; Appendix A.1-A.4
    EVIDENCE_SUMMARY: Decision-token attention, wrong-tool logits, state-dependent attention
      ratios, realized choices, and same-prompt span knockouts provide behavioral and intervention
      evidence of engagement.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper states separate benchmark-level utility and attack-success
      claims and does not define its estimand as task-complete insecurity on a single requested
      feature.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: UNDETERMINED
    APPLICABILITY_RATIONALE: The strength of benchmark and mechanism comparisons depends on
      how task instances and repeated stochastic executions are treated.
    EVIDENCE_LOCATION: arXiv v1, Section 5.1 and Appendix A.1-A.4
    EVIDENCE_SUMMARY: The paper reports 800 BFCL instances, 168 AppWorld tasks, four model
      scales, and temperature 0.001, but it does not disclose an execution repetition or seed
      protocol or enough dependence information to determine replication validity.
