    v1 paper.
  ACCESS_STATUS: NOT_REPORTED
STATED_PRIMARY_CLAIM: A differential comparison of a skill-guided run against a no-skill or
  semantically matched reference run can attribute functional failures and efficiency regressions
  to loaded skills; analysis of 307 retained cases identifies recurring root causes, including
  omissions, over-prescription, and excessive verification or implementation procedures.
STATED_UNIT_OF_ANALYSIS: A paired task-by-skill configuration meeting the paper's functional
  or efficiency differential-case definition; taxonomy counts are over 307 retained cases.
MEMORY_OR_SKILL_TREATMENT: Public skill documents selected by metadata similarity and loaded
  into OpenCode for SkillsBench and SWE-Skills-Bench tasks.
CONTROL_CONDITIONS: A run on the same task with no skill or with another semantically matched
  skill; task, verifier, agent, model, repository, and environment are held fixed within a
  pair.
TARGET_TYPE: Deterministically graded cross-domain and repository-level agent tasks drawn
  from SkillsBench and SWE-Skills-Bench.
FUNCTIONAL_ENDPOINT: Verifier outcome for functional cases; total tokens and wall-clock time
  with a material-regression threshold for efficiency cases.
SECURITY_ENDPOINT_IF_ANY:
REVIEWER_A_RATINGS:
  A1_TARGET_TASK_INCOMPLETENESS:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Attributing a functional failure to a skill presupposes a genuine
      task whose initial state or no-op does not already satisfy the verifier.
    EVIDENCE_LOCATION: arXiv v1 Sections III-A, III-D, and VIII Threats to Validity.
    EVIDENCE_SUMMARY: The framework requires a reference run to pass and manually removes
      verifier false positives, but the paper does not report a systematic pre-intervention/no-op
      check for all retained functional cases.
  A2_INSECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The study's endpoints are functional failure and efficiency,
      not a focal security property of a task-completing implementation.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A and III-D.
    EVIDENCE_SUMMARY: No task-complete insecurity estimand or security control is part of
      the stated analysis.
  A3_SECURE_TASK_COMPLETING_CONTROL:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: A secure task-completing state is not required for the paper's
      functional and cost attribution claims.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A and III-D.
    EVIDENCE_SUMMARY: The paper does not evaluate a focal security endpoint.
  A4_FEATURE_RETENTION:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not evaluate a secure repair whose functionality
      must be retained.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A and III-D.
    EVIDENCE_SUMMARY: Its task-success comparisons are not security-repair comparisons.
  A5_FOCAL_SECURITY_WITNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: No focal security claim is made.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Abstract and Section III-D.
    EVIDENCE_SUMMARY: The outcome definitions cover verifier success, token use, and execution
      time.
  B1_SOURCE_FUNCTIONAL_CORRECTNESS:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper evaluates loaded public skills directly and does not
      claim transfer from a procedure demonstrated correct in a separate source execution
      context.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-B and III-C.
    EVIDENCE_SUMMARY: Skills are selected as documents from public ecosystems, not as validated
      source executions.
  B2_SOURCE_FOCAL_SAFETY:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: Source-context focal safety is outside the paper's non-security
      attribution estimand.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Abstract and Section III.
    EVIDENCE_SUMMARY: No source or target security witness is defined.
  B3_PROCEDURAL_RELEVANCE:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The finding that seemingly relevant skills cause failures requires
      evidence that the compared skills are procedurally related to their tasks.
    EVIDENCE_LOCATION: arXiv v1 Sections III-B, III-C, IV, and V.
    EVIDENCE_SUMMARY: Skills are selected using name-and-description similarity with a stated
      threshold and top-k rule; retained cases are then examined through paired trajectories
      and root-cause review rather than being classified as harmful solely from metadata.
  B4_EXPLICIT_APPLICABILITY_PREDICATE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not estimate safe transfer across a named condition;
      it taxonomizes failures under the evaluated skill-task pairings.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Abstract and Sections III-V.
    EVIDENCE_SUMMARY: No paper-level claim requires a predeclared safe-transfer predicate.
  B5_SOURCE_TARGET_PSTAR_SHIFT:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: There is no claimed source-versus-target predicate transition.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A to III-C.
    EVIDENCE_SUMMARY: The design compares skill configurations on the same target task.
  B6_NO_SECOND_MAJOR_MISMATCH:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The study does not identify a source-target condition shift whose
      isolation would require ruling out a second mismatch.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A to III-C.
    EVIDENCE_SUMMARY: Its principal comparison is within-task across loaded-skill conditions.
  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Attribution to a loaded skill requires knowing which skill was
      delivered and whether it was loaded.
    EVIDENCE_LOCATION: arXiv v1 Sections III-B and III-C.
    EVIDENCE_SUMMARY: The pipeline fixes the OpenCode version and model, supplies up to six
      named skill configurations, and records the loaded skill and complete trajectory for
      each run.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Resource accounting is central to the efficiency-regression claim
      and relevant to functional attribution.
    EVIDENCE_LOCATION: arXiv v1 Sections III-A to III-D and V.
    EVIDENCE_SUMMARY: Within a pair the task, verifier, agent, model, repository, and environment
      are fixed; the study records skill loading, trajectories, tokens, and wall-clock time
      and explicitly defines a material efficiency threshold.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A successful, cheaper, or otherwise comparable reference is required
      for the paper's differential attribution.
    EVIDENCE_LOCATION: arXiv v1 Section III-A and Figure 2.
    EVIDENCE_SUMMARY: Each retained differential case compares the target skill run to a same-task
      no-skill or semantically matched-skill reference that passes or is materially cheaper,
      while all non-skill factors are fixed.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: The evaluated skills must be selected independently of their
      run outcomes even though the paper intentionally analyzes outcome-defined failures afterward.
    EVIDENCE_LOCATION: arXiv v1 Sections III-B to III-D.
    EVIDENCE_SUMMARY: Candidate skill configurations are fixed from benchmark-provided variants
      or from a documented metadata-similarity rule before execution; outcome criteria subsequently
      determine which completed pairs enter the failure corpus, rather than altering the delivered
      skill.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Root-cause attribution to a skill requires behavioral evidence
      beyond mere delivery.
    EVIDENCE_LOCATION: arXiv v1 Sections III-C, IV, V, and VI.
    EVIDENCE_SUMMARY: Loaded-skill records and complete paired trajectories are inspected
      for differential actions, omissions, tool use, and verification behavior; SkillTriage
      likewise extracts evidence from the pair.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper does not interpret a security endpoint conditional
      on task success.
    EVIDENCE_LOCATION: Not applicable; arXiv v1 Sections III-A and III-D.
    EVIDENCE_SUMMARY: Functional verdict and efficiency are the only evaluated outcome families.
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Differential attribution with a stochastic hosted model requires
      a defensible account of run-to-run variation at the paired-task unit.
    EVIDENCE_LOCATION: arXiv v1 Sections III-C, III-D, VI-B, and VIII Threats to Validity.
    EVIDENCE_SUMMARY: Base task configurations appear to be executed once; manual refinement
      removes cases judged consistent with ordinary variance, but no replicated task-run design
      estimates that variance. The three repeats and majority vote apply to SkillTriage reports,
      not to the underlying agent outcomes.
