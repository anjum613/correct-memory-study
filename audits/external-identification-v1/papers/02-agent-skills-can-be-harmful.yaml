  C1_MEMORY_OR_SKILL_FIDELITY:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Attribution to a loaded skill requires observing the delivered
      skill and execution record.
    EVIDENCE_LOCATION: arXiv v1, Sections II, III-C, and III-A
    EVIDENCE_SUMMARY: The paper defines skill-package contents, uses the normal loading interface,
      and records the loaded skill, complete trajectory, verifier result, token use, and execution
      time for each run.
  C2_RESOURCE_BALANCED_COMPARISON:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Resource accounting is required for the functional-attribution
      and efficiency-regression claims.
    EVIDENCE_LOCATION: arXiv v1, Sections III-A, III-C, and III-D
    EVIDENCE_SUMMARY: Pairs fix task, verifier, agent framework, model, repository or container,
      and data while changing skill setup; tokens and wall-clock execution time are recorded,
      and the efficiency rule requires both measures to worsen.
  C3_APPROPRIATE_CONTROL_CONDITION:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: A successful or cheaper reference execution is central to separating
      a skill-associated regression from base-agent task difficulty.
    EVIDENCE_LOCATION: arXiv v1, Section III-A and Figure 2
    EVIDENCE_SUMMARY: Every retained contrast uses the same task with either no skill or a
      semantically matched alternative skill as a pseudo-oracle; functional and efficiency
      case rules are stated explicitly.
  C4_OUTCOME_BLIND_SOURCE_OR_SKILL_SELECTION:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Outcome-blind skill/reference choice matters if retained pairs
      are interpreted as prospectively identified effects rather than a diagnostic case collection.
    EVIDENCE_LOCATION: arXiv v1, Sections III-C and III-D; Tables I-II
    EVIDENCE_SUMMARY: Candidate variants exist before execution, but the reported target and
      reference pairs are selected from up to six variants after observing which executions
      differ, then further filtered and deduplicated. The accessible evidence therefore does
      not establish outcome-blind selection for the final 307 cases.
  D1_UPTAKE_OR_BEHAVIORAL_ENGAGEMENT_MEASURED:
    STATUS: ESTABLISHED
    APPLICABILITY_RATIONALE: Root-cause attribution requires evidence that the loaded skill
      affected execution rather than mere delivery.
    EVIDENCE_LOCATION: arXiv v1, Sections II, III-C, IV-V, and VI-A
    EVIDENCE_SUMMARY: The study records skill loading and full tool/edit/test trajectories,
      manually traces divergences to skill sections, and makes SkillTriage cite differential
      skill or trajectory evidence.
  D2_TASK_AND_SECURITY_JOINTLY_INTERPRETABLE:
    STATUS: NOT_APPLICABLE
    APPLICABILITY_RATIONALE: The paper has no security endpoint and makes no task-complete-insecurity
      claim.
    EVIDENCE_LOCATION: ''
    EVIDENCE_SUMMARY: ''
  D3_UNIT_AND_REPLICATION_VALIDITY:
    STATUS: NOT_ESTABLISHED
    APPLICABILITY_RATIONALE: Single-run target/reference differences must be distinguished
      from ordinary agent variation for a skill-induced causal attribution.
    EVIDENCE_LOCATION: arXiv v1, Sections III-A, VI-B, and VII-B
    EVIDENCE_SUMMARY: Deterministic verifiers stabilize scoring, but the task executions themselves
      are single target/reference realizations. The threats section acknowledges ordinary
      agent variance, while the three repeated calls in Section VI-B rerun only the attribution
      procedure, not the benchmark tasks.
