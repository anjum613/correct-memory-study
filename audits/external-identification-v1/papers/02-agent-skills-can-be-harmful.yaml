SUPPORTED_INTERPRETATION: For the retained contrastive cases, trace and verifier or cost evidence
  associates particular loaded skills with functional regressions or large cost regressions
  relative to a same-task reference. The taxonomy describes recurring mechanisms in this deliberately
  outcome-selected diagnostic corpus.
INTERPRETATIONS_NOT_ESTABLISHED:
  - A population prevalence or average causal effect for harmful skills.
  - A focal security effect or a source-safe applicability-predicate shift.
  - Robustness of each single-execution contrast to independent reruns.
  - Prospective outcome-blind reuse of a retained case for the stronger transfer estimand;
    corpus inclusion is intentionally outcome-defined.
ADDITIONAL_EVIDENCE_REQUIRED_FOR_OUR_ESTIMAND:
  - A prospectively locked source procedure demonstrated correct and focal-safe in its source
    context.
  - A named security applicability predicate verified true at source and false at a matched
    target without a second major mismatch.
  - Target no-op validation, insecure and secure task-completing states, feature retention,
    and an executable focal security witness.
  - A resource-matched memory-content comparison, focal uptake evidence, joint task/security
    scoring, and repeated executions where needed.
