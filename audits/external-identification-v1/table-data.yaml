CLAIM_DESIGN_GAP_BY_PAPER:
  ROW_COUNT: 6
  ROWS:
    - PAPER_ID: BASM_WHEN_NOT_TO_IMITATE
      STATED_CLAIM: Success-distilled procedural memories can increase wrong-tool confidence
        when a superficially similar task needs a different tool, while BASM's explicit applicability,
        risk, avoidance, and recovery fields improve task performance and reduce wrong-tool
        or attack outcomes relative to memory-free and procedural-skill baselines.
      DESIGN_ESTABLISHES: Within the reported tool-use benchmarks and model settings, explicit
        boundary content changes wrong-tool preferences and several benchmark outcomes beyond
        procedural-only and equal-length controls. The evidence supports a boundary-aware
        memory effect for these configurations.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - Per-target initial-state and no-op validation.
        - Same-request insecure and secure task-completing states with feature retention and
          one focal witness.
        - Source-context execution showing the transferred procedure is both functionally
          correct and focal-safe.
        - Pair-level evidence that a named security predicate is true at source and false
          at target without a second major mismatch.
        - Outcome-blind source locking, complete resource treatment, and a joint task-complete-security
          outcome.
    - PAPER_ID: AGENT_SKILLS_CAN_BE_HARMFUL
      STATED_CLAIM: A differential comparison of a skill-guided run against a no-skill or
        semantically matched reference run can attribute functional failures and efficiency
        regressions to loaded skills; analysis of 307 retained cases identifies recurring
        root causes, including omissions, over-prescription, and excessive verification or
        implementation procedures.
      DESIGN_ESTABLISHES: For the retained contrastive cases, trace and verifier or cost evidence
        associates particular loaded skills with functional regressions or large cost regressions
        relative to a same-task reference. The taxonomy describes recurring mechanisms in
        this deliberately outcome-selected diagnostic corpus.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - A prospectively locked source procedure demonstrated correct and focal-safe in its
          source context.
        - A named security applicability predicate verified true at source and false at a
          matched target without a second major mismatch.
        - Target no-op validation, insecure and secure task-completing states, feature retention,
          and an executable focal security witness.
        - A resource-matched memory-content comparison, focal uptake evidence, joint task/security
          scoring, and repeated executions where needed.
    - PAPER_ID: SLBENCH
      STATED_CLAIM: 'Logical-relation following is a distinct reliability challenge for skill-guided
        agents: an 86-case executable benchmark reveals substantial unsafe relation-violation
        rates across agents and backbones, and making latent relations explicit through SLGuard
        reduces violations on targeted original-violation cases.'
      DESIGN_ESTABLISHES: For the curated source-grounded cases, the evaluated agents often
        produce artifact-level violations of explicit skill relations. Deterministic graders,
        inconclusive outcomes, safe-control cases, and targeted SLGuard comparisons support
        the paper's relation-following claim.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - A genuinely incomplete target and joint functional/security controls with feature
          retention.
        - A source execution proving procedural correctness and focal safety.
        - A named predicate verified true at source and false at target, with procedural relevance
          and no second major mismatch.
        - Outcome-blind source locking, a resource-matched semantic control, focal uptake
          evidence, and joint task/security outcomes.
    - PAPER_ID: SWE_SKILLS_BENCH
      STATED_CLAIM: Controlled with-skill versus without-skill evaluation on approximately
        565 requirement-driven software-engineering tasks shows limited average marginal utility,
        sometimes large token overhead, benefits concentrated in specialized skills, and a
        small number of negative deltas attributed to project-context incompatibility.
      DESIGN_ESTABLISHES: For the generated task suite and single Claude Code/Haiku 4.5 configuration,
        making the selected skill available changes average functional success little and
        increases average token use. The Linkerd trace supports one concrete context-interference
        mechanism.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - Per-task initial-state and no-op validation.
        - A source execution demonstrated correct and focal-safe under the same security witness.
        - A named security predicate and a matched source-target pair differing on that predicate
          without a second major mismatch.
        - Same-request insecure and secure task-completing states with feature retention and
          an executable security witness.
        - Resource-matched content controls, outcome-blind source assignment, systematic focal
          uptake, joint outcomes, and appropriate reruns.
    - PAPER_ID: EXPERIENCE_DRIVEN_SELF_EVOLVING_SAFETY
      STATED_CLAIM: Experience accumulated from benign tasks can increase attack success on
        later high-risk web and embodied tasks; retrieved execution-oriented content, rather
        than prompt length alone, contributes to this degradation, while refusal-containing
        experience reduces unsafe behavior at the cost of over-refusal on benign tasks.
      DESIGN_ESTABLISHES: Across the reported frameworks, backbones, and safety benchmarks,
        retrieved experience increases unsafe compliance relative to the pre-evolution or
        no-experience state. Length-matched controls, dose patterns, behavioral cases, and
        attribution analyses support an execution-oriented content mechanism; refusal experience
        exposes a safety-utility trade-off.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - One concrete source procedure shown correct and focal-safe under the same witness.
        - A predeclared procedure-level predicate shown true at source and false at a closely
          matched target, with other major mismatches excluded.
        - A genuinely incomplete legitimate target with task-completing insecure and secure
          controls and feature retention.
        - A joint task-completion/security endpoint, outcome-blind source assignment, focal
          uptake evidence, and independent repetitions.
    - PAPER_ID: SECUREVIBEBENCH
      STATED_CLAIM: Reconstructed vulnerability-introducing scenarios provide realistic repository-level
        secure-coding tasks with joint functional, dynamic focal-vulnerability, and static
        new-risk evaluation; across evaluated agents and models, even the best configuration
        produces only 23.8% solutions classified correct and secure.
      DESIGN_ESTABLISHES: On 105 reconstructed C/C++ scenarios, generated patches are jointly
        classified by differential functionality, a dynamic focal vulnerability witness, and
        static new-risk findings. The benchmark contains task-completing vulnerable and secure
        states and keeps security interpretable alongside functionality.
      ADDITIONAL_EVIDENCE_FOR_STRONGER_SECURITY_TRANSFER_CLAIM:
        - A systematic untouched-repository no-op check.
        - A source procedural memory demonstrated functionally correct and safe under the
          same focal witness.
        - Evidence of shared procedure, a named predicate true at source and false at target,
          and no second major mismatch.
        - Faithful and outcome-blind memory assignment, resource-matched content controls,
          direct uptake measurement, and repeated comparisons.
        - The existing joint outcome categories, dynamic witness, and observed secure and
          vulnerable functional states can support the target-outcome component after the
          no-op gap is addressed.
INTERPRETATION_BOUNDARY: Cells are claim-relative ratings, not paper grades. NOT_APPLICABLE
  means the criterion is not required for that paper's stated estimand. Counts over this deliberately
  selected set are not literature prevalence estimates.
