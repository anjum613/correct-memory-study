agent:
  step_limit: 15
  cost_limit: 0.0
  wall_time_limit_seconds: 450
  max_consecutive_format_errors: 3
environment:
  timeout: 60
model:
  model_name: openai/Qwen/Qwen2.5-Coder-1.5B-Instruct
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://127.0.0.1:8000/v1
    temperature: 0
    max_tokens: 512
    drop_params: true
