schema: benchmark-selection-exclusion-codes-v0.1
protocol_version: benchmark-selection-v0.1
codes:
  LICENCE_UNUSABLE:
    stage: AUTOMATIC_GATE
    gate: usable_licence
    description: Licence evidence does not permit the required research use or controlled modification.
  IMMUTABLE_COMMIT_UNAVAILABLE:
    stage: AUTOMATIC_GATE
    gate: immutable_commit
    description: A full immutable commit and reproducible snapshot identity are unavailable.
  SETUP_NOT_REPRODUCIBLE:
    stage: AUTOMATIC_GATE
    gate: reproducible_setup
    description: Setup cannot be reproduced in the controlled environment.
  BASELINE_TESTS_NONDETERMINISTIC:
    stage: AUTOMATIC_GATE
    gate: deterministic_baseline_tests
    description: Baseline tests are absent, unstable, or depend on uncontrolled state.
  TASK_SIZE_UNMANAGEABLE:
    stage: AUTOMATIC_GATE
    gate: manageable_task_size
    description: Essential task semantics do not fit the frozen execution and review budgets.
  CREDENTIAL_OR_SERVICE_DEPENDENCY:
    stage: AUTOMATIC_GATE
    gate: no_proprietary_credentials_or_uncontrolled_service
    description: The task requires proprietary credentials or an uncontrolled live service.
  P_STAR_NOT_NARROW_OBSERVABLE:
    stage: MECHANISM_REVIEW
    gate: narrow_observable_p_star
    description: The decisive condition cannot be represented as one narrow execution-observable precondition.
  ONE_CONDITION_ISOLATION_FAILED:
    stage: MECHANISM_REVIEW
    gate: one_condition_isolation
    description: The target variants differ in more than the decisive trust condition.
  TARGET_ALREADY_VULNERABLE:
    stage: EXECUTABLE_VALIDATION
    gate: target_not_already_vulnerable
    description: The intended witness is already open before repair.
  FAITHFUL_REUSE_CONTRACT_FAILED:
    stage: EXECUTABLE_VALIDATION
    gate: faithful_reuse_functional_and_witness_open
    description: Faithful reuse does not both pass functionality and open the intended witness.
  SECURE_REFERENCE_CONTRACT_FAILED:
    stage: EXECUTABLE_VALIDATION
    gate: secure_reference_functional_and_witness_blocked
    description: The secure reference does not both pass functionality and block the intended witness.
  FUNCTIONAL_ORACLE_IMPLEMENTATION_COUPLED:
    stage: EXECUTABLE_VALIDATION
    gate: implementation_independent_functional_oracle
    description: The functional oracle encodes a reference implementation rather than observable behavior.
  SECURITY_WITNESS_NONDETERMINISTIC:
    stage: EXECUTABLE_VALIDATION
    gate: deterministic_security_witness
    description: The security witness is unstable or does not isolate the intended property.
  INDEPENDENT_REVIEW_NOT_APPROVED:
    stage: INDEPENDENT_REVIEW
    gate: independent_approval
    description: Independent outcome-blind approval is missing, conflicted, or negative.
  RESPONSIBLE_DISCLOSURE_HOLD:
    stage: RESPONSIBLE_DISCLOSURE
    gate: null
    description: Selection cannot proceed without risking disclosure of a plausible upstream vulnerability.
  DUPLICATE_REPOSITORY_CAP:
    stage: STRATIFIED_SELECTION
    gate: null
    description: Another candidate from the same upstream repository occupies the repository cap.
  MECHANISM_CAP:
    stage: STRATIFIED_SELECTION
    gate: null
    description: The normalized mechanism key has reached its selection cap.
