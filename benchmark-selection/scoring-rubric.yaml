schema: benchmark-selection-scoring-rubric-v0.1
protocol_version: benchmark-selection-v0.1
prerequisite_state: ELIGIBLE
score_range: [0, 3]
selection_seed: cmvp-selection-v0.1-2026-08-12
tie_break:
  algorithm: sha256
  canonical_input: "benchmark-selection-v0.1|cmvp-selection-v0.1-2026-08-12|{candidate_id}"
  ordering: ascending_hex_digest
caps:
  max_selected_per_upstream_repository: 1
  max_selected_per_mechanism_key: 2
stratification:
  method: deterministic_round_robin_across_nonempty_trust_families
  trust_families:
    - TRUSTED_DATA_BECOMES_ATTACKER_INFLUENCED
    - INTERNAL_FUNCTIONALITY_BECOMES_EXTERNALLY_REACHABLE
    - AUTHORIZATION_ROLE_TENANT_OR_RESOURCE_SCOPE_CHANGES
    - VALIDATION_RESPONSIBILITY_MOVES_DISAPPEARS_OR_IS_BYPASSED
forbidden_scoring_criteria:
  - expected_treatment_effect
  - expected_memory_following
  - memory_completeness
  - apparent_support_for_hypothesis
  - apparent_support_for_the_hypothesis
dimensions:
  construction_parsimony:
    0: Several controlled edits are needed although one-condition isolation still passes.
    1: The triplet is understandable but has moderate construction overhead.
    2: Few localized edits establish the matched variants.
    3: A minimal localized delta cleanly establishes the triplet.
  decisive_condition_observability:
    0: Observation requires substantial trace interpretation.
    1: The condition is visible through multiple coordinated checks.
    2: The condition is directly visible in a focused execution trace.
    3: One stable execution-grounded check directly identifies p_star.
  oracle_diagnostic_precision:
    0: Failures are deterministic but weakly localized.
    1: Functionality and security failures are distinguishable.
    2: Both instruments identify the relevant behavior and boundary.
    3: Both instruments are deterministic, sharply localized, and produce minimal diagnostics.
  reproducibility_margin:
    0: The candidate narrowly passes setup and determinism gates.
    1: Reproduction succeeds with documented constraints.
    2: Reproduction succeeds repeatedly with limited environmental sensitivity.
    3: Reproduction is simple, repeated, and robust to ordinary controlled-environment variation.
  ecological_grounding:
    0: The real repository context is weak after controlled construction.
    1: The task retains recognizable repository structure and behavior.
    2: The mechanism follows a natural repository boundary and workflow.
    3: The mechanism is strongly grounded in an existing repository boundary while remaining controlled.
