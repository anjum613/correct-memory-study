[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpilot"
version = "0.1.0"
description = "Initial engineering scaffold for controlled coding-agent experiments"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]
securevibebench-development = ["pyarrow==21.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
