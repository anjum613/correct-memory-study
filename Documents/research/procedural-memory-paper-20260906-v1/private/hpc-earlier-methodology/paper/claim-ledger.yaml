CLAIMS:
  - CLAIM_ID: C001_V1_FUNCTIONALITY_NOT_TASK_COMPLETION
    CLAIM_TEXT: >-
      V1 functionality did not identify completion of the requested coding
      task: 46 of 48 trajectories passed that endpoint despite 46 empty final
      patches, and untouched, empty, irrelevant-edit, nominal faithful-reuse,
      and safe-repair states all passed it in every one of six families.
    INFERENTIAL_STATUS: FORMATIVE_V1_AUDIT
    SUPPORTING_ARTIFACTS:
      - artifacts/v2-preflight/v2-preflight-report.md
      - artifacts/v2-preflight/control-matrix.json
      - artifacts/v2-preflight/v1-immutability.json
      - /home/s224049759/final-experiment-artifacts/post-primary-strengthening-v1/analysis-summary.md
    NUMERIC_EVIDENCE:
      FUNCTIONALITY_PASS: "46/48"
      EMPTY_FINAL_PATCH: "46/48"
      CONTROL_STATES_FUNCTIONALITY_PASS: "5 state types x 6/6 families"
    ALLOWED_SCOPE: >-
      The frozen V1 endpoint and its six-family task-oracle control audit.
    PROHIBITED_GENERALIZATION: >-
      Do not infer that functionality tests in other evaluations are invalid,
      or that the evaluated models could never complete a well-identified task.

